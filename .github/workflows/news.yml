name: 每日房市與法規新聞

on:
  schedule:
    - cron: "0 2 * * *"   # UTC 02:00 = 台灣時間 10:00（GitHub 排程尖峰時可能延遲數分鐘）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取今日資訊
        run: python scripts/fetch_news.py
      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/data
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "news: $(TZ=Asia/Taipei date +%F) 每日資訊"
            git push
          fi
