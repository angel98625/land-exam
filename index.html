<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地政士考試題庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#eef1ec; --sheet:#fbfcf9; --ink:#1f2a24; --muted:#5d6b62; --rule:#cfd7cf;
  --seal:#b3261e; --seal-soft:#f6e3e0;
  --ok:#2f6b45; --ok-soft:#e1efe5; --bad:#a1361f; --bad-soft:#f7e4dd;
  --tag:#e7ece4;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151a17;--sheet:#1d2420;--ink:#e6ece7;--muted:#9aa89f;--rule:#34403a;--tag:#26302a;
  --seal:#e8695d;--seal-soft:#3a2321;--ok:#7cc796;--ok-soft:#1f3326;--bad:#f08c72;--bad-soft:#3b231c;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#151a17;--sheet:#1d2420;--ink:#e6ece7;--muted:#9aa89f;--rule:#34403a;--tag:#26302a;
  --seal:#e8695d;--seal-soft:#3a2321;--ok:#7cc796;--ok-soft:#1f3326;--bad:#f08c72;--bad-soft:#3b231c;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 var(--sans);padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:14px}
h1{font:900 clamp(28px,5vw,40px)/1.15 var(--serif);margin:0;letter-spacing:.04em;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
.stamp{font:700 13px/1 var(--serif);color:var(--seal);border:2px solid var(--seal);padding:8px 10px;border-radius:4px;transform:rotate(-4deg);letter-spacing:.2em;white-space:nowrap}

.toolbar{display:grid;gap:10px}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group-label{font-size:12px;letter-spacing:.12em;color:var(--muted);margin-right:4px;min-width:2.5em}
.chip{font:500 14px var(--sans);border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip .n{font:500 12px var(--mono);color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
select.chip{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;max-width:100%}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible,.card-flip:focus-visible{outline:3px solid var(--seal);outline-offset:2px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}

.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;min-width:0}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--muted)}
.head-l{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.law-tag{font-weight:700;color:var(--ink)}
.topic{background:var(--tag);color:var(--ink);border-radius:4px;padding:1px 8px;font-size:12.5px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.progress{height:3px;background:var(--rule)}
.progress>i{display:block;height:100%;background:var(--seal);transition:width .3s}
.sheet-body{padding:22px 20px 24px;display:grid;gap:18px}
.q{font:600 clamp(18px,2.6vw,21px)/1.6 var(--serif);margin:0;text-wrap:pretty}

.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;text-align:left;font:15px/1.6 var(--sans);color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:6px;padding:10px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{font:500 13px/24px var(--mono);text-align:center;border:1px solid var(--rule);border-radius:4px;height:24px}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .k{background:var(--ok);color:var(--sheet);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:var(--sheet);border-color:var(--bad)}
.opt.dim{opacity:.55}

.explain{border-top:1px dashed var(--rule);padding-top:16px;display:grid;gap:8px}
.verdict{font:700 15px var(--sans)}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.cite{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--serif);color:var(--seal);border:1.5px solid var(--seal);background:var(--seal-soft);border-radius:4px;padding:2px 10px;justify-self:start}
.explain p{margin:0;color:var(--ink);max-width:62ch}

.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.btn{font:700 15px var(--sans);padding:9px 18px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

.card-flip{display:block;width:100%;text-align:left;background:transparent;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.face-label{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.answer{font:600 18px/1.6 var(--serif);color:var(--ok);margin:4px 0 0}
.hint{font-size:13px;color:var(--muted)}

aside{display:grid;gap:16px}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:16px 18px;display:grid;gap:12px}
.panel h2{font:700 15px var(--serif);margin:0;letter-spacing:.06em}
.big{font:500 34px/1 var(--mono);font-variant-numeric:tabular-nums}
.big small{font-size:14px;color:var(--muted);margin-left:4px;font-family:var(--sans)}
.rows{display:grid;gap:10px}
.row{display:grid;gap:4px;font-size:13px}
.row-top{display:flex;justify-content:space-between;gap:8px}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.panel .btn{width:100%}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0}
.note a{color:inherit}
.done{text-align:center;display:grid;gap:12px;justify-items:center;padding:12px 0}
.done .big{font-size:48px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>地政士考試題庫</h1>
      <p class="sub">依專技普考地政士四科整理的法條背誦考點，每科 100 題，共 400 題：土地法規、土地稅法規、土地登記、民法與信託法。每題作答後附條號與解析。</p>
    </div>
    <div class="stamp" aria-hidden="true">登記完畢</div>
  </header>

  <div class="toolbar">
    <div class="group" role="group" aria-label="科目" id="subjects"></div>
    <div class="group">
      <span class="group-label">考點</span>
      <select class="chip" id="topic" aria-label="考點"></select>
    </div>
    <div class="group" role="group" aria-label="模式">
      <span class="group-label">模式</span>
      <button class="chip" data-mode="quiz" aria-pressed="true">測驗</button>
      <button class="chip" data-mode="card" aria-pressed="false">閃卡</button>
      <button class="chip" data-mode="wrong" aria-pressed="false">錯題複習</button>
    </div>
  </div>

  <div class="main">
    <section class="sheet" aria-live="polite">
      <div class="sheet-head">
        <span class="head-l"><span class="law-tag" id="law-tag"></span><span class="topic" id="topic-tag" hidden></span></span>
        <span class="num" id="counter"></span>
      </div>
      <div class="progress"><i id="prog" style="width:0"></i></div>
      <div class="sheet-body" id="body"></div>
    </section>

    <aside>
      <div class="panel">
        <h2>本輪成績</h2>
        <div class="big" id="score">0<small>/ 0 題</small></div>
        <div class="rows" id="by-law"></div>
        <button class="btn ghost" id="restart">重新洗牌</button>
      </div>
      <div class="panel">
        <h2>錯題本</h2>
        <div class="big" id="wrong-count">0<small>題待複習</small></div>
        <p class="note">答錯的題目會留在這台裝置的瀏覽器裡，答對一次就會移出。</p>
        <button class="btn ghost" id="clear-wrong">清空錯題本</button>
      </div>
      <p class="note">條文依 2026 年 10 月現行法整理，主要條號已對照全國法規資料庫。正式引用請以<a href="https://law.moj.gov.tw/" target="_blank" rel="noopener">全國法規資料庫</a>為準。鍵盤：1–4 作答，Enter 下一題，閃卡模式按空白鍵翻面、左右鍵換卡。</p>
    </aside>
  </div>
</div>

<script>
const SUBJECTS = ["土地法規","土地稅法規","土地登記","民法與信託法"];
const BANK = [
{"s":"土地法規","t":"土地法總則","art":"土地法 第1條","q":"土地法所稱之「土地」，其定義為何？","o":["地表及其上之建築改良物","水陸及天然富源","經登記之陸地及其定著物","地政機關列管之一切不動產"],"a":1,"e":"土地法開宗明義將土地界定為水陸及天然富源，範圍不限於陸地，也包含水面與天然資源。"},
{"s":"土地法規","t":"土地法總則","art":"土地法 第14條","q":"下列何者依土地法第 14 條「不得」為私有？","o":["林地","山坡地","名勝古蹟","農牧用地"],"a":2,"e":"不得私有之土地包括海岸一定限度內之土地、天然形成之湖澤而為公共需用者、可通運之水道、公共交通道路、礦泉地、瀑布地、公共需用之水源地、名勝古蹟等。已成為私有者，得依法徵收。"},
{"s":"土地法規","t":"外國人地權","art":"土地法 第17條","q":"下列哪一種土地，依法「不得」移轉、設定負擔或租賃於外國人？","o":["都市計畫住宅區土地","林地","工業區土地","商業區土地"],"a":1,"e":"林地、漁地、狩獵地、鹽地、礦地、水源地、要塞軍備區域及領域邊境之土地，不得移轉、設定負擔或租賃於外國人。其他土地則依第 18 條採平等互惠原則。"},
{"s":"土地法規","t":"公有土地","art":"土地法 第25條","q":"直轄市或縣（市）政府處分公有土地，或為超過幾年期間之租賃，應經民意機關同意並經行政院核准？","o":["三年","五年","十年","二十年"],"a":2,"e":"處分、設定負擔或為超過十年期間之租賃，均應經該管區內民意機關同意，並經行政院核准。"},
{"s":"土地法規","t":"共有土地","art":"土地法 第34條之1","q":"共有土地之處分，依多數決的同意門檻為何？","o":["共有人全體同意","共有人過半數，或應有部分合計過半數","共有人過半數及其應有部分合計過半數；應有部分合計逾三分之二者，人數不予計算","應有部分合計逾二分之一，人數不予計算"],"a":2,"e":"人數與應有部分須「雙過半」；若同意者的應有部分合計已逾三分之二，就不必再看人數。"},
{"s":"土地法規","t":"共有土地","art":"土地法 第34條之1 第4項","q":"共有人出賣其應有部分時，他共有人享有何種權利？","o":["撤銷買賣契約之權","以同一價格共同或單獨優先承購之權","請求分割共有物之權","請求出賣人賠償之權"],"a":1,"e":"他共有人得以同一價格共同或單獨優先承購，目的在減少共有人數、簡化共有關係。"},
{"s":"土地法規","t":"房屋租用","art":"土地法 第97條、第99條","q":"城市地方房屋之租金與擔保金，土地法所定上限為何？","o":["租金不超過申報總價年息 8%，擔保金不超過一個月租金","租金不超過申報總價年息 10%，擔保金不超過二個月租金","租金不超過申報總價年息 12%，擔保金不超過三個月租金","租金不超過申報總價年息 10%，擔保金不超過三個月租金"],"a":1,"e":"第 97 條：租金以不超過土地及其建築物申報總價年息 10% 為限。第 99 條：擔保金不得超過二個月房屋租金之總額，超過部分得以抵付房租。"},
{"s":"土地法規","t":"優先購買權","art":"土地法 第104條","q":"基地出賣時，下列何者「不」享有依同樣條件優先購買之權？","o":["地上權人","典權人","基地承租人","抵押權人"],"a":3,"e":"基地出賣時，地上權人、典權人或承租人有優先購買權；房屋出賣時，基地所有權人亦有之。優先權人應於接到出賣通知後十日內表示，逾期視為放棄。"},
{"s":"土地法規","t":"耕地租用","art":"土地法 第110條","q":"依土地法，耕地地租不得超過地價的多少？","o":["百分之五","百分之八","百分之十","千分之三百七十五"],"a":1,"e":"地租不得超過地價百分之八。另依耕地三七五減租條例，地租不得超過主要作物正產品全年收穫總量千分之三百七十五，兩者不要混淆。"},
{"s":"土地法規","t":"規定地價","art":"平均地權條例 第14條、第46條","q":"關於地價的公告週期，下列何者正確？","o":["公告地價每年重新規定，公告土地現值每二年公告","公告地價每二年重新規定，公告土地現值每年一月一日公告","兩者均每年七月一日公告","兩者均每三年重新規定"],"a":1,"e":"規定地價後每二年重新規定地價一次（第 14 條），作為地價稅稅基；公告土地現值則於每年一月一日公告（第 46 條），作為土地增值稅與徵收補償的基準。"},
{"s":"土地法規","t":"規定地價","art":"平均地權條例 第16條","q":"土地所有權人未於公告期間申報地價者，以何者為其申報地價？","o":["公告地價","公告地價百分之八十","公告地價百分之一百二十","公告土地現值"],"a":1,"e":"未申報者以公告地價 80% 為申報地價。申報地價須在公告地價 80% 至 120% 之間：低於 80% 者照價收買或以 80% 計；超過 120% 者以 120% 為申報地價。"},
{"s":"土地法規","t":"市地重劃","art":"平均地權條例 第60條","q":"市地重劃中，土地所有權人共同負擔的土地，原則上不得超過重劃區總面積的多少？","o":["百分之三十","百分之四十","百分之四十五","百分之五十"],"a":2,"e":"共同負擔（公共設施用地、抵費地等）以不超過各該重劃區總面積 45% 為限；經重劃區內私有土地所有權人半數以上且其土地面積超過半數者同意，不在此限。"},
{"s":"土地法規","t":"市地重劃","art":"平均地權條例 第56條","q":"公辦市地重劃計畫書公告期間及反對門檻為何？","o":["公告十五日；所有權人三分之一以上反對","公告三十日；私有土地所有權人半數以上，且其土地面積超過重劃區私有土地總面積半數者反對","公告三十日；所有權人過半數即可","公告六十日；面積三分之二以上反對"],"a":1,"e":"重劃計畫書應公告三十日。公告期間內，私有土地所有權人半數以上，而其所有土地面積超過重劃地區私有土地總面積半數者表示反對時，主管機關應予調處並參酌反對理由修訂或核定。"},
{"s":"土地法規","t":"土地徵收","art":"土地徵收條例 第18條、第20條","q":"關於土地徵收公告與補償，下列何者正確？","o":["公告十五日，補償費於公告期滿後三十日內發給","公告三十日，補償費於公告期滿後十五日內發給，逾期未發給者該部分徵收失其效力","公告三十日，補償費於公告期滿後一年內發給","公告六十日，補償費於核准後發給"],"a":1,"e":"徵收公告期間為三十日；補償費應於公告期滿後十五日內發給。未如期發給者，該部分土地或土地改良物之徵收從此失其效力（有但書例外）。"},
{"s":"土地法規","t":"土地徵收","art":"土地徵收條例 第22條","q":"土地所有權人對徵收補償價額不服，應於何時以書面提出異議？","o":["公告期間屆滿之次日起十五日內","公告期間屆滿之次日起三十日內","收到補償費之日起六十日內","公告期間屆滿之次日起二個月內"],"a":1,"e":"應於公告期間屆滿之次日起三十日內，以書面向該管直轄市或縣（市）主管機關提出異議。對查處不服者，可提請地價評議委員會復議，再不服則依行政救濟程序處理。"},
{"s":"土地法規","t":"土地徵收","art":"土地徵收條例 第9條","q":"被徵收土地符合法定情形時，原土地所有權人得於何時申請照原徵收補償價額收回？","o":["徵收公告之日起五年內","徵收公告之日起十年內","徵收公告之日起二十年內","無期間限制"],"a":2,"e":"原所有權人得於徵收公告之日起二十年內申請收回，例如補償發給完竣屆滿三年未依徵收計畫開始使用、未依核准計畫之事業使用等情形。"},
{"s":"土地法規","t":"區段徵收","art":"土地徵收條例 第39條","q":"區段徵收的抵價地總面積，以徵收總面積的多少為原則？","o":["百分之三十，最低二十","百分之四十，最低三十","百分之五十，特殊情形最低不得少於百分之四十","百分之六十，最低五十"],"a":2,"e":"抵價地總面積以徵收總面積 50% 為原則；因情形特殊經上級主管機關核准者不在此限，但不得少於 40%。"},
{"s":"土地法規","t":"預售屋管理","art":"平均地權條例 第47條之3","q":"銷售預售屋者，應於簽訂買賣契約之日起幾日內申報登錄資訊？","o":["十日","十五日","三十日","六十日"],"a":2,"e":"預售屋應於簽約之日起三十日內申報登錄；2023 年修法後，預售屋買賣契約解除時也須於解約之日起三十日內申報。"},
{"s":"土地法規","t":"預售屋管理","art":"平均地權條例 第47條之4","q":"預售屋買賣契約原則上禁止讓與或轉售。下列何者「不」屬於可直接轉讓的親屬例外？","o":["配偶","子女（直系血親）","兄弟姊妹（二親等旁系血親）","叔伯（三親等旁系血親）"],"a":3,"e":"例外對象限配偶、直系血親或二親等內旁系血親；其他特殊事由須經主管機關核准，且以全國每二年一戶為限。"},
{"s":"土地法規","t":"預售屋管理","art":"平均地權條例 第81條之3","q":"違反預售屋禁止換約轉售規定者，罰鍰如何計算？","o":["按件處新臺幣三萬元至十五萬元","按戶（棟）處新臺幣五十萬元至三百萬元","按交易總價處百分之一","處新臺幣一百萬元至五千萬元"],"a":1,"e":"按戶（棟）處新臺幣五十萬元以上、三百萬元以下罰鍰。一百萬至五千萬元是針對炒作行為的罰度，兩者常被混淆。"},
{"s":"土地法規","t":"私法人購屋","art":"平均地權條例 第79條之1","q":"私法人購買供住宅使用之房屋，依 2023 年修法應如何處理？","o":["僅需事後申報","須經主管機關許可","一律禁止","僅限購買一戶"],"a":1,"e":"私法人購買住宅改採許可制；取得後於登記完畢五年內不得辦理移轉、讓與或預告登記。"},
{"s":"土地法規","t":"土地法總則","art":"土地法 第4條","q":"土地法所稱「公有土地」，不包括下列何者？","o":["國有土地","直轄市有土地","鄉（鎮、市）有土地","村里有土地"],"a":3,"e":"公有土地為國有土地、直轄市有土地、縣（市）有土地或鄉（鎮、市）有之土地。村里不是地方自治團體，沒有公有土地。"},
{"s":"土地法規","t":"土地法總則","art":"土地法 第12條","q":"私有土地因天然變遷成為湖澤或可通運之水道時，其所有權如何處理？","o":["仍歸原所有權人","視為消滅；日後回復原狀時，經原所有權人證明為其原有者，仍回復其所有權","由國家徵收並補償","由所在地政府取得"],"a":1,"e":"私有土地因天然變遷成為湖澤或可通運之水道時，其所有權視為消滅。前項土地回復原狀時，經原所有權人證明為其原有者，仍回復其所有權。"},
{"s":"土地法規","t":"土地法總則","art":"土地法 第15條","q":"附著於土地之礦，是否因取得土地所有權而成為私有？","o":["是，土地所有權及於地下礦藏","否，附著於土地之礦不因土地所有權之取得而成為私有","須經經濟部核准才成為私有","僅限非金屬礦"],"a":1,"e":"附著於土地之礦，不因土地所有權之取得而成為私有。礦屬於國家所有。"},
{"s":"土地法規","t":"外國人地權","art":"土地法 第18條","q":"外國人在我國取得或設定土地權利，採何種原則？","o":["完全開放","完全禁止","平等互惠原則：以依條約或其本國法律，中華民國人民得在該國享受同樣權利者為限","須經總統核准"],"a":2,"e":"外國人在中華民國取得或設定土地權利，以依條約或其本國法律，中華民國人民得在該國享受同樣權利者為限。"},
{"s":"土地法規","t":"外國人地權","art":"土地法 第19條、第20條","q":"外國人為供自用住宅需要而取得土地，應向何機關申請核准？","o":["內政部","外交部","該管直轄市或縣（市）政府","經濟部"],"a":2,"e":"外國人為供住宅、營業處所、教堂、醫院、外僑子弟學校、使領館、公墓等用途需要取得土地，應檢附相關文件，申請該管直轄市或縣（市）政府核准。"},
{"s":"土地法規","t":"公有土地","art":"土地法 第26條","q":"各級政府機關需用公有土地時，應如何取得？","o":["逕行使用","商同該管直轄市或縣（市）政府層請行政院核准撥用","向國有財產署購買","辦理徵收"],"a":1,"e":"各級政府機關需用公有土地時，應商同該管直轄市或縣（市）政府層請行政院核准撥用。"},
{"s":"土地法規","t":"土地法總則","art":"土地法 第31條","q":"直轄市或縣（市）地政機關為防止土地過度細分，得採取何種措施？","o":["禁止土地買賣","依地方經濟情形及土地使用種類，規定最小面積單位，並禁止其再分割","課徵分割稅","規定每人土地面積上限"],"a":1,"e":"地政機關於其管轄區內，得斟酌地方經濟情形，依其性質及使用之種類，為最小面積單位之規定，並禁止其再分割。"},
{"s":"土地法規","t":"共有土地","art":"土地法 第34條之1第2項","q":"共有人依多數決處分共有土地時，對於他共有人應如何處理？","o":["無須通知","應事先以書面通知他共有人；其不能以書面通知者，應公告之","事後通知即可","須經法院許可"],"a":1,"e":"共有人依前項規定為處分、變更及設定負擔時，應事先以書面通知他共有人；其不能以書面通知者，應公告之。"},
{"s":"土地法規","t":"共有土地","art":"土地法 第34條之1第3項","q":"依多數決處分共有土地時，不同意之共有人應得之對價應如何處理？","o":["由同意之共有人取得","應由處分之共有人代其受領，或依法提存","歸國庫","由地政機關保管"],"a":1,"e":"處分、變更或設定負擔，對於他共有人應得之對價或補償，負連帶清償責任。於為權利變更登記時，並應提出他共有人已為受領或為其提存之證明。"},
{"s":"土地法規","t":"共有土地","art":"土地法 第34條之2","q":"直轄市或縣（市）地政機關為處理不動產之糾紛，應設置何種組織？","o":["地價評議委員會","不動產糾紛調處委員會","土地徵收審議委員會","都市計畫委員會"],"a":1,"e":"直轄市或縣（市）地政機關為處理本法不動產之糾紛，應設不動產糾紛調處委員會，聘請地政、營建、法律及地方公正人士為調處委員。"},
{"s":"土地法規","t":"房屋租用","art":"土地法 第100條","q":"出租人收回房屋的法定事由，關於積欠租金的要件為何？","o":["積欠一個月租金","承租人積欠租金額，除以擔保金抵償外，達二個月以上","積欠三個月租金","積欠六個月租金"],"a":1,"e":"出租人非因下列情形之一，不得收回房屋：收回自住或重新建築；承租人違反轉租之禁止；承租人積欠租金額，除以擔保金抵償外，達二個月以上；承租人以房屋供違反法令之使用；承租人違反租賃契約；承租人損壞出租人之房屋或附著財物而不為相當之賠償。"},
{"s":"土地法規","t":"房屋租用","art":"土地法 第101條","q":"因房屋租用發生爭議時，處理程序為何？","o":["只能向法院起訴","得由該管直轄市或縣（市）地政機關予以調處；不服調處者，得向司法機關訴請處理","由鄉鎮公所裁決","由內政部仲裁"],"a":1,"e":"因房屋租用發生爭議，得由該管直轄市或縣（市）地政機關予以調處；不服調處者，得向司法機關訴請處理。"},
{"s":"土地法規","t":"基地租用","art":"土地法 第102條","q":"租用基地建築房屋，應於何時聲請為地上權之登記？","o":["房屋完工後","由出租人與承租人於契約訂立後二個月內","承租人單獨於一年內","不必登記"],"a":1,"e":"租用基地建築房屋，應由出租人與承租人於契約訂立後二個月內，聲請該管直轄市或縣（市）地政機關為地上權之登記。"},
{"s":"土地法規","t":"基地租用","art":"土地法 第103條","q":"租用建築房屋之基地，出租人得收回的積欠租金要件為何？","o":["積欠租金達二個月","積欠租金額，除以擔保現金抵償外，達二年以上","積欠租金達六個月","積欠租金達一年"],"a":1,"e":"租用基地建築房屋，出租人得收回之情形包括：契約年限屆滿、承租人以基地供違反法令之使用、承租人轉租基地於他人、承租人積欠租金額除以擔保現金抵償外達二年以上、承租人違反租賃契約。注意房屋是二個月，基地是二年。"},
{"s":"土地法規","t":"基地租用","art":"土地法 第105條","q":"租用基地建築房屋之租金上限為何？","o":["基地申報地價年息 8%","準用第 97 條，以不超過基地申報地價年息 10% 為限","按市價","按公告土地現值 5%"],"a":1,"e":"第 97 條、第 99 條及第 101 條之規定，於租用基地建築房屋均準用之，故基地租金以不超過申報地價年息 10% 為限。"},
{"s":"土地法規","t":"耕地租用","art":"土地法 第106條","q":"土地法所稱「耕地租用」，其定義為何？","o":["以營利為目的承租土地","以自任耕作為目的，約定支付地租，使用他人之農地","以建築為目的租用土地","承租公有林地"],"a":1,"e":"以自任耕作為目的，約定支付地租，使用他人之農地者，為耕地租用。所稱耕作，包括漁牧。"},
{"s":"土地法規","t":"耕地租用","art":"土地法 第108條","q":"耕地承租人可否將耕地轉租？","o":["可全部轉租","可一部轉租","承租人縱經出租人承諾，仍不得將耕地全部或一部轉租於他人","經地政機關核准可轉租"],"a":2,"e":"承租人縱經出租人承諾，仍不得將耕地全部或一部轉租於他人。"},
{"s":"土地法規","t":"耕地租用","art":"土地法 第109條","q":"依定期租用契約耕作，期滿後承租人繼續耕作而出租人不即表示反對，效果為何？","o":["契約當然消滅","視為不定期限繼續契約","視為延長一年","出租人得請求加倍地租"],"a":1,"e":"依定有期限之契約租用耕地者，於契約屆滿時，除出租人收回自耕外，如承租人繼續耕作，視為不定期限繼續契約。"},
{"s":"土地法規","t":"耕地租用","art":"土地法 第114條","q":"依不定期限租用耕地之契約，出租人得終止契約的積欠地租要件為何？","o":["積欠地租達半年","地租積欠達二年之總額","積欠地租達一年","積欠地租達三年"],"a":1,"e":"不定期限租用耕地之契約，僅得於承租人死亡而無繼承人、承租人放棄耕作權、出租人收回自耕、耕地依法變更使用、違反法令、違反轉租禁止、地租積欠達二年之總額等情形終止。"},
{"s":"土地法規","t":"三七五減租","art":"耕地三七五減租條例 第2條","q":"耕地地租依三七五減租條例，不得超過下列何者？","o":["地價百分之八","主要作物正產品全年收穫總量千分之三百七十五","申報地價年息百分之十","收穫總量百分之五十"],"a":1,"e":"耕地地租租額，不得超過主要作物正產品全年收穫總量千分之三百七十五；原約定地租超過者，應減為千分之三百七十五，不及者不得增加。"},
{"s":"土地法規","t":"三七五減租","art":"耕地三七五減租條例 第5條","q":"三七五減租耕地租佃期間，不得少於幾年？","o":["三年","五年","六年","十年"],"a":2,"e":"耕地租佃期間，不得少於六年；其原約定租期超過六年者，依其原約定。"},
{"s":"土地法規","t":"三七五減租","art":"耕地三七五減租條例 第6條","q":"三七五減租耕地租約應如何訂立？","o":["口頭約定即可","應一律以書面為之；租約之訂立、變更、終止或換訂，應由出租人會同承租人申請登記","須經法院公證","由承租人單獨申請登記"],"a":1,"e":"耕地租約應一律以書面為之；租約之訂立、變更、終止或換訂，應由出租人會同承租人申請登記。"},
{"s":"土地法規","t":"三七五減租","art":"耕地三七五減租條例 第15條","q":"三七五耕地出賣或出典時，承租人享有何種權利？","o":["撤銷買賣之權","有優先承受之權；出租人應將賣典條件以書面通知承租人，承租人於十五日內未以書面表示承受者，視為放棄","請求減租之權","只能請求補償"],"a":1,"e":"耕地出賣或出典時，承租人有優先承受之權，出租人應將賣典條件以書面通知承租人，承租人在十五日內未以書面表示承受者，視為放棄。出租人違反者，其契約不得對抗承租人。"},
{"s":"土地法規","t":"三七五減租","art":"耕地三七五減租條例 第17條","q":"三七五租約期限未屆滿前，下列何者「不」屬於得終止租約之事由？","o":["承租人死亡而無繼承人","承租人放棄耕作權","地租積欠達兩年之總額","出租人欲出售耕地"],"a":3,"e":"租約期限未屆滿前，非有承租人死亡而無繼承人、承租人放棄耕作權、地租積欠達兩年之總額、非因不可抗力繼續一年不為耕作、經依法編定或變更為非耕地使用等情形，不得終止。出售耕地時，承租人有優先承受權，並非終止事由。"},
{"s":"土地法規","t":"三七五減租","art":"耕地三七五減租條例 第17條第2項","q":"耕地依法編定為建築用地，出租人終止三七五租約時，應補償承租人多少？","o":["按申報地價補償二分之一","申請終止租約當期之公告土地現值，減除土地增值稅後餘額三分之一","按市價補償四分之一","不須補償"],"a":1,"e":"除補償承租人為改良土地所支付之費用及尚未收穫農作物外，應就申請終止租約當期之公告土地現值，預估土地增值稅，並按該公告土地現值減除預估土地增值稅後餘額三分之一給予補償。"},
{"s":"土地法規","t":"三七五減租","art":"耕地三七五減租條例 第19條","q":"三七五租約期滿時，出租人「不得」收回自耕的情形，不包括下列何者？","o":["出租人不能自任耕作者","出租人所有收益足以維持一家生活者","出租人因收回耕地，致承租人失其家庭生活依據者","出租人年滿六十五歲者"],"a":3,"e":"耕地租約期滿時，有出租人不能自任耕作、出租人所有收益足以維持一家生活、或出租人收回耕地致承租人失其家庭生活依據等情形之一者，出租人不得收回自耕。年齡不是法定事由。"},
{"s":"土地法規","t":"規定地價","art":"平均地權條例 第26條","q":"直轄市或縣（市）政府對私有空地，經限期使用而逾期未使用者，得採取何種措施？","o":["沒收土地","按該宗土地應納地價稅基本稅額加徵二倍至五倍之空地稅或照價收買","課徵荒地稅","強制拍賣"],"a":1,"e":"直轄市或縣（市）政府對於私有空地，得視建設發展情形，分別劃定區域，限期建築、增建、改建或重建；逾期未建築、增建、改建或重建者，按該宗土地應納地價稅基本稅額加徵二倍至五倍之空地稅或照價收買。"},
{"s":"土地法規","t":"規定地價","art":"平均地權條例 第26條之1","q":"農業用地閒置不用，經限期使用逾期仍未使用者，得採取何種措施？","o":["按應納田賦加徵一倍至三倍之荒地稅；經加徵滿三年仍不使用者，得照價收買","沒收土地","課徵空地稅","強制變更為建地"],"a":0,"e":"農業用地閒置不用，經直轄市或縣（市）政府報經內政部核准通知限期使用或命其委託經營，逾期仍未使用或委託經營者，按應納田賦加徵一倍至三倍之荒地稅；經加徵荒地稅滿三年，仍不使用者，得照價收買。"},
{"s":"土地法規","t":"規定地價","art":"平均地權條例 第16條","q":"土地所有權人申報之地價未滿公告地價百分之八十時，政府得採取何種措施？","o":["處以罰鍰","得照價收買或以公告地價百分之八十為其申報地價","逕以公告地價為申報地價","退回重新申報"],"a":1,"e":"申報之地價未滿公告地價 80% 時，得照價收買或以公告地價 80% 為其申報地價；超過公告地價 120% 時，以 120% 為其申報地價。"},
{"s":"土地法規","t":"實價登錄","art":"平均地權條例 第47條","q":"不動產買賣案件的實價登錄，現行由何人於何時申報？","o":["地政士於簽約後三十日內申報","買賣案件之權利人及義務人，於申請所有權移轉登記時共同申報","經紀業於交屋後三十日內申報","出賣人於簽約時單獨申報"],"a":1,"e":"權利人及義務人應於買賣案件申請所有權移轉登記時，檢附申報書共同向直轄市、縣（市）主管機關申報登錄土地及建物成交案件實際資訊。"},
{"s":"土地法規","t":"實價登錄","art":"平均地權條例 第47條第2項","q":"經營不動產租賃業務或經紀業受託辦理租賃案件，應於何時申報實價登錄？","o":["簽訂租賃契約之日起三十日內","交屋之日起十日內","每月月底彙報","租約到期時"],"a":0,"e":"租賃案件委由不動產經紀業或租賃住宅服務業辦理者，應於簽訂租賃契約書之日起三十日內，向主管機關申報登錄成交案件實際資訊。"},
{"s":"土地法規","t":"預售屋管理","art":"平均地權條例 第47條之3","q":"銷售預售屋者，於何時應將建案資訊與定型化契約報請備查？","o":["銷售前，以書面報請直轄市、縣（市）主管機關備查","銷售後三十日內","交屋時","取得使用執照時"],"a":0,"e":"銷售預售屋者，應於銷售前將預售屋坐落基地、建案名稱、銷售地點、期間、戶（棟）數及預售屋買賣定型化契約，以書面報請預售屋坐落基地所在之直轄市、縣（市）主管機關備查。"},
{"s":"土地法規","t":"預售屋管理","art":"平均地權條例 第47條之6","q":"銷售預售屋或新建成屋收受定金時，有何限制？","o":["無任何限制","應以書面契據確立買賣標的物及價金等事項，並不得約定保留出售、保留購買或其他未正式確立交易之約定，且買受人不得將定金收據轉售予第三人","須經法院公證","須經地政士簽證"],"a":1,"e":"2023 年修法禁止「紅單」炒作：收受定金應以書面契據確立買賣標的物及價金，不得約定保留出售、保留購買或其他未正式確立交易之約定；買受人亦不得將該書面契據轉售予第三人。"},
{"s":"土地法規","t":"炒作行為","art":"平均地權條例 第47條之5","q":"下列何者屬於平均地權條例所禁止的不動產「炒作行為」？","o":["屋主自行調高開價","散布不實資訊，影響不動產交易價格","委託仲介公開銷售","購買多戶自住"],"a":1,"e":"禁止的炒作行為包括散布不實資訊影響交易價格、透過通謀或虛偽交易營造熱銷假象、利用違規銷售手法影響交易秩序、其他經主管機關公告之行為。"},
{"s":"土地法規","t":"炒作行為","art":"平均地權條例 第81條之2","q":"違反炒作行為禁止規定者，罰鍰範圍為何？","o":["新臺幣六萬元至三十萬元","新臺幣五十萬元至三百萬元","新臺幣一百萬元至五千萬元，並得按次處罰","按交易總價百分之一"],"a":2,"e":"違反炒作行為規定者，按交易戶（棟、筆）數處新臺幣一百萬元以上五千萬元以下罰鍰，經限期改正而屆期未改正者，並得按次處罰。"},
{"s":"土地法規","t":"私法人購屋","art":"平均地權條例 第79條之1","q":"私法人經許可取得住宅後，有何處分限制？","o":["無限制","取得後於登記完畢之日起五年內，不得辦理移轉、讓與或預告登記","二年內不得出租","十年內不得出售"],"a":1,"e":"私法人經許可取得之房屋，於登記完畢之日起五年內，不得辦理移轉、讓與或預告登記（法定例外除外）。"},
{"s":"土地法規","t":"市地重劃","art":"平均地權條例 第60條","q":"市地重劃的共同負擔公共設施用地中，下列何者「不」屬之？","o":["道路、溝渠","兒童遊樂場、鄰里公園","國民小學、國民中學","醫院"],"a":3,"e":"共同負擔之公共設施用地為重劃區內供公共使用之道路、溝渠、兒童遊樂場、鄰里公園、廣場、綠地、國民小學、國民中學、停車場、零售市場等十項，醫院不在其中。"},
{"s":"土地法規","t":"市地重劃","art":"平均地權條例 第60條","q":"市地重劃的工程費用、重劃費用與貸款利息，以何種方式負擔？","o":["由政府全額負擔","由參加重劃土地所有權人按其土地受益比例共同負擔，並以重劃區內未建築土地折價抵付（抵費地）","由承包商負擔","向土地所有權人收取現金"],"a":1,"e":"工程費用、重劃費用及貸款利息，由參加重劃土地所有權人按其土地受益比例共同負擔，並以重劃區內未建築土地折價抵付（即抵費地）；如無未建築土地者，改以現金繳納。"},
{"s":"土地法規","t":"市地重劃","art":"平均地權條例 第63條","q":"出租之耕地因實施市地重劃致不能達到原租賃目的，重劃後分配土地者，承租人得如何請求補償？","o":["無補償","向出租人請求按重劃計畫書公告當期該土地之公告土地現值三分之一補償","按申報地價二分之一補償","向政府請求全額補償"],"a":1,"e":"由直轄市或縣（市）政府逕為註銷其租約；重劃後分配土地者，承租人得向出租人請求按重劃計畫書公告當期該土地之公告土地現值三分之一之補償。"},
{"s":"土地法規","t":"市地重劃","art":"平均地權條例 第62條之1","q":"市地重劃區內應行拆遷之土地改良物或墳墓，如何補償？","o":["不予補償","應予補償；其補償數額由直轄市或縣（市）政府查定","由土地所有權人自行協商","依市價加四成"],"a":1,"e":"重劃區內應行拆遷之土地改良物或墳墓，直轄市或縣（市）政府應予公告，並通知其所有權人或墓主，限期自行拆除或遷葬，逾期不拆除或遷葬者得代為拆除或遷葬；其補償數額由直轄市或縣（市）政府查定之。"},
{"s":"土地法規","t":"區段徵收","art":"平均地權條例 第53條、土地徵收條例 第4條","q":"區段徵收的意義為何？","o":["對單一筆土地之徵收","於一定區域內之土地，全區予以徵收並重新規劃整理開發後，由政府留用公共設施用地，其餘土地發還原所有權人（抵價地）或標售、標租","重新測量地籍","只徵收地上權"],"a":1,"e":"區段徵收是將一定區域內之私有土地全部徵收，重新分宗整理後，除公共設施用地由政府直接支配使用外，其餘可建築土地部分由原土地所有權人按應領補償地價領回（抵價地），剩餘土地辦理標售、標租或設定地上權。"},
{"s":"土地法規","t":"土地徵收","art":"土地徵收條例 第3條","q":"國家因公益需要興辦事業，得徵收私有土地。下列何者「不」屬於法定得徵收的事業？","o":["國防事業","交通事業","教育、學術及文化事業","私人興建之商業百貨"],"a":3,"e":"得徵收之事業包括國防、交通、公用、水利、公共衛生及環境保護、政府機關／地方自治機關及其他公共建築、教育學術及文化、社會福利、國營事業及其他依法得徵收之事業。私人商業開發不屬之。"},
{"s":"土地法規","t":"土地徵收","art":"土地徵收條例 第10條","q":"需用土地人興辦之事業依法應經目的事業主管機關許可者，於許可前應如何辦理？","o":["逕行申請徵收","應舉行公聽會，聽取土地所有權人及利害關係人之意見","公告三十日即可","僅需書面通知"],"a":1,"e":"需用土地人興辦之事業依法應經目的事業主管機關許可者，於許可前，應在適當地點舉行公聽會，聽取土地所有權人及利害關係人之意見。特定農業區農牧用地等情形並應舉行聽證。"},
{"s":"土地法規","t":"土地徵收","art":"土地徵收條例 第11條","q":"需用土地人申請徵收土地前，應先踐行何種程序？","o":["直接報請核准","應先與所有權人協議價購或以其他方式取得；所有權人拒絕參與協議或經開會未能達成協議且無法以其他方式取得者，始得申請徵收","先行占用土地","先送法院裁定"],"a":1,"e":"申請徵收前應先與所有權人協議價購或以其他方式取得。協議價購應由需用土地人依市價與所有權人協議，此即「徵收最後手段性」。"},
{"s":"土地法規","t":"土地徵收","art":"土地徵收條例 第14條","q":"土地徵收由何機關核准？","o":["直轄市或縣（市）政府","中央主管機關（內政部）","行政院","立法院"],"a":1,"e":"徵收土地或土地改良物，由中央主管機關核准之，即內政部。核准後交由直轄市或縣（市）主管機關公告並通知。"},
{"s":"土地法規","t":"土地徵收","art":"土地徵收條例 第30條","q":"被徵收之土地，其地價補償標準為何？","o":["按公告地價","按照徵收當期之市價補償其地價","按申報地價加四成","按公告土地現值"],"a":1,"e":"被徵收之土地，應按照徵收當期之市價補償其地價。市價由直轄市、縣（市）主管機關提交地價評議委員會評定之。"},
{"s":"土地法規","t":"土地徵收","art":"土地徵收條例 第31條","q":"建築改良物被徵收時，其補償標準為何？","o":["按原建造價格","按徵收當時該建築改良物之重建價格估定","按房屋稅課稅現值","按市價二分之一"],"a":1,"e":"建築改良物之補償費，按徵收當時該建築改良物之重建價格估定之。農作改良物則依成熟程度等估定。"},
{"s":"土地法規","t":"土地徵收","art":"土地徵收條例 第8條","q":"徵收土地之殘餘部分面積過小或形勢不整，致不能為相當之使用者，所有權人可如何主張？","o":["請求加倍補償","得於徵收公告之日起一年內向該管直轄市或縣（市）主管機關申請一併徵收","只能自行出售","得請求撤銷徵收"],"a":1,"e":"有殘餘部分面積過小或形勢不整、或殘餘部分位於都市計畫內之公共設施用地等情形，所有權人得於徵收公告之日起一年內申請一併徵收，逾期不予受理。"},
{"s":"土地法規","t":"土地徵收","art":"土地徵收條例 第23條","q":"被徵收之土地公告後，有何限制？","o":["仍可自由移轉","除於公告前因繼承、強制執行或法院之判決而取得所有權或他項權利者外，不得分割、合併、移轉或設定負擔；土地權利人或使用人並不得在該土地為建築改良物之新建、增建等","僅不得出租","僅不得建築"],"a":1,"e":"被徵收之土地或土地改良物自公告日起，除公告前因繼承、強制執行或法院判決取得權利並於公告期間內申請登記者外，不得分割、合併、移轉或設定負擔；並不得為建築改良物之新建、增建、改建或採取土石、變更地形或為農作改良物之增加種植。"},
{"s":"土地法規","t":"土地徵收","art":"土地徵收條例 第26條","q":"應受補償人拒絕受領或不能受領徵收補償費時，如何處理？","o":["徵收失效","直轄市或縣（市）主管機關應於國庫設立土地徵收補償費保管專戶，存入該專戶保管，視同補償完竣","由法院提存","延後一年再發"],"a":1,"e":"應受補償人拒絕受領、不能受領、行蹤不明等情形，直轄市或縣（市）主管機關應於國庫設立保管專戶，於規定應發給補償費之期限屆滿次日起三個月內存入專戶保管，並通知應受補償人；經存入專戶保管者，視同補償完竣。"},
{"s":"土地法規","t":"土地徵收","art":"土地徵收條例 第21條","q":"被徵收土地之所有權人，其使用收益權利何時終止？","o":["徵收核准時","徵收公告時","直轄市或縣（市）主管機關發給補償費完竣時","辦理所有權登記時"],"a":2,"e":"被徵收土地或土地改良物之所有權人，對於其土地或土地改良物之權利義務，於應受之補償費發給完竣時終止。在補償費未發給完竣前，得繼續為從來之使用。"},
{"s":"土地法規","t":"區段徵收","art":"土地徵收條例 第40條","q":"區段徵收時，土地所有權人申請發給抵價地，應於何時提出？","o":["徵收公告期間內，以書面向直轄市或縣（市）主管機關申請","徵收核准前","開發完成後一年內","隨時可申請"],"a":0,"e":"實施區段徵收時，原土地所有權人不願領取現金補償者，應於徵收公告期間內，檢具有關證明文件，以書面向該管直轄市或縣（市）主管機關申請發給抵價地。"},
{"s":"土地法規","t":"國土計畫","art":"國土計畫法 第20條","q":"國土計畫法劃設的國土功能分區，不包括下列何者？","o":["國土保育地區","海洋資源地區","農業發展地區","工商綜合地區"],"a":3,"e":"國土功能分區分為國土保育地區、海洋資源地區、農業發展地區及城鄉發展地區四種。"},
{"s":"土地法規","t":"國土計畫","art":"國土計畫法 第15條","q":"全國國土計畫與直轄市、縣（市）國土計畫的通盤檢討週期分別為何？","o":["均為每五年","全國每十年；直轄市、縣（市）每五年","全國每五年；直轄市、縣（市）每三年","均為每十年"],"a":1,"e":"全國國土計畫每十年通盤檢討一次，直轄市、縣（市）國土計畫每五年通盤檢討一次。"},
{"s":"土地法規","t":"國土計畫","art":"國土計畫法 第3條","q":"國土計畫的種類，下列何者正確？","o":["全國國土計畫、直轄市及縣（市）國土計畫","區域計畫、都市計畫","全國、區域、地方三級","僅全國國土計畫"],"a":0,"e":"國土計畫分為全國國土計畫與直轄市、縣（市）國土計畫兩種。國土計畫法施行後，將逐步取代區域計畫法體系。"},
{"s":"土地法規","t":"都市計畫","art":"都市計畫法 第9條","q":"都市計畫分為哪幾種？","o":["市（鎮）計畫、鄉街計畫、特定區計畫","主要計畫、細部計畫、綱要計畫","全國計畫、地方計畫","住宅區、商業區、工業區"],"a":0,"e":"都市計畫分為市（鎮）計畫、鄉街計畫、特定區計畫三種。主要計畫與細部計畫則是計畫的層級，不是種類。"},
{"s":"土地法規","t":"都市計畫","art":"都市計畫法 第19條","q":"主要計畫擬定後，送該管政府都市計畫委員會審議前，應公開展覽多久？","o":["十五日","三十日","六十日","九十日"],"a":1,"e":"應於各該直轄市、縣（市）政府及鄉、鎮、縣轄市公所公開展覽三十天及舉行說明會，任何公民或團體得於公開展覽期間內提出意見。"},
{"s":"土地法規","t":"都市計畫","art":"都市計畫法 第26條","q":"都市計畫發布實施後，應多久至少通盤檢討一次？","o":["每年","每三年內或五年內","每十年","不須檢討"],"a":1,"e":"都市計畫經發布實施後，不得隨時任意變更。但擬定計畫之機關每三年內或五年內至少應通盤檢討一次。"},
{"s":"土地法規","t":"都市計畫","art":"都市計畫法 第48條","q":"依都市計畫法指定之公共設施保留地，供公用事業設施之用者，由各事業機構依法取得；其餘由政府以何種方式取得？","o":["沒收","徵收、區段徵收、市地重劃","無償撥用","強制拍賣"],"a":1,"e":"依本法指定之公共設施保留地供公用事業設施之用者，由各該事業機構依法予以徵收或購買；其餘由該管政府或鄉、鎮、縣轄市公所依徵收、區段徵收、市地重劃方式取得之。"},
{"s":"土地法規","t":"都市計畫","art":"都市計畫法 第50條之1","q":"公共設施保留地因依本法第 49 條徵收取得之加成補償，在所得稅上如何處理？","o":["併入綜合所得課稅","免徵所得稅","按 10% 分離課稅","視為贈與"],"a":1,"e":"公共設施保留地因依第 49 條徵收取得之加成補償，免徵所得稅；因繼承或因配偶、直系血親間之贈與而移轉者，免徵遺產稅或贈與稅。"},
{"s":"土地法規","t":"非都市土地","art":"區域計畫法施行細則 第13條","q":"非都市土地使用分區，不包括下列何者？","o":["特定農業區","鄉村區","山坡地保育區","住宅區"],"a":3,"e":"非都市土地劃定為特定農業區、一般農業區、工業區、鄉村區、森林區、山坡地保育區、風景區、國家公園區、河川區、海域區及其他特定專用區等分區。住宅區是都市計畫的使用分區。"},
{"s":"土地法規","t":"農地管理","art":"農業發展條例 第16條","q":"耕地分割後，每人所有面積原則上不得少於多少？","o":["0.1 公頃","0.25 公頃","0.5 公頃","1 公頃"],"a":1,"e":"每宗耕地分割後每人所有面積未達 0.25 公頃者，不得分割（法定例外如因購置毗鄰耕地而與其耕地合併、部分依法變更為非耕地使用等）。"},
{"s":"土地法規","t":"農地管理","art":"農業發展條例 第18條、農業用地興建農舍辦法","q":"農民於自有農業用地興建農舍，農舍之建築面積上限為何？","o":["該宗農業用地面積的 5%","該宗農業用地面積的 10%","330 平方公尺","不限"],"a":1,"e":"興建農舍之農民，應為該農業用地所有權人且取得土地二年以上；農舍之興建面積不得超過該宗農業用地面積 10%，建築總樓地板面積不得超過 495 平方公尺，建築物高度不得超過 4 層樓且不超過 14 公尺。"},
{"s":"土地法規","t":"農地管理","art":"農業發展條例 第33條","q":"私法人可否承受耕地？","o":["可以自由承受","原則不得承受耕地；但符合規定之農民團體、農業企業機構或農業試驗研究機構經取得許可者不在此限","經法院許可即可","可承受但須五年內出售"],"a":1,"e":"私法人不得承受耕地。但符合第 34 條規定之農民團體、農業企業機構或農業試驗研究機構經取得許可者，不在此限。"},
{"s":"土地法規","t":"農地管理","art":"農業發展條例 第3條","q":"農業發展條例所稱「耕地」，是指何種土地？","o":["所有農業用地","依區域計畫法劃定為特定農業、一般農業、山坡地保育及森林區之農牧用地","都市計畫農業區","所有非都市土地"],"a":1,"e":"耕地指依區域計畫法劃定為特定農業區、一般農業區、山坡地保育區及森林區之農牧用地。"},
{"s":"土地法規","t":"地政士","art":"地政士法 第4條","q":"下列何者可申請地政士證書？","o":["經地政士考試及格者","大學地政系畢業者","不動產經紀人","律師"],"a":0,"e":"中華民國人民經地政士考試及格者，得申請核發地政士證書。律師、會計師並不當然取得地政士資格。"},
{"s":"土地法規","t":"地政士","art":"地政士法（開業執照及加入公會）","q":"地政士欲執行業務，除領有地政士證書外，還須符合何種條件？","o":["領有開業執照並加入地政士公會","僅需加入公會","僅需登記營業","經法院登記"],"a":0,"e":"地政士應檢具申請書及資格證明文件，向直轄市或縣（市）主管機關申請登記，並領得地政士開業執照；並應加入該管直轄市或縣（市）地政士公會，始得執業。"},
{"s":"土地法規","t":"地政士","art":"地政士法（開業執照效期）","q":"地政士開業執照的有效期限為何？","o":["二年","三年","四年","五年"],"a":2,"e":"開業執照有效期限為四年，期滿前應檢附其於四年內在中央主管機關認可之機關、團體完成專業訓練之證明文件，申請換發。"},
{"s":"土地法規","t":"地政士","art":"地政士法 第16條","q":"下列何者「不」屬於地政士得執行之業務？","o":["代理申請土地登記事項","代理申請土地測量事項","代理申請與土地登記有關之稅務事項","代理訴訟案件出庭"],"a":3,"e":"地政士得執行代理申請土地登記、測量、與土地登記有關之稅務、公證認證、土地法規諮詢、不動產契約或協議之簽證等業務。代理訴訟是律師業務。"},
{"s":"土地法規","t":"地政士","art":"地政士法（簽證人）","q":"地政士申請擔任「簽證人」，須具備何種資格？","o":["取得證書即可","經登記開業且執業一定年限以上，並經中央主管機關審查核定","擔任公會理事","受過民法訓練"],"a":1,"e":"地政士符合一定執業年資並經中央主管機關審查核定為簽證人後，始得就不動產契約或協議辦理簽證；簽證人並應繳存保證金或保險。經簽證之案件，申請登記時可免當事人親自到場。"},
{"s":"土地法規","t":"不動產經紀業","art":"不動產經紀業管理條例 第15條","q":"不動產經紀人證書的有效期限為何？","o":["二年","三年","四年，期滿須完成專業訓練三十小時以上換發","永久有效"],"a":2,"e":"經紀人證書有效期限為四年，期滿時經紀人應檢附其於四年內在中央主管機關認可之機構完成專業訓練三十個小時以上之證明文件，向直轄市或縣（市）政府辦理換證。"},
{"s":"土地法規","t":"不動產經紀業","art":"不動產經紀業管理條例 第22條","q":"下列何者「不」屬於須由經紀業指派經紀人簽章之文件？","o":["不動產出租、出售委託契約書","要約書","不動產說明書","經紀業之營業稅申報書"],"a":3,"e":"須由經紀人簽章之文件包括：不動產出租、出售委託契約書；不動產承租、承購要約書；定金收據；不動產廣告稿；不動產說明書；不動產租賃、買賣契約書。"},
{"s":"土地法規","t":"不動產經紀業","art":"不動產經紀業管理條例 第19條","q":"不動產經紀業收取報酬，有何限制？","o":["可自由收取差價","不得收取差價或其他報酬，其經營仲介業務者，並應依實際成交價金或租金，按中央主管機關規定之報酬標準計收","一律收取成交價 6%","僅向買方收取"],"a":1,"e":"經紀業或經紀人員不得收取差價或其他報酬；報酬計收依中央主管機關規定之標準（實務上買賣合計不超過成交價 6%，租賃合計不超過一個半月租金）。"},
{"s":"土地法規","t":"公寓大廈","art":"公寓大廈管理條例 第4條","q":"公寓大廈專有部分，可否與其所屬之共用部分應有部分及基地應有部分分離而為移轉？","o":["可以分別移轉","不得分離而為移轉或設定負擔","經管委會同意即可分離","僅可分離出租"],"a":1,"e":"專有部分不得與其所屬建築物共用部分之應有部分及其基地所有權或地上權之應有部分分離而為移轉或設定負擔。"},
{"s":"土地法規","t":"公寓大廈","art":"公寓大廈管理條例 第31條","q":"區分所有權人會議討論重大事項（如專有部分之共有部分修繕、規約訂定或變更）時，出席與決議門檻為何？","o":["過半數出席，出席人數過半數同意","應有區分所有權人三分之二以上及其區分所有權比例合計三分之二以上出席，以出席人數四分之三以上及其區分所有權比例占出席人數區分所有權四分之三以上之同意行之","全體同意","三分之一以上出席，過半數同意"],"a":1,"e":"重大事項採三分之二出席、四分之三同意（人數與比例雙重門檻）；一般事項則為過半數出席、出席人數及比例過半數同意。規約另有規定者從其規定。"},
{"s":"土地法規","t":"土地法總則","art":"土地法 第2條","q":"土地法依使用將土地分為四類，下列何者「不在」其中？","o":["建築用地","直接生產用地","交通水利用地","公共設施用地"],"a":3,"e":"四類為建築用地、直接生產用地、交通水利用地及其他土地。「公共設施用地」是都市計畫的用語。"},
{"s":"土地法規","t":"土地法總則","art":"土地法 第10條","q":"私有土地之所有權消滅時，該土地屬於何者？","o":["無主土地，由先占者取得","原所有權人之繼承人","國有土地","所在地之直轄市或縣（市）有土地"],"a":2,"e":"中華民國領域內之土地，屬於中華民國人民全體，其經人民依法取得所有權者，為私有土地；私有土地之所有權消滅者，為國有土地。"},
{"s":"土地法規","t":"預售屋管理","art":"平均地權條例 第47條之4","q":"預售屋買受人因特殊事由經主管機關核准讓與契約，有何數量限制？","o":["每年一戶","全國每二年一戶","每縣市每年一戶","無數量限制"],"a":1,"e":"經核准讓與或轉售者，以全國每二年一戶為限，避免以「特殊事由」之名行換約炒作之實。"},
{"s":"土地法規","t":"規定地價","art":"平均地權條例 第46條、土地稅法 第30條","q":"公告土地現值的主要用途為何？","o":["作為課徵地價稅的稅基","作為土地移轉時申報移轉現值之審核標準及計算土地增值稅","作為房屋稅的稅基","作為實價登錄的價格"],"a":1,"e":"公告土地現值每年 1 月 1 日公告，作為土地所有權移轉及設定典權時申報土地移轉現值之參考，並作為主管機關審核土地移轉現值的依據（徵收補償自 2012 年起改按市價，不再以公告土地現值為準）。地價稅的稅基則是申報地價。"},
{"s":"土地稅法規","t":"增值稅免徵","art":"土地稅法 第28條","q":"依土地稅法第 28 條，下列何種移轉「免徵」土地增值稅？","o":["夫妻間相互贈與土地","因繼承而移轉之土地","私人間買賣土地","設定典權"],"a":1,"e":"第 28 條三種免徵：①因繼承而移轉；②各級政府出售或依法贈與之公有土地；③受贈之私有土地（私人贈與政府）。配偶相互贈與是第 28 條之 2 的「不課徵」（遞延課稅），不是免徵。"},
{"s":"土地稅法規","t":"增值稅免徵","art":"土地稅法 第28條","q":"甲將名下土地無償捐贈給縣政府，土地增值稅如何處理？","o":["由縣政府繳納","由甲繳納","免徵","不課徵，待縣政府再移轉時課徵"],"a":2,"e":"「受贈之私有土地」指各級政府受贈的私有土地，依第 28 條免徵土地增值稅。"},
{"s":"土地稅法規","t":"增值稅免徵","art":"土地稅法 第28條之1","q":"私人捐贈土地供興辦社會福利事業或設立私立學校，免徵土地增值稅的要件「不」包括下列何者？","o":["受贈人為財團法人","法人章程載明法人解散時，賸餘財產歸屬當地地方政府所有","捐贈人未以任何方式取得所捐贈土地之利益","受贈人須設立滿五年"],"a":3,"e":"三要件：①受贈人為財團法人；②章程載明解散後賸餘財產歸屬當地地方政府；③捐贈人未以任何方式取得所捐贈土地之利益。沒有設立年限要求。"},
{"s":"土地稅法規","t":"增值稅不課徵","art":"土地稅法 第28條之2","q":"配偶相互贈與之土地，土地增值稅如何處理？","o":["免徵","得申請不課徵；再移轉第三人時，以第一次不課徵前之原規定地價或前次移轉現值為原地價計算","按自用住宅稅率 10% 課徵","減徵百分之四十"],"a":1,"e":"配偶贈與屬「不課徵」（遞延），再移轉時以該土地第一次不課徵前之原規定地價或前次移轉現值為原地價，計算漲價總數額課徵。"},
{"s":"土地稅法規","t":"信託與增值稅","art":"土地稅法 第28條之3、第5條之2","q":"土地為信託財產者，下列何種移轉「應」課徵土地增值稅？","o":["信託成立時委託人移轉予受託人","信託關係存續中受託人變更","自益信託消滅時，受託人移轉予委託人","他益信託存續中，受託人依信託本旨移轉予委託人以外之受益人"],"a":3,"e":"第 28 條之 3 不課徵：信託成立移轉予受託人、受託人變更、信託消滅移轉予委託人（自益）、遺囑信託移轉予受託人、信託不成立／無效／解除／撤銷時回復委託人。移轉給委託人以外的受益人時應課徵，納稅義務人為該受益人（第 5 條之 2）。"},
{"s":"土地稅法規","t":"增值稅稅率","art":"土地稅法 第33條","q":"一般土地增值稅的累進稅率級距為何？","o":["10%、20%、30%","20%、30%、40%","15%、25%、35%","20%、40%、60%"],"a":1,"e":"漲價總數額未達原地價 100% 者 20%；100% 以上未達 200% 者 30%；200% 以上者 40%。"},
{"s":"土地稅法規","t":"增值稅稅率","art":"土地稅法 第33條","q":"持有土地 30 年以上者，土地增值稅如何減徵？","o":["全部稅額減徵 30%","就超過最低稅率（20%）部分減徵 30%","就超過最低稅率部分減徵 20%","全部稅額減徵 40%"],"a":1,"e":"長期持有減徵只針對「超過第一級最低稅率部分」：持有 20 年以上減徵 20%、30 年以上減徵 30%、40 年以上減徵 40%。"},
{"s":"土地稅法規","t":"自用住宅增值稅","art":"土地稅法 第34條","q":"出售自用住宅用地，土地增值稅優惠稅率與面積限制為何？","o":["稅率 2‰；都市三公畝、非都市七公畝","稅率 10%；都市三公畝、非都市七公畝","稅率 10%；都市一．五公畝、非都市三．五公畝","稅率 20%；不限面積"],"a":1,"e":"都市土地未超過三公畝、非都市土地未超過七公畝部分，按 10% 課徵；超過部分依一般稅率。2‰ 是地價稅的自用住宅稅率。"},
{"s":"土地稅法規","t":"自用住宅增值稅","art":"土地稅法 第34條","q":"適用自用住宅「一生一次」10% 稅率，出售前多久內不得供營業使用或出租？","o":["出售前六個月","出售前一年","出售前三年","出售前五年"],"a":1,"e":"一生一次：出售前一年內，未曾供營業使用或出租。另須土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，地上建物屬上述人等所有。"},
{"s":"土地稅法規","t":"自用住宅增值稅","art":"土地稅法 第34條第5項","q":"已用過一生一次後，再適用「一生一屋」10% 稅率，下列條件何者「錯誤」？","o":["都市土地面積未超過一．五公畝、非都市土地未超過三．五公畝","出售時本人、配偶及未成年子女無該自用住宅以外之房屋","本人、配偶或未成年子女設籍且持有該自用住宅連續滿六年","出售前一年內無營業或出租"],"a":3,"e":"一生一屋要件：面積 1.5／3.5 公畝；出售時本人、配偶及未成年子女無其他房屋；持有並設籍連續滿六年；出售前「五年」內無供營業使用或出租。"},
{"s":"土地稅法規","t":"自用住宅增值稅","art":"土地稅法 第34條之1","q":"申報移轉現值時未註明自用住宅，還能補申請適用 10% 稅率嗎？","o":["不能，須於申報時註明","可於土地增值稅繳納期間屆滿前補行申請","可於移轉登記完畢後一年內申請","可隨時申請退稅"],"a":1,"e":"應於申報移轉現值時註明；未註明者，得於土地增值稅繳納期間屆滿前補行申請，逾期不得申請。"},
{"s":"土地稅法規","t":"重購退稅","art":"土地稅法 第35條","q":"出售自用住宅用地後重購自用住宅用地，申請退還土地增值稅的期間為何？","o":["一年內","二年內","三年內","五年內"],"a":1,"e":"自完成移轉登記之日起二年內重購（先購後售亦可），且新購土地地價超過原出售土地地價扣除繳納土地增值稅後之餘額者，得申請就已納增值稅額內退還不足支付新購土地地價之數額。自營工廠用地、自耕農業用地也適用。"},
{"s":"土地稅法規","t":"重購退稅","art":"土地稅法 第37條","q":"重購退稅後，新購土地在多久內再移轉或改作他用，須追繳原退還稅款？","o":["二年","三年","五年","十年"],"a":2,"e":"重購之土地自完成移轉登記之日起五年內再行移轉時，除就該次移轉之漲價總數額課稅外，並應追繳原退還稅款；改作其他用途者亦同。"},
{"s":"土地稅法規","t":"增值稅免徵","art":"土地稅法 第39條","q":"依都市計畫法指定之公共設施保留地，尚未被徵收前之移轉，土地增值稅如何處理？","o":["減徵 40%","按 10% 課徵","免徵","不課徵，待再移轉時課徵"],"a":2,"e":"被徵收之土地免徵土地增值稅；公共設施保留地尚未被徵收前之移轉，準用之，亦免徵。"},
{"s":"土地稅法規","t":"增值稅減徵","art":"土地稅法 第39條之1、平均地權條例 第42條","q":"經重劃之土地，於重劃後「第一次」移轉時，土地增值稅如何處理？","o":["免徵","減徵 20%","減徵 40%","不課徵"],"a":2,"e":"重劃後第一次移轉減徵 40%。區段徵收以現金補償者免徵；領回抵價地者，領回後第一次移轉以實際領回抵價地之地價為原地價，並減徵 40%。"},
{"s":"土地稅法規","t":"增值稅不課徵","art":"土地稅法 第39條之2","q":"作農業使用之農業用地移轉與自然人時，土地增值稅如何處理？","o":["免徵","得申請不課徵","減徵 40%","按 10% 課徵"],"a":1,"e":"作農業使用之農業用地移轉與自然人時，得申請不課徵土地增值稅；再移轉時以前次不課徵前之原規定地價或前次移轉現值為原地價。"},
{"s":"土地稅法規","t":"納稅義務人","art":"土地稅法 第5條","q":"下列土地增值稅納稅義務人的組合，何者正確？","o":["買賣：買受人；贈與：贈與人；設定典權：典權人","買賣：原所有權人；贈與：取得所有權之人；設定典權：出典人","買賣：原所有權人；贈與：贈與人；設定典權：典權人","買賣：買受人；贈與：取得所有權之人；設定典權：出典人"],"a":1,"e":"有償移轉為原所有權人；無償移轉為取得所有權之人；設定典權為出典人。"},
{"s":"土地稅法規","t":"申報期限","art":"土地稅法 第49條","q":"土地所有權移轉或設定典權時，應於何時申報土地移轉現值？","o":["訂約之日起十五日內，由權利人單獨申報","訂約之日起三十日內，由權利人及義務人共同申報","移轉登記時，由義務人申報","訂約之日起六十日內，由地政士申報"],"a":1,"e":"權利人及義務人應於訂定契約之日起三十日內，檢附契約影本及有關文件，共同向主管稽徵機關申報其土地移轉現值。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第16條","q":"地價稅的基本稅率與累進起點地價為何？","o":["基本稅率 2‰；累進起點為五公畝平均地價","基本稅率 10‰；累進起點為該直轄市或縣（市）七公畝之平均地價","基本稅率 10‰；累進起點為三公畝平均地價","基本稅率 6‰；累進起點為七公畝平均地價"],"a":1,"e":"基本稅率 10‰；超過累進起點地價者，依倍數累進 15‰、25‰、35‰、45‰，最高 55‰（20 倍以上）。累進起點不包括工業、礦業、農業及免稅土地。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第9條、第17條","q":"地價稅自用住宅用地的稅率與面積限制為何？","o":["2‰；都市三公畝、非都市七公畝；本人、配偶及未成年受扶養親屬以一處為限","10‰；都市三公畝、非都市七公畝","2‰；都市一．五公畝、非都市三．五公畝","6‰；不限面積"],"a":0,"e":"自用住宅用地按 2‰ 計徵，都市三公畝、非都市七公畝為限；本人、配偶及未成年之受扶養親屬以一處為限。須所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第18條","q":"下列何者「不」適用地價稅 10‰ 特別稅率？","o":["工業用地","經政府核准之加油站","公眾使用之停車場","出租之住宅用地"],"a":3,"e":"10‰ 特別稅率適用於工業用地、礦業用地、私立公園／動物園／體育場所、寺廟教堂、名勝古蹟、加油站、停車場等。出租住宅用一般稅率。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第19條","q":"都市計畫公共設施保留地，在保留期間仍為建築使用（非自用住宅）者，地價稅如何計徵？","o":["免徵","2‰","6‰","10‰"],"a":2,"e":"仍為建築使用者統按 6‰ 計徵（自用住宅者依 2‰）；未作任何使用並與使用中之土地隔離者，免徵地價稅。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第41條","q":"申請適用地價稅特別稅率（如自用住宅），應於何時提出？","o":["每年地價稅開徵前十日","每年地價稅開徵四十日前","每年八月三十一日前","隨時均可，當年適用"],"a":1,"e":"應於每年地價稅開徵四十日前提出申請；逾期申請者，自申請之次年開始適用。"},
{"s":"土地稅法規","t":"納稅義務人","art":"土地稅法 第3條之1","q":"土地為信託財產者，信託關係存續中的地價稅納稅義務人為何人？","o":["委託人","受託人","受益人","信託監察人"],"a":1,"e":"信託關係存續中，以受託人為地價稅或田賦之納稅義務人；受託人應與其自有土地分別計算地價稅。"},
{"s":"土地稅法規","t":"房地合一稅","art":"所得稅法 第14條之4","q":"房地合一稅 2.0，境內居住個人持有房地「超過二年未逾五年」出售，稅率為何？","o":["45%","35%","20%","15%"],"a":1,"e":"二年以內 45%；超過二年未逾五年 35%；超過五年未逾十年 20%；超過十年 15%。"},
{"s":"土地稅法規","t":"房地合一稅","art":"所得稅法 第4條之5、第14條之4","q":"房地合一稅自住房地優惠的要件與內容為何？","o":["持有並設籍滿二年，全額免稅","本人、配偶或未成年子女設籍並居住且持有滿六年，課稅所得 400 萬元以下免稅，超過部分 10%","持有滿十年，按 15% 課徵","設籍滿一年，課稅所得 200 萬元以下免稅"],"a":1,"e":"個人與其配偶及未成年子女辦竣戶籍登記、持有並居住連續滿六年，且出售前五年內無出租、供營業或執行業務使用者，課稅所得 400 萬元以下免稅，超過部分按 10% 課徵。六年內以一次為限。"},
{"s":"土地稅法規","t":"契稅","art":"契稅條例 第3條","q":"下列契稅稅率，何者正確？","o":["買賣 6%、典權 4%、交換 2%、贈與 6%、分割 2%","買賣 4%、典權 6%、交換 2%、贈與 4%、分割 2%","買賣 6%、典權 2%、交換 4%、贈與 6%、分割 4%","全部一律 6%"],"a":0,"e":"買賣 6%、典權 4%、交換 2%、贈與 6%、分割 2%、占有 6%。開徵土地增值稅區域之土地免徵契稅，契稅只對房屋課徵。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第3條","q":"設有典權之土地，地價稅的納稅義務人為何人？","o":["出典人","典權人","土地使用人","由雙方約定"],"a":1,"e":"地價稅納稅義務人：土地所有權人；設有典權土地為典權人；承領土地為承領人；承墾土地為耕作權人。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第3條","q":"承墾土地的地價稅納稅義務人為何人？","o":["土地所有權人","承墾人之配偶","耕作權人","管理機關"],"a":2,"e":"承墾土地以耕作權人為地價稅納稅義務人；承領土地則為承領人。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第3條第2項","q":"公同共有土地與分別共有土地的地價稅納稅義務人分別為何？","o":["均以全體共有人連帶負責","公同共有以管理人為納稅義務人；分別共有按各共有人應有部分為納稅義務人","公同共有按應有部分；分別共有以管理人為納稅義務人","均以應有部分最大者為納稅義務人"],"a":1,"e":"土地所有權屬於公有或公同共有者，以管理機關或管理人為納稅義務人；分別共有者，地價稅以共有人各按其應有部分為納稅義務人。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第4條","q":"下列何種情形，主管稽徵機關得指定土地使用人負責代繳地價稅？","o":["納稅義務人出國旅遊","納稅義務人行蹤不明、權屬不明或無人管理","土地出租他人","土地設定抵押權"],"a":1,"e":"納稅義務人行蹤不明、權屬不明、無人管理，或土地所有權人申請由占有人代繳者，得指定土地使用人負責代繳。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第11條","q":"土地稅法所稱「空地」，下列何者不符合其定義？","o":["已完成道路、排水及電力設施，於有自來水地區並已完成自來水系統","仍未依法建築使用","雖建築使用，但建築改良物價值不及所占基地申報地價百分之十","已依法建築且建物價值超過基地申報地價一半"],"a":3,"e":"空地指已完成道路、排水及電力設施，於有自來水地區並已完成自來水系統，而仍未依法建築使用；或雖建築使用，而其建築改良物價值不及所占基地申報地價 10%，且經直轄市或縣（市）政府認定應予增建、改建或重建之私有及公有非公用建築用地。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第21條","q":"經限期使用而逾期未使用之空地，應加徵空地稅的倍數為何？","o":["基本稅額加徵一至三倍","基本稅額加徵二至五倍","基本稅額加徵五至十倍","一律加徵三倍"],"a":1,"e":"凡經直轄市或縣（市）政府核定應徵空地稅之土地，按該宗土地應納地價稅基本稅額加徵二倍至五倍之空地稅。"},
{"s":"土地稅法規","t":"田賦與荒地稅","art":"土地稅法 第22條之1","q":"農業用地閒置不用，經限期使用逾期仍未使用者，加徵荒地稅的倍數為何？","o":["應納田賦加徵一倍至三倍","應納田賦加徵二倍至五倍","應納地價稅加徵一倍","按申報地價千分之十加徵"],"a":0,"e":"按應納田賦加徵一倍至三倍之荒地稅；經加徵荒地稅滿三年，仍不使用者，得照價收買。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第20條","q":"公有土地的地價稅如何課徵？","o":["一律免徵","按基本稅率千分之十徵收；供公共使用者免徵","按自用住宅稅率千分之二徵收","按累進稅率徵收"],"a":1,"e":"公有土地按基本稅率 10‰ 徵收地價稅或田賦；但公有土地供公共使用者，免徵。"},
{"s":"土地稅法規","t":"田賦與荒地稅","art":"土地稅法 第22條","q":"下列何種土地，依土地稅法應課徵「田賦」而非地價稅？","o":["都市計畫住宅區土地","都市計畫農業區、保護區內之農業用地","工業區土地","商業區土地"],"a":1,"e":"非都市土地依法編定之農業用地或未規定地價者，以及都市計畫農業區、保護區、公共設施尚未完竣前仍作農業用地使用者等，徵收田賦。田賦目前依行政院命令停徵。"},
{"s":"土地稅法規","t":"田賦與荒地稅","art":"土地稅法 第27條之1（停徵田賦）","q":"目前我國田賦的課徵狀態為何？","o":["每年八月開徵","依行政院命令自民國 76 年第二期起停徵","改徵實物","併入地價稅課徵"],"a":1,"e":"為減輕農民負擔，田賦自民國 76 年第二期起停徵，因此作農業使用之農業用地實務上不必繳田賦。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第16條","q":"土地所有權人的地價總額超過累進起點地價，但未達五倍者，超過部分適用何種稅率？","o":["千分之十","千分之十五","千分之二十五","千分之三十五"],"a":1,"e":"超過累進起點地價未達五倍者，就超過部分課徵 15‰；五至十倍 25‰；十至十五倍 35‰；十五至二十倍 45‰；二十倍以上 55‰。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第16條","q":"地價稅累進稅率的最高稅率為何？","o":["千分之四十","千分之四十五","千分之五十五","千分之六十"],"a":2,"e":"地價總額超過累進起點地價二十倍以上者，就其超過部分課徵 55‰，是地價稅的最高稅率。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第9條","q":"自用住宅用地的戶籍要件，下列何人設籍「不」符合？","o":["土地所有權人本人","土地所有權人之配偶","土地所有權人之直系親屬","土地所有權人之兄弟姊妹"],"a":3,"e":"自用住宅用地指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用之住宅用地。兄弟姊妹是旁系親屬，不符合。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第17條第3項","q":"政府興建之國民住宅、企業興建之勞工宿舍，其用地地價稅適用何稅率？","o":["千分之二","千分之六","千分之十","免徵"],"a":0,"e":"政府興建之國民住宅及企業或公營事業興建之勞工宿舍，自動工興建或取得土地所有權之日起，其用地之地價稅適用 2‰ 計徵。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法施行細則 第20條","q":"地價稅的納稅義務基準日為何？","o":["每年一月一日","每年二月末日","每年八月三十一日","每年十一月一日"],"a":2,"e":"地價稅以每年 8 月 31 日為納稅義務基準日，由當日土地登記簿所載之所有權人或典權人為納稅義務人，每年 11 月開徵。房屋稅基準日則為每年 2 月末日。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第6條","q":"土地稅之減免標準及程序由何者訂定？","o":["立法院","行政院","財政部","各直轄市、縣（市）議會"],"a":1,"e":"為發展經濟、促進土地利用、增進社會福利，對於國防、政府機關、公共設施、騎樓走廊、研究機構、教育、交通、水利、給水、鹽業、宗教、醫療、衛生、公私墓、慈善或公益事業及合理之自用住宅等所使用之土地，得予適當之減免；其減免標準及程序，由行政院定之（即土地稅減免規則）。"},
{"s":"土地稅法規","t":"移轉現值","art":"土地稅法 第30條","q":"土地買賣於訂約後第 45 日才申報移轉現值，應以何時的公告土地現值為審核標準？","o":["訂約日當期","受理申報機關收件日當期","辦竣移轉登記日當期","付清價款日當期"],"a":1,"e":"於訂定契約之日起三十日內申報者，以訂約日當期之公告土地現值為準；逾三十日申報者，以受理申報機關收件日當期之公告土地現值為準。"},
{"s":"土地稅法規","t":"移轉現值","art":"土地稅法 第30條","q":"遺贈之土地，其申報移轉現值以何時的公告土地現值為準？","o":["遺囑作成日","遺贈人死亡日","受遺贈人申報日","繼承登記完成日"],"a":1,"e":"遺贈之土地，以遺贈人死亡日當期之公告土地現值為準。"},
{"s":"土地稅法規","t":"移轉現值","art":"土地稅法 第30條","q":"經法院拍賣之土地，移轉現值如何認定？","o":["以拍定日當期公告土地現值為準；拍定價額低於公告現值者，以拍定價額為準","一律以拍定價額為準","以聲請拍賣日之公告現值為準","以查封日之公告現值為準"],"a":0,"e":"經法院或法務部行政執行署所屬行政執行分署拍賣之土地，以拍定日當期之公告土地現值為準；但拍定價額低於公告土地現值者，以拍定價額為準。"},
{"s":"土地稅法規","t":"移轉現值","art":"土地稅法 第30條","q":"依法院判決移轉登記者，申報移轉現值以何時的公告土地現值為準？","o":["判決確定日","申報人向法院起訴日","辦理登記日","第一審判決日"],"a":1,"e":"依法院判決移轉登記者，以申報人向法院起訴日當期之公告土地現值為準。"},
{"s":"土地稅法規","t":"漲價總數額","art":"土地稅法 第31條","q":"計算土地漲價總數額時，下列何者「不得」自申報移轉現值中減除？","o":["改良土地費用","已繳納之工程受益費","土地重劃費用","買賣時支付之仲介服務費"],"a":3,"e":"漲價總數額＝申報移轉現值－原規定地價或前次移轉現值（按物價指數調整）－改良土地費用、已繳工程受益費、土地重劃費用及因土地使用變更無償捐贈之公共設施用地公告現值。仲介費不得減除。"},
{"s":"土地稅法規","t":"漲價總數額","art":"土地稅法 第32條","q":"計算漲價總數額時，原規定地價或前次移轉現值應如何處理？","o":["直接以原數額計算","按政府發布之物價指數調整後計算","按銀行一年期定存利率調整","按公告地價調幅調整"],"a":1,"e":"原規定地價及前次移轉時核計土地增值稅之現值，遇一般物價有變動時，按政府發布之物價指數調整後，再計算其土地漲價總數額。"},
{"s":"土地稅法規","t":"漲價總數額","art":"土地稅法 第31條第3項","q":"因重新規定地價增繳之地價稅，准予抵繳土地增值稅的上限為何？","o":["全額抵繳","應繳增值稅總額之百分之五","應繳增值稅總額之百分之十","不得抵繳"],"a":1,"e":"土地所有權人辦理土地移轉繳納土地增值稅時，在其持有土地期間內，因重新規定地價增繳之地價稅，就其移轉土地部分，准予抵繳其應納之土地增值稅，但抵繳總額以不超過應繳增值稅總額 5% 為限。"},
{"s":"土地稅法規","t":"增值稅稅率","art":"土地稅法 第33條","q":"持有 20 年以下，漲價總數額超過原地價 100% 而未達 200% 時，應納稅額公式為何？","o":["漲價總數額 × 30%","漲價總數額 × 30% －原地價 × 10%","漲價總數額 × 20% ＋原地價 × 10%","漲價總數額 × 40% －原地價 × 30%"],"a":1,"e":"第二級：漲價總數額 ×30% －原地價（物價調整後）×10%；第三級（200% 以上）：漲價總數額 ×40% －原地價 ×30%。"},
{"s":"土地稅法規","t":"增值稅稅率","art":"土地稅法 第33條","q":"持有土地 25 年後出售，長期持有減徵比例為何？","o":["不減徵","就超過最低稅率部分減徵 20%","就超過最低稅率部分減徵 25%","全部稅額減徵 20%"],"a":1,"e":"持有 20 年以上減徵 20%、30 年以上 30%、40 年以上 40%，均就超過第一級 20% 稅率之部分計算。25 年落在 20 年以上未達 30 年。"},
{"s":"土地稅法規","t":"典權與增值稅","art":"土地稅法 第29條","q":"已規定地價之土地設定典權時，土地增值稅如何處理？","o":["免徵","出典人應預繳土地增值稅；回贖時原繳稅款無息退還","典權人繳納，回贖時不退還","待典權人取得所有權時才課徵"],"a":1,"e":"設定典權時，出典人應依法預繳土地增值稅；但出典人回贖時，原繳之土地增值稅應無息退還。"},
{"s":"土地稅法規","t":"納稅義務人","art":"土地稅法 第5條之1","q":"有償移轉之土地增值稅，納稅義務人未於期限內繳納時，如何處理？","o":["移轉契約無效","得由取得所有權之人代為繳納","由地政機關代繳","由仲介業者代繳"],"a":1,"e":"土地所有權移轉，其應納之土地增值稅，納稅義務人未於規定期限內繳納者，得由取得所有權之人代為繳納。"},
{"s":"土地稅法規","t":"稽徵程序","art":"土地稅法 第51條","q":"欠繳土地稅之土地，於欠稅未繳清前，有何限制？","o":["不得設定抵押權","不得辦理移轉登記或設定典權","不得出租","不得申請建照"],"a":1,"e":"欠繳土地稅之土地，在欠稅未繳清前，不得辦理移轉登記或設定典權。"},
{"s":"土地稅法規","t":"稽徵程序","art":"土地稅法 第54條第2項","q":"土地買賣未辦竣權利移轉登記，承買人再行出售該土地者，罰則為何？","o":["處應納增值稅一倍罰鍰","處再行出售移轉現值百分之二之罰鍰","處新臺幣三萬元罰鍰","處二年以下有期徒刑"],"a":1,"e":"土地買賣未辦竣權利移轉登記，承買人再行出售該土地者，處再行出售移轉現值 2% 之罰鍰。這是防止「炒作不登記」的規定。"},
{"s":"土地稅法規","t":"稽徵程序","art":"土地稅法 第49條第2項","q":"主管稽徵機關應於申報移轉現值收件之日起幾日內，核定應納土地增值稅額並填發稅單？","o":["三日","七日","十五日","三十日"],"a":1,"e":"應於申報土地移轉現值收件之日起七日內，核定應納土地增值稅額，並填發稅單送達納稅義務人。"},
{"s":"土地稅法規","t":"稽徵程序","art":"土地稅法 第50條","q":"土地增值稅納稅義務人收到繳納通知書後，應於幾日內繳納？","o":["十日","十五日","三十日","六十日"],"a":2,"e":"土地增值稅納稅義務人於收到土地增值稅繳納通知書後，應於三十日內向公庫繳納。"},
{"s":"土地稅法規","t":"信託與增值稅","art":"土地稅法 第31條之1","q":"依第 28 條之 3 不課徵增值稅的信託土地，日後所有權移轉時，原地價如何認定？","o":["以信託成立時的公告現值為原地價","以該土地不課徵土地增值稅前之原規定地價或最近一次經核定之移轉現值為原地價","以受益人取得時的現值為原地價","不必計算原地價"],"a":1,"e":"依第 28 條之 3 不課徵之土地，於所有權移轉、設定典權或依信託法第 35 條移轉為受託人自有土地時，以該土地不課徵前之原規定地價或最近一次經核定之移轉現值為原地價。"},
{"s":"土地稅法規","t":"信託與增值稅","art":"土地稅法 第28條之3","q":"以遺囑成立信託，遺囑人死亡時土地移轉予受託人，土地增值稅如何處理？","o":["由受託人繳納","不課徵","按繼承免徵處理，但須繳遺產稅以外的稅","由受益人繳納"],"a":1,"e":"遺囑信託於遺囑人死亡時移轉予受託人，屬第 28 條之 3 不課徵土地增值稅之情形。"},
{"s":"土地稅法規","t":"自用住宅增值稅","art":"土地稅法 第9條、第34條","q":"出售自用住宅用地適用 10% 稅率，地上建物的所有權歸屬須符合何條件？","o":["不限所有人","須為土地所有權人或其配偶、直系親屬所有","須為土地所有權人本人所有","須為設籍之人所有"],"a":1,"e":"依土地稅法施行細則，自用住宅用地之地上建物須為土地所有權人或其配偶、直系親屬所有，並於該地辦竣戶籍登記。"},
{"s":"土地稅法規","t":"自用住宅增值稅","art":"土地稅法 第34條","q":"出售都市土地 4 公畝的自用住宅用地，增值稅如何計算？","o":["全部按 10% 課徵","三公畝以內按 10%，超過的一公畝按一般稅率","全部按一般稅率課徵","一．五公畝以內按 10%，其餘一般稅率"],"a":1,"e":"都市土地以三公畝為限，超過部分依一般累進稅率課徵。"},
{"s":"土地稅法規","t":"自用住宅增值稅","art":"土地稅法 第34條","q":"「一生一次」自用住宅優惠稅率，是以何者為計算單位？","o":["以每一戶籍為單位","以土地所有權人為單位，一生以一次為限","以每一筆土地為單位","以夫妻為單位，合計一次"],"a":1,"e":"依第 34 條第 1 項規定（一生一次），土地所有權人出售自用住宅用地適用 10% 稅率，以一次為限。"},
{"s":"土地稅法規","t":"重購退稅","art":"土地稅法 第35條","q":"下列何者「不」屬於土地稅法第 35 條重購退稅的適用類型？","o":["自用住宅用地出售後重購自用住宅用地","自營工廠用地出售後重購工業用地","自耕農業用地出售後重購自耕農業用地","出租住宅用地出售後重購出租住宅用地"],"a":3,"e":"重購退稅只限三種：自用住宅用地、自營工廠用地（另購工業區或都市計畫工業區工業用地）、自耕之農業用地（另購自耕農業用地）。"},
{"s":"土地稅法規","t":"重購退稅","art":"土地稅法 第35條","q":"重購退稅可否「先購後售」？","o":["不可，只能先售後購","可以，先購買土地後二年內出售，亦適用","可以，但期間為一年","可以，但須經財政部核准"],"a":1,"e":"土地所有權人於先購買土地後，自完成移轉登記之日起二年內，始行出售土地者，準用重購退稅規定。"},
{"s":"土地稅法規","t":"重購退稅","art":"土地稅法 第35條","q":"重購退稅的退稅金額如何計算？","o":["退還全部已繳增值稅","於已納土地增值稅額內，退還不足支付新購土地地價之數額","退還已繳稅額的一半","退還新購土地價格的 10%"],"a":1,"e":"新購土地地價超過原出售土地地價扣除繳納土地增值稅後之餘額者，得申請就其已納土地增值稅額內，退還其不足支付新購土地地價之數額。"},
{"s":"土地稅法規","t":"增值稅免徵","art":"土地稅法 第39條之1","q":"區段徵收時，因領回抵價地不足最小建築單位面積而改領現金補償，土地增值稅如何處理？","o":["按一般稅率課徵","減徵 40%","免徵","不課徵"],"a":2,"e":"區段徵收以現金補償其地價者免徵；因領回抵價地不足最小建築單位面積而領取現金補償者，亦免徵。"},
{"s":"土地稅法規","t":"增值稅免徵","art":"土地稅法 第39條之1第3項","q":"區段徵收領回抵價地者，其土地增值稅如何處理？","o":["領回時課徵","領回時免徵；領回後第一次移轉以實際領回抵價地之地價為原地價計算，並減徵 40%","領回時與第一次移轉時均免徵","領回時減徵 40%"],"a":1,"e":"以抵價地補償者免徵；但領回抵價地後第一次移轉時，以原土地所有權人實際領回抵價地之地價為原地價計算漲價總數額，並減徵 40%。"},
{"s":"土地稅法規","t":"增值稅不課徵","art":"土地稅法 第39條之2","q":"農業用地依法申請不課徵土地增值稅後，承受人未作農業使用且未在期限內恢復，有何效果？","o":["無任何效果","於再移轉時，依法課徵土地增值稅（以前次不課徵前之原地價為準），並處罰鍰","原移轉無效","由出賣人補繳"],"a":1,"e":"取得不課徵之農業用地後，經查獲未作農業使用且未在期限內恢復者，於再移轉時應依法課徵土地增值稅，並依規定處罰。"},
{"s":"土地稅法規","t":"房屋稅","art":"房屋稅條例 第4條","q":"房屋稅的納稅義務人原則上為何人？","o":["房屋使用人","房屋所有人；設有典權者為典權人","土地所有權人","承租人"],"a":1,"e":"房屋稅向房屋所有人徵收之；設有典權者，向典權人徵收；共有房屋向共有人徵收，由共有人推定一人繳納。"},
{"s":"土地稅法規","t":"房屋稅","art":"房屋稅條例 第5條","q":"房屋稅 2.0 之後，本人、配偶及未成年子女全國僅持有一戶，供自住且房屋現值在一定金額以下者，稅率為何？","o":["0.6%","1%","1.2%","1.5%"],"a":1,"e":"全國單一自住房屋（現值在一定金額以下）稅率 1%；其他自住住家用房屋 1.2%。"},
{"s":"土地稅法規","t":"房屋稅","art":"房屋稅條例 第5條","q":"非自住之住家用房屋，房屋稅 2.0 的稅率範圍為何？","o":["1.2%～2%","1.5%～3.6%","2%～4.8%，採全國總歸戶累進","3%～5%"],"a":2,"e":"房屋稅 2.0（囤房稅 2.0）將非自住住家用房屋改為全國總歸戶，稅率 2%～4.8% 累進；營業用房屋 3%～5%。"},
{"s":"土地稅法規","t":"房屋稅","art":"房屋稅條例 第5條","q":"供營業、私人醫院、診所或自由職業事務所使用之房屋，房屋稅最低與最高稅率為何？","o":["1%～2%","1.5%～2.5%","2%～3.6%","3%～5%"],"a":3,"e":"營業用等房屋最低 3%、最高 5%；人民團體等非營業用房屋 1.5%～2.5%。"},
{"s":"土地稅法規","t":"房屋稅","art":"房屋稅條例 第6條之1","q":"房屋稅的納稅義務基準日為何？","o":["每年一月一日","每年二月末日","每年七月一日","每年八月三十一日"],"a":1,"e":"房屋稅以每年二月末日為納稅義務基準日，由當日房屋稅籍資料所載之納稅義務人繳納，每年 5 月開徵，課稅期間為上一年 1 月 1 日至 12 月 31 日。"},
{"s":"土地稅法規","t":"房屋稅","art":"房屋稅條例 第7條","q":"新建、增建或改建房屋，納稅義務人應於何時申報房屋稅籍？","o":["建造完成之日起十五日內","建造完成之日起三十日內","取得使用執照之日起六十日內","每年開徵前"],"a":1,"e":"納稅義務人應於房屋建造完成之日起三十日內檢附有關文件，向當地主管稽徵機關申報房屋稅籍有關事項及使用情形。"},
{"s":"土地稅法規","t":"房屋稅","art":"房屋稅條例 第15條","q":"房屋現值在新臺幣十萬元以下屬自然人持有之住家房屋，免徵房屋稅的限制為何？","o":["不限戶數","全國合計以三戶為限","每縣市三戶","全國一戶"],"a":1,"e":"房屋稅 2.0 修正後，房屋現值十萬元以下屬自然人持有者，全國合計以三戶為限免徵。"},
{"s":"土地稅法規","t":"房屋稅","art":"房屋稅條例 第5條","q":"起造人持有使用執照所載用途為住家用之待銷售房屋，於起課房屋稅二年內，房屋稅稅率為何？","o":["1.2%","2%～3.6%","3%～5%","2%～4.8%"],"a":1,"e":"起造人待銷售房屋於起課房屋稅二年內，稅率 2%～3.6%；超過二年者併入非自住住家用房屋課徵。"},
{"s":"土地稅法規","t":"契稅","art":"契稅條例 第2條","q":"契稅的課徵對象為何？","o":["土地及房屋","僅房屋（開徵土地增值稅區域之土地免徵契稅）","僅土地","僅預售屋"],"a":1,"e":"不動產之買賣、承典、交換、贈與、分割或因占有而取得所有權者，均應購用公定契紙申報繳納契稅；但在開徵土地增值稅區域之土地，免徵契稅。實務上契稅只對房屋課徵。"},
{"s":"土地稅法規","t":"契稅","art":"契稅條例 第16條","q":"契稅應於何時申報？","o":["不動產移轉契約成立之日起十五日內","不動產移轉契約成立之日起三十日內","辦理移轉登記時","交屋後六十日內"],"a":1,"e":"納稅義務人應於不動產買賣、承典、交換、贈與及分割契約成立之日起，或因占有而依法申請為所有人之日起三十日內，申報契稅。"},
{"s":"土地稅法規","t":"契稅","art":"契稅條例 第4條～第9條","q":"下列契稅納稅義務人的配對，何者錯誤？","o":["買賣：買受人","典權：典權人","贈與：贈與人","占有：占有不動產依法取得所有權之人"],"a":2,"e":"贈與契稅由「受贈人」申報納稅。交換由交換人估價立契各就承受部分納稅；分割由分割人各就承受部分納稅。"},
{"s":"土地稅法規","t":"契稅","art":"契稅條例 第10條","q":"先典後賣者，其契稅如何處理？","o":["須重新全額繳納買賣契稅","得以原納典權契稅額，抵繳買賣契稅","免徵買賣契稅","由出典人繳納買賣契稅"],"a":1,"e":"先典後賣者，得以原納典權契稅額，抵繳買賣契稅。但承典人與買主不同時，不得抵繳。"},
{"s":"土地稅法規","t":"遺產稅與贈與稅","art":"遺產及贈與稅法 第23條、第26條","q":"遺產稅應於何時申報？可否延期？","o":["被繼承人死亡之日起三個月內；不得延期","被繼承人死亡之日起六個月內；有正當理由得申請延長，以三個月為限","繼承人知悉之日起一年內；得延長一年","被繼承人死亡之日起六個月內；得延長六個月"],"a":1,"e":"被繼承人死亡遺有財產者，應於死亡之日起六個月內申報遺產稅；具有正當理由不能如期申報者，得申請延長，延長期限以三個月為限（但因不可抗力或特殊事由者，得由稽徵機關視實際情形核定）。"},
{"s":"土地稅法規","t":"遺產稅與贈與稅","art":"遺產及贈與稅法 第24條","q":"贈與稅應於何時申報？","o":["贈與行為發生後十日內","超過免稅額之贈與行為發生後三十日內","贈與行為發生後六個月內","每年五月綜合所得稅申報時"],"a":1,"e":"除第 20 條所規定之贈與外，一年內贈與他人之財產總值超過贈與稅免稅額時，應於超過免稅額之贈與行為發生後三十日內辦理贈與稅申報。"},
{"s":"土地稅法規","t":"遺產稅與贈與稅","art":"遺產及贈與稅法 第6條","q":"遺產稅納稅義務人的順序為何？","o":["繼承人 → 遺囑執行人 → 遺產管理人","遺囑執行人 → 繼承人及受遺贈人 → 遺產管理人","遺產管理人 → 繼承人 → 受遺贈人","受遺贈人 → 繼承人 → 遺囑執行人"],"a":1,"e":"有遺囑執行人者為遺囑執行人；無遺囑執行人者為繼承人及受遺贈人；無遺囑執行人及繼承人者為依法選定之遺產管理人。"},
{"s":"土地稅法規","t":"遺產稅與贈與稅","art":"遺產及贈與稅法 第7條","q":"贈與稅的納稅義務人原則上為何人？","o":["受贈人","贈與人；贈與人行蹤不明、逾期未繳且無財產可供執行，或死亡時贈與稅尚未核課者，以受贈人為納稅義務人","贈與人與受贈人連帶","地政士"],"a":1,"e":"贈與稅原則以贈與人為納稅義務人；但贈與人行蹤不明、逾期未繳且在中華民國境內無財產可供執行，或死亡時贈與稅尚未核課者，以受贈人為納稅義務人。"},
{"s":"土地稅法規","t":"遺產稅與贈與稅","art":"遺產及贈與稅法 第15條","q":"被繼承人死亡前幾年內贈與配偶或各順序繼承人之財產，應視為遺產併入課稅？","o":["一年","二年","三年","五年"],"a":1,"e":"被繼承人死亡前二年內贈與配偶、各順序繼承人及其配偶之財產，視為被繼承人之遺產，併入遺產總額課稅。"},
{"s":"土地稅法規","t":"遺產稅與贈與稅","art":"遺產及贈與稅法 第20條","q":"下列何者「不」計入贈與總額？","o":["父親贈與成年子女現金","配偶相互贈與之財產","祖父贈與孫子土地","朋友間贈與房屋"],"a":1,"e":"配偶相互贈與之財產不計入贈與總額。其他不計入者包括捐贈政府或公益團體、扶養義務人為受扶養人支付之生活費等、父母於子女婚嫁時所贈與之財物總金額一定金額以內等。"},
{"s":"土地稅法規","t":"遺產稅與贈與稅","art":"遺產及贈與稅法 第8條","q":"遺產稅未繳清前，有何限制？","o":["不得申報綜合所得稅","不得分割遺產、交付遺贈或辦理移轉登記","不得拋棄繼承","不得申請遺產清冊"],"a":1,"e":"遺產稅未繳清前，不得分割遺產、交付遺贈或辦理移轉登記；贈與稅未繳清前，不得辦理贈與移轉登記（但依法提供擔保或經核准延期、分期繳納者除外）。"},
{"s":"土地稅法規","t":"遺產稅與贈與稅","art":"遺產及贈與稅法 第13條","q":"遺產稅的稅率結構為何？","o":["單一稅率 10%","10%、15%、20% 三級累進","10%、20%、30%、40% 四級累進","20%、30%、40% 三級累進"],"a":1,"e":"遺產稅採 10%、15%、20% 三級累進稅率（級距金額依物價指數調整公告）；贈與稅亦同為 10%、15%、20%。"},
{"s":"土地稅法規","t":"遺產稅與贈與稅","art":"遺產及贈與稅法 第17條第1項第6款","q":"遺產中的農業用地由繼承人承受，在遺產稅上如何處理？","o":["照常計入課稅","扣除其土地及地上農作物價值之全數；承受人自承受之日起五年內須繼續作農業使用","減半計入","須經農業部核准後免稅"],"a":1,"e":"遺產中之農業用地及其地上農作物，由繼承人或受遺贈人承受者，扣除其土地及地上農作物價值之全數。承受人自承受之日起五年內未繼續作農業使用且未在期限內恢復者，應追繳應納稅賦。"},
{"s":"土地稅法規","t":"遺產稅與贈與稅","art":"遺產及贈與稅法 第30條","q":"遺產稅或贈與稅應納稅額在新臺幣三十萬元以上，納稅義務人確有困難時，可如何繳納？","o":["只能一次繳清","得申請分十八期以內繳納；現金繳納確有困難者得申請以實物一次抵繳","得申請延至五年後繳納","得以股票分期繳納"],"a":1,"e":"應於核定通知書送達之日起二個月內繳清；應納稅額在三十萬元以上，確有困難不能一次繳納現金時，得申請分十八期以內繳納；現金繳納確有困難者，得申請以實物一次抵繳。"},
{"s":"土地稅法規","t":"遺產稅與贈與稅","art":"遺產及贈與稅法 第42條","q":"地政機關辦理遺產或贈與之不動產移轉登記時，申請人應檢附何種文件？","o":["遺產稅或贈與稅繳清證明書、核定免稅證明書、不計入遺產總額證明書或同意移轉證明書","僅需戶籍謄本","僅需繼承系統表","法院判決書"],"a":0,"e":"地政機關及其他政府機關，或公私事業辦理遺產或贈與財產之產權移轉登記時，應通知當事人檢附稽徵機關核發之稅款繳清證明書、核定免稅證明書、不計入遺產總額證明書或不計入贈與總額證明書、同意移轉證明書之副本；未繳附者不得逕為移轉登記。"},
{"s":"土地稅法規","t":"房地合一稅","art":"所得稅法 第4條之4","q":"個人出售房屋及土地適用房地合一稅，以何時取得為適用範圍？","o":["民國 100 年 1 月 1 日以後取得","民國 105 年 1 月 1 日以後取得","民國 110 年 7 月 1 日以後取得","不論何時取得"],"a":1,"e":"個人及營利事業交易 105 年 1 月 1 日以後取得之房屋、房屋及其坐落基地或依法得核發建造執照之土地，適用房地合一課稅；110 年 7 月 1 日起（2.0）再擴及預售屋及特定股權交易。"},
{"s":"土地稅法規","t":"房地合一稅","art":"所得稅法 第14條之5","q":"個人房地合一稅應於何時申報？","o":["每年五月與綜合所得稅合併申報","房屋、土地完成所有權移轉登記日之次日起三十日內申報","簽約之日起三十日內","交屋之日起六十日內"],"a":1,"e":"個人有房地交易所得或損失，應於房屋、土地完成所有權移轉登記日之次日起算三十日內申報；無應納稅額者亦應申報。"},
{"s":"土地稅法規","t":"房地合一稅","art":"所得稅法 第14條之4","q":"非中華民國境內居住之個人，持有房地超過二年出售，房地合一稅率為何？","o":["15%","20%","35%","45%"],"a":2,"e":"非境內居住者：持有二年以內 45%；超過二年 35%。境內居住者則依 45%、35%、20%、15% 分級。"},
{"s":"土地稅法規","t":"房地合一稅","art":"所得稅法 第14條之4","q":"境內居住個人因調職、非自願離職或其他非自願性因素，交易持有五年以下之房地，稅率為何？","o":["45%","35%","20%","10%"],"a":2,"e":"因財政部公告之調職、非自願離職或其他非自願性因素，交易持有期間在五年以下之房屋、土地者，稅率為 20%。"},
{"s":"土地稅法規","t":"房地合一稅","art":"所得稅法 第14條之8","q":"個人出售自住房地後重購自住房地，房地合一稅的重購退稅期間為何？","o":["一年內","二年內","三年內","五年內"],"a":1,"e":"出售自住房地並已繳納房地合一稅，自完成移轉登記之日起二年內重購自住房地者，得按重購價額占出售價額之比率申請退還稅額（先購後售亦適用）。重購後五年內不得改作其他用途或再行移轉。"},
{"s":"土地稅法規","t":"房地合一稅","art":"所得稅法 第14條之4","q":"因繼承取得的房地，計算房地合一稅的持有期間時，下列何者正確？","o":["一律從繼承登記日起算","得將被繼承人持有期間合併計算","一律視為持有二年以內","不適用房地合一稅"],"a":1,"e":"個人因繼承或受遺贈取得之房地，得將被繼承人或遺贈人持有期間合併計算，以適用較低稅率。"},
{"s":"土地稅法規","t":"土地稅總論","art":"土地稅法 第1條","q":"土地稅法所稱「土地稅」包含哪些稅目？","o":["地價稅、房屋稅、契稅","地價稅、田賦、土地增值稅","土地增值稅、房地合一稅、契稅","地價稅、空地稅、遺產稅"],"a":1,"e":"土地稅分為地價稅、田賦及土地增值稅。空地稅、荒地稅是地價稅或田賦的加徵；房屋稅、契稅另有專法。"},
{"s":"土地稅法規","t":"地價稅","art":"土地稅法 第9條、第17條","q":"所有權人自住的房屋，一樓出租給他人開店，該部分土地地價稅如何處理？","o":["全部適用 2‰","出租或營業部分不適用自用住宅稅率，應按比例依一般稅率課徵","全部改按 10‰ 累進","免徵"],"a":1,"e":"自用住宅用地須「無出租或供營業用」。地上房屋部分出租或營業者，按出租或營業部分之面積比例，改依一般稅率計徵，其餘自住部分仍可適用 2‰。"},
{"s":"土地登記","t":"登記效力","art":"土地法 第43條","q":"依土地法所為之登記，具有何種效力？","o":["相對效力","對抗效力","絕對效力","推定效力，可隨時以反證推翻"],"a":2,"e":"依本法所為之登記有絕對效力，保護信賴登記而取得權利的善意第三人，是我國採托崙斯（Torrens）登記制精神的體現。"},
{"s":"土地登記","t":"損害賠償","art":"土地法 第68條、第70條","q":"因登記錯誤、遺漏或虛偽致受損害者，由誰負賠償責任？賠償財源為何？","o":["申請人負責；由申請人自籌","該地政機關負責；由登記費提存百分之十作為登記儲金","中央地政機關負責；由國庫支出","受理之地政士負責；由地政士公會基金支出"],"a":1,"e":"由該地政機關負損害賠償責任，但能證明原因應歸責於受害人者不在此限（第 68 條）。地政機關所收登記費應提存 10% 作為登記儲金，專備賠償之用（第 70 條）。"},
{"s":"土地登記","t":"申請期限","art":"土地法 第73條","q":"土地權利變更登記與繼承登記的申請期限分別為何？","o":["均為一個月","變更登記一個月；繼承登記六個月","變更登記三個月；繼承登記一年","變更登記一個月；繼承登記三個月"],"a":1,"e":"變更登記應於權利變更之日起一個月內為之；繼承登記得自繼承開始之日起六個月內為之。"},
{"s":"土地登記","t":"申請期限","art":"土地法 第73條第2項","q":"逾期申請登記之罰鍰如何計算？","o":["每逾一日處登記費一倍","每逾一個月得處應納登記費額一倍罰鍰，最高不得超過二十倍","一律處新臺幣一萬元","每逾一個月處登記費二倍，最高十倍"],"a":1,"e":"聲請逾期者，每逾一個月得處應納登記費額一倍之罰鍰，但最高不得超過二十倍。"},
{"s":"土地登記","t":"未辦繼承登記","art":"土地法 第73條之1","q":"逾期未辦繼承登記而經地政機關列冊管理的土地，列冊管理期間為多久？","o":["三年","五年","十年","十五年"],"a":3,"e":"列冊管理期間為十五年；期滿仍未聲請登記者，由地政機關移請財政部國有財產署公開標售。標售所得價款存入專戶保管，逾十年無繼承人申請提領者，歸屬國庫。"},
{"s":"土地登記","t":"登記規費","art":"土地法 第65條、第76條","q":"土地總登記與權利變更登記的登記費率分別為何？","o":["均為千分之一","總登記千分之二；變更登記千分之一","總登記千分之一；變更登記千分之二","總登記千分之五；變更登記千分之一"],"a":1,"e":"總登記費依申報地價千分之二；變更登記費依申報地價或權利價值千分之一。"},
{"s":"土地登記","t":"登記規費","art":"土地法 第78條","q":"下列何種登記「須」繳納登記費？","o":["更名登記","住址變更登記","消滅登記","買賣所有權移轉登記"],"a":3,"e":"第 78 條免納登記費之情形包括：因土地重劃之變更登記、更正登記、消滅登記、塗銷登記、更名登記、住址變更登記、標示變更登記、限制登記等。買賣移轉須依千分之一繳納。"},
{"s":"土地登記","t":"總登記程序","art":"土地法 第58條、第59條","q":"土地總登記公告期間及權利爭執處理，下列何者正確？","o":["公告不少於十五日；異議經調處不服者，應於接到調處通知後十五日內向司法機關訴請處理","公告不少於三十日；不服調處者三十日內起訴","公告七日；異議逕向法院起訴","公告不少於十五日；不服調處者二個月內提起訴願"],"a":0,"e":"依第 55 條所為之公告不得少於十五日。公告期間內提出異議者，由地政機關調處；不服調處者應於接到通知後十五日內向司法機關訴請處理，逾期不起訴者依調處結果辦理。"},
{"s":"土地登記","t":"更正登記","art":"土地法 第69條","q":"登記人員或利害關係人於登記完畢後發現登記錯誤或遺漏時，應如何更正？","o":["由登記人員逕行更正","非以書面聲請該管上級機關查明核准後，不得更正","須經法院判決確定","由利害關係人會同申請即可更正"],"a":1,"e":"非以書面聲請該管上級機關查明核准後，不得更正。但登記錯誤或遺漏純屬登記人員記載時之疏忽，並有原始登記原因證明文件可稽者，由登記機關逕行更正之。"},
{"s":"土地登記","t":"應登記之權利","art":"土地登記規則 第4條","q":"下列哪一種權利，「不屬於」土地登記規則所定應辦理登記之權利？","o":["不動產役權","農育權","租賃權","依習慣形成之物權"],"a":2,"e":"應登記之權利包括所有權、地上權、民國 99 年 8 月 3 日前發生之永佃權、不動產役權、典權、抵押權、耕作權、農育權及依習慣形成之物權。租賃權是債權，不在其中。"},
{"s":"土地登記","t":"登記完畢","art":"土地登記規則 第6條","q":"土地權利何時才算「登記完畢」？","o":["申請人繳清登記規費時","登記機關收件並編號時","登記於登記簿並校對完竣，加蓋登簿及校對人員名章後","核發權利書狀時"],"a":2,"e":"須記載於登記簿並校對完竣、蓋登簿及校對人員名章後才算登記完畢；電腦處理者，以登記資料於電腦儲存媒體儲存為準。"},
{"s":"土地登記","t":"塗銷登記","art":"土地登記規則 第7條","q":"依本規則登記之土地權利，原則上須經何種程序，登記機關才得為塗銷登記？","o":["利害關係人聲明異議","地政機關依職權調查","法院判決塗銷確定","鄉鎮市調解委員會調解成立"],"a":2,"e":"除本規則另有規定外，非經法院判決塗銷確定，登記機關不得為塗銷登記，以維護登記的公信力。"},
{"s":"土地登記","t":"申請人","art":"土地登記規則 第26條","q":"除另有規定外，土地登記原則上應由何者申請？","o":["權利人單獨申請","義務人單獨申請","權利人及義務人會同申請","地政機關依職權辦理"],"a":2,"e":"原則為權利人與義務人會同申請，例如買賣所有權移轉登記；例外情形才可單獨申請（第 27 條）。"},
{"s":"土地登記","t":"申請人","art":"土地登記規則 第27條","q":"下列何種登記，可由權利人或登記名義人「單獨」申請？","o":["買賣所有權移轉登記","抵押權設定登記","繼承登記","贈與所有權移轉登記"],"a":2,"e":"單獨申請包括土地總登記、建物所有權第一次登記、繼承登記、因法院判決之登記、更名或住址變更登記、消滅登記等。買賣、設定、贈與屬雙方行為，須會同申請。"},
{"s":"土地登記","t":"補正與駁回","art":"土地登記規則 第56條、第57條","q":"登記申請案經審查應補正者，申請人應於接到通知之日起幾日內補正？","o":["七日","十日","十五日","三十日"],"a":2,"e":"應於接到通知之日起十五日內補正；逾期未補正或未依通知補正者，依第 57 條駁回。"},
{"s":"土地登記","t":"撤回申請","art":"土地登記規則 第59條","q":"已送件的登記申請，何時以前可以撤回？","o":["收件後三日內","審查完成前","登記完畢前，由全體申請人以書面申請","書狀核發前，由權利人單獨申請"],"a":2,"e":"申請登記於登記完畢前，全體申請人以書面申請撤回者，登記機關應即將登記申請書及附件發還申請人。"},
{"s":"土地登記","t":"繼承登記","art":"土地登記規則 第120條","q":"部分繼承人因故不能會同時，其他繼承人可申請為何種登記？","o":["分別共有登記","為全體繼承人之利益，申請公同共有之登記","僅就自己應繼分申請登記","預告登記"],"a":1,"e":"得由其中一人或數人為全體繼承人之利益，就被繼承人之土地申請為公同共有之登記。"},
{"s":"土地登記","t":"繼承登記","art":"土地登記規則 第121條","q":"胎兒為繼承人時，繼承登記應如何辦理？","o":["待胎兒出生後才能辦理","由其母以胎兒名義申請登記，俟出生辦理戶籍登記後再辦更名登記","由其他繼承人代為保留應繼分","由法院選任特別代理人申請"],"a":1,"e":"胎兒為繼承人時，應由其母以胎兒名義申請登記；胎兒出生並辦理戶籍登記後，再行辦理更名登記。如將來為死產，由其他繼承人辦理更正登記。"},
{"s":"土地登記","t":"信託登記","art":"土地登記規則 第125條","q":"土地權利因成立信託關係而移轉予受託人時，應由何人申請信託登記？","o":["委託人單獨申請","受託人單獨申請","委託人與受託人會同申請","受益人與受託人會同申請"],"a":2,"e":"應由委託人與受託人會同申請。遺囑信託則由繼承人與受託人會同申請（第 126 條）。"},
{"s":"土地登記","t":"限制登記","art":"土地登記規則 第136條","q":"下列何者「不屬於」土地登記規則所稱的限制登記？","o":["預告登記","查封、假扣押、假處分登記","破產登記","抵押權設定登記"],"a":3,"e":"限制登記指限制登記名義人處分其土地權利所為之登記，包括預告登記、查封、假扣押、假處分或破產登記，及其他依法律所為禁止處分之登記。抵押權設定是他項權利登記。"},
{"s":"土地登記","t":"預告登記","art":"土地法 第79條之1、土地登記規則 第137條","q":"申請預告登記，須經何人同意？","o":["請求權人","登記名義人","地政機關首長","法院"],"a":1,"e":"申請預告登記，除提出土地登記規則所定文件外，應提出登記名義人同意書。預告登記用以保全土地權利移轉、消滅或內容變更的請求權；登記後未經請求權人同意之處分，對其請求權有妨礙者無效。"},
{"s":"土地登記","t":"書狀補給","art":"土地登記規則 第155條","q":"權利書狀滅失申請補給時，登記機關應公告多久？","o":["七日","十五日","三十日","六十日"],"a":2,"e":"由登記名義人敘明滅失原因，檢附切結書或其他證明文件，經登記機關公告三十日並通知登記名義人，公告期滿無人提出異議後登記補給之。"},
{"s":"土地登記","t":"登記總論","art":"土地登記規則 第2條、土地法 第37條","q":"土地登記的定義為何？","o":["土地之測量與地籍圖製作","土地及建築改良物之所有權與他項權利之登記","土地使用分區之劃定","地價之查估"],"a":1,"e":"土地登記，謂土地及建築改良物之所有權與他項權利之登記。"},
{"s":"土地登記","t":"登記總論","art":"土地登記規則 第3條","q":"關於土地登記的辦理機關，下列何者正確？","o":["一律由內政部辦理","由土地所在地之直轄市、縣（市）地政機關辦理；經中央地政機關公告實施跨域申請之登記項目，得由全國任一登記機關辦理","由戶政事務所辦理","由法院辦理"],"a":1,"e":"土地登記由土地所在地之直轄市、縣（市）地政機關辦理之。但該直轄市、縣（市）地政機關在轄區內另設或分設登記機關者，由該土地所在地之登記機關辦理；經中央地政機關公告實施跨直轄市、縣（市）申請土地登記之登記項目，得由全國任一登記機關辦理。"},
{"s":"土地登記","t":"登記總論","art":"土地登記規則 第10條","q":"土地上已有建物者，建物所有權登記的時點為何？","o":["可先於土地登記","應於土地所有權完成總登記後，始得為建物所有權登記","與土地登記無關","須於土地登記同日辦理"],"a":1,"e":"土地上已有建物者，應於土地所有權完成總登記後，始得為建物所有權登記。"},
{"s":"土地登記","t":"登記總論","art":"土地登記規則 第11條","q":"未經登記所有權之土地，可否辦理他項權利登記？","o":["可以","除法律或本規則另有規定外，不得為他項權利登記或限制登記","經地政機關核准即可","僅可辦理抵押權登記"],"a":1,"e":"未經登記所有權之土地，除法律或本規則另有規定外，不得為他項權利登記或限制登記。"},
{"s":"土地登記","t":"登記總論","art":"土地登記規則 第19條","q":"登記簿及地籍圖的保存年限為何？","o":["十五年","三十年","永久保存","五十年"],"a":2,"e":"收件簿、登記申請書及其附件，除土地所有權第一次登記案件應永久保存外，應自登記完畢之日起保存十五年；登記簿及地籍圖由登記機關永久保存之。"},
{"s":"土地登記","t":"登記總論","art":"土地登記規則 第24條之1","q":"登記謄本中，任何人均得申請的是哪一類？","o":["第一類謄本","第二類謄本（隱匿登記名義人之出生日期、部分姓名、部分統一編號等資料）","第三類謄本","須經法院許可"],"a":1,"e":"第一類顯示全部登記資料，限登記名義人或其他依法令得申請者；第二類隱匿登記名義人之出生日期、部分姓名、部分統一編號、債務人及債務額比例、設定義務人及其他依法令規定需隱匿之資料，任何人均得申請。"},
{"s":"土地登記","t":"登記總論","art":"土地法 第39條","q":"土地登記之主管機關與辦理機關，下列何者正確？","o":["由直轄市或縣（市）地政機關辦理；但各該地政機關得在轄區內分設登記機關辦理","由財政部辦理","由鄉鎮公所辦理","由法院辦理"],"a":0,"e":"土地登記，由直轄市或縣（市）地政機關辦理之。但各該地政機關得在轄區內分設登記機關，辦理登記及其他有關事項（即地政事務所）。"},
{"s":"土地登記","t":"登記總論","art":"土地登記學理","q":"我國土地登記制度採托崙斯登記制精神，下列何者「不」是其特色？","o":["登記有公信力（絕對效力）","強制登記","實質審查","任意登記、形式審查"],"a":3,"e":"托崙斯制特色包括強制登記、實質審查、登記有公信力、發給權利書狀、設有登記儲金賠償制度。任意登記與形式審查是契據登記制的特色。"},
{"s":"土地登記","t":"登記總論","art":"土地法 第48條","q":"土地總登記應依何種程序辦理？","o":["調查地籍 → 公布登記區及登記期限 → 接收文件 → 審查並公告 → 登記發給書狀並造冊","申請 → 繳費 → 登記","測量 → 拍賣 → 登記","公告 → 徵收 → 登記"],"a":0,"e":"土地總登記依下列次序辦理：調查地籍；公布登記區及登記期限；接收文件；審查並公告；登記、發給書狀並造冊。"},
{"s":"土地登記","t":"總登記程序","art":"土地法 第57條","q":"土地總登記期限內無人聲請登記之土地，或經聲請而逾限未補繳證明文件者，如何處理？","o":["由先占者取得","視為無主土地，由該管直轄市或縣（市）地政機關公告之，公告期滿無人提出異議，即為國有土地之登記","強制拍賣","由鄉鎮公所取得"],"a":1,"e":"逾登記期限無人聲請登記之土地，或經聲請而逾限未補繳證明文件者，其土地視為無主土地，由該管直轄市或縣（市）地政機關公告之，公告期滿，無人提出異議，即為國有土地之登記。依第 58 條，此公告不得少於三十日。"},
{"s":"土地登記","t":"登記效力","art":"土地法 第43條、民法 第759條之1","q":"不動產物權經登記者，在民法上的效力為何？","o":["推定登記名義人適法有此權利；因信賴登記善意取得者，其效力不因原登記物權之不實而受影響","不具任何效力","僅有對抗效力","僅對當事人有效"],"a":0,"e":"不動產物權經登記者，推定登記權利人適法有此權利。因信賴不動產登記之善意第三人，已依法律行為為物權變動之登記者，其變動之效力，不因原登記物權之不實而受影響（第 759 條之 1）。"},
{"s":"土地登記","t":"損害賠償","art":"土地法 第71條","q":"損害賠償之請求，經地政機關拒絕時，受損害人可如何處理？","o":["只能放棄","得向司法機關起訴","向監察院陳情","向地政士公會申訴"],"a":1,"e":"損害賠償之請求，如經該地政機關拒絕，受損害人得向司法機關起訴。"},
{"s":"土地登記","t":"申請人","art":"土地登記規則 第28條","q":"下列何種登記，由登記機關「逕為登記」？","o":["買賣移轉登記","建物因行政區域調整、門牌整編而辦理之變更登記","抵押權設定登記","繼承登記"],"a":1,"e":"逕為登記之情形包括：建物因行政區域調整、門牌整編而辦理之變更登記；依第 143 條第 3 項之國有登記；依第 144 條之塗銷登記；依第 153 條之住址變更登記；其他依法律得逕為登記者。"},
{"s":"土地登記","t":"申請人","art":"土地登記規則 第29條","q":"法院查封、假扣押、假處分之登記，由何者申請？","o":["債權人單獨申請","債務人申請","由法院囑託登記機關辦理","由地政士代理申請"],"a":2,"e":"政府機關遇有法定情形（如法院查封、假扣押、假處分、破產登記、徵收等）時，應囑託登記機關登記之。"},
{"s":"土地登記","t":"申請人","art":"土地登記規則 第30條、民法 第242條","q":"債務人怠於申請繼承登記時，其債權人可否代位申請？","o":["不可","債權人得依民法第 242 條代位債務人申請繼承登記","須債務人同意","須經地政機關核准"],"a":1,"e":"債務人怠於行使其權利時，債權人因保全債權，得以自己之名義行使其權利。實務上債權人為了查封拍賣，常代位債務人申辦繼承登記。"},
{"s":"土地登記","t":"申請期限","art":"土地登記規則 第33條","q":"因法院判決確定而申請登記，其一個月申請期限自何時起算？","o":["起訴之日","判決確定之日","判決書送達之日","執行完畢之日"],"a":1,"e":"申請期限之起算：法院確定判決者自判決確定之日起算；法院拍賣者自領得權利移轉證書之日起算；法院調解或和解者自調解或和解成立之日起算；繼承登記自繼承開始之日起算。"},
{"s":"土地登記","t":"申請期限","art":"土地登記規則 第33條","q":"因法院拍賣取得不動產，申請登記期限自何時起算？","o":["拍定之日","繳足價金之日","領得法院核發權利移轉證書之日","點交之日"],"a":2,"e":"經法院拍賣之土地，以領得權利移轉證書之日起算申請登記期限。"},
{"s":"土地登記","t":"申請期限","art":"土地登記規則 第50條","q":"計算逾期登記罰鍰時，不能歸責於申請人之期間如何處理？","o":["照常計算","應予扣除","加倍計算","由申請人舉證後減半"],"a":1,"e":"土地權利變更登記逾期申請，於計算登記費罰鍰時，對於不能歸責於申請人之期間，應予扣除。"},
{"s":"土地登記","t":"申請文件","art":"土地登記規則 第34條","q":"申請登記時，原則上應提出的文件「不」包括下列何者？","o":["登記申請書","登記原因證明文件","已登記者，其所有權狀或他項權利證明書","申請人的財力證明"],"a":3,"e":"申請登記應提出：登記申請書、登記原因證明文件、已登記者其所有權狀或他項權利證明書、申請人身分證明、其他由中央地政機關規定應提出之證明文件。"},
{"s":"土地登記","t":"申請文件","art":"土地登記規則 第12條","q":"下列何者「不」屬於與法院確定判決有同一效力，得作為登記原因證明文件者？","o":["法院調解筆錄","法院和解筆錄","仲裁判斷","律師函"],"a":3,"e":"與法院確定判決有同一效力者，例如法院之調解或和解筆錄、經法院核定之鄉鎮市調解、仲裁判斷等。律師函只是意思通知。"},
{"s":"土地登記","t":"親自到場","art":"土地登記規則 第40條","q":"申請登記時，原則上應親自到場核對身分的是何人？","o":["權利人","登記義務人","地政士","見證人"],"a":1,"e":"申請登記時，登記義務人應親自到場，提出國民身分證正本，當場於申請書或登記原因證明文件內簽名，並由登記機關指定人員核符後同時簽證。"},
{"s":"土地登記","t":"親自到場","art":"土地登記規則 第41條","q":"下列何種情形，申請登記時登記義務人「不必」親自到場？","o":["登記原因證明文件及同意書經依法公證、認證或由地政士簽證","義務人工作繁忙","由親友代送","以電話確認身分"],"a":0,"e":"免親自到場之情形包括：登記原因證明文件及同意書經依法公證或認證；由地政士或律師等專業人員依法簽證；檢附登記原因發生日期前一年以後核發之當事人印鑑證明；網路申請經電子憑證驗證等。"},
{"s":"土地登記","t":"申請文件","art":"土地登記規則 第43條","q":"申請共有登記時，應如何記載權利範圍？","o":["不必記載","應於申請書記明各共有人之應有部分；未記明者推定為均等","由登記機關自行判斷","由最年長者決定"],"a":1,"e":"申請登記，權利人為二人以上時，應於申請書內記明應有部分或相互之權利關係。應有部分應以分數表示之。民法第 817 條並規定，各共有人之應有部分不明者，推定其為均等。"},
{"s":"土地登記","t":"申請文件","art":"土地登記規則 第44條","q":"申請登記須第三人同意者，應如何證明？","o":["口頭表示即可","應檢附第三人同意書或由第三人在登記申請書內註明同意事由","由申請人切結","不必證明"],"a":1,"e":"申請登記須第三人同意者，應檢附第三人同意書或由第三人在登記申請書內註明同意事由。"},
{"s":"土地登記","t":"審查","art":"土地登記規則 第55條","q":"我國登記機關審查登記申請，採何種審查主義？","o":["形式審查主義","實質審查主義","書面審查即可，不審查原因","僅審查規費"],"a":1,"e":"登記機關接收申請登記案件後，應即依法審查。我國採實質審查主義，除審查程序外，亦審查登記原因之真實性與合法性，以確保登記之公信力。"},
{"s":"土地登記","t":"補正與駁回","art":"土地登記規則 第56條","q":"下列何者屬於應「補正」而非駁回的情形？","o":["不屬受理登記機關管轄","依法不應登記","登記之權利人、義務人間有爭執","申請書記載事項或關於登記原因之事項，與登記簿或其證明文件不符，而未能證明其不符之原因"],"a":3,"e":"申請人資格不符或代理人代理權有欠缺、登記申請書不合程式或應提出文件不全、申請書記載事項與登記簿或證明文件不符、未依規定繳納登記規費者，應以書面敘明理由通知補正。"},
{"s":"土地登記","t":"補正與駁回","art":"土地登記規則 第57條","q":"下列何者「不」屬於登記機關應「駁回」的情形？","o":["不屬受理登記機關管轄","依法不應登記","逾期未補正","登記規費未繳納"],"a":3,"e":"駁回事由：不屬受理登記機關管轄；依法不應登記；登記之權利人、義務人或其與申請登記之法律關係有關之權利關係人間有爭執；逾期未補正或未照補正事項完全補正。未繳規費是補正事由。"},
{"s":"土地登記","t":"補正與駁回","art":"土地登記規則 第57條第3項","q":"因權利關係人間有爭執而被駁回者，申請人可如何處理？","o":["重新申請即可","得訴請司法機關裁判或以訴訟外紛爭解決機制處理","向內政部訴願","不能救濟"],"a":1,"e":"依第 57 條第 1 項第 3 款駁回者，申請人並得訴請司法機關裁判或以訴訟外紛爭解決機制處理。"},
{"s":"土地登記","t":"書狀","art":"土地登記規則 第67條","q":"法院拍賣或判決後，原權利人未能提出權利書狀時，登記機關如何處理？","o":["不予登記","登記完畢後公告註銷原書狀","由買受人重新申請補給","命原權利人賠償"],"a":1,"e":"因法院拍賣、判決、徵收或其他依法得免提出書狀之情形而未能提出權利書狀者，應於登記完畢後公告註銷。"},
{"s":"土地登記","t":"書狀","art":"土地法 第62條","q":"土地總登記完畢後，地政機關應發給何種文件？","o":["地價證明","土地所有權狀或他項權利證明書","登記通知書","繳款書"],"a":1,"e":"聲請登記之土地權利公告期滿無異議，或經調處成立或裁判確定者，應即為確定登記，發給權利人以土地所有權狀或他項權利證明書。"},
{"s":"土地登記","t":"建物登記","art":"土地登記規則 第78條","q":"申請建物所有權第一次登記前，原則上應先辦理何事？","o":["土地分割","向登記機關申請建物第一次測量","申報房屋稅","申請使用執照"],"a":1,"e":"申請建物所有權第一次登記前，應先向登記機關申請建物第一次測量。但在中華民國 102 年 10 月 1 日以後領有使用執照之建物，檢附依使用執照竣工平面圖繪製及簽證之建物標示圖辦理登記者，不在此限。"},
{"s":"土地登記","t":"建物登記","art":"土地登記規則 第79條","q":"申請建物所有權第一次登記，主要應檢附何種文件？","o":["建築執照","使用執照（或依法得以其他文件代替）","雜項執照","房屋稅單即可"],"a":1,"e":"申請建物所有權第一次登記，應提出使用執照或依法得以其他文件代替之證明文件，及建物測量成果圖或建物標示圖。"},
{"s":"土地登記","t":"建物登記","art":"土地登記規則 第81條","q":"區分所有建物之共有部分，如何辦理登記？","o":["由任一區分所有權人單獨登記","依區分所有權人約定，另編建號，單獨登記為各相關區分所有權人共有，並於各專有部分之所有權狀記明，不另發給所有權狀","不必登記","登記為管委會所有"],"a":1,"e":"區分所有建物所屬共有部分，除法規另有規定外，依區分所有權人按其設置目的及使用性質之約定情形，分別合併，另編建號，單獨登記為各相關區分所有權人共有。共有部分不另發給所有權狀，於各專有部分權狀附表記明。"},
{"s":"土地登記","t":"建物登記","art":"土地登記規則 第84條","q":"建物所有權第一次登記的公告期間為何？","o":["七日","準用土地總登記程序，公告十五日","三十日","不必公告"],"a":1,"e":"建物所有權第一次登記，除本節規定者外，準用土地總登記程序，公告期間為十五日。"},
{"s":"土地登記","t":"標示變更","art":"地籍測量實施規則 第224條","q":"土地合併的要件為何？","o":["同一所有權人即可","限於同一地段、地界相連、使用性質相同之土地","同一縣市即可","須經法院許可"],"a":1,"e":"土地合併，應以同一地段、地界相連、使用性質相同之土地為限。所有權人不同或設定有他項權利者，應依規定取得同意或協議。"},
{"s":"土地登記","t":"共有物分割","art":"土地登記規則 第100條","q":"依法院確定判決申請共有物分割登記，可否由部分共有人申請？","o":["須全體共有人會同","部分共有人得提出法院確定判決書及其他應附書件，單獨為全體共有人申請分割登記","須原告全體申請","須經被告同意"],"a":1,"e":"依據法院判決申請共有物分割登記者，部分共有人得提出法院確定判決書及其他應附書件，單獨為全體共有人申請分割登記，登記機關於登記完畢後，應通知他共有人。"},
{"s":"土地登記","t":"共有物分割","art":"土地登記規則 第107條、民法 第824條之1","q":"分別共有土地，部分共有人就其應有部分設定抵押權，共有物分割登記時，該抵押權原則上如何處理？","o":["當然消滅","按原應有部分轉載於分割後各宗土地之上","一律移存於抵押人分得之土地","由抵押權人選擇一宗土地"],"a":1,"e":"原則按原應有部分轉載於分割後各宗土地（抵押權不因分割而受影響）。例外：抵押權人同意分割、已參加共有物分割訴訟、或經共有人告知訴訟而未參加者，抵押權僅轉載（移存）於原設定人分割後取得之土地上。"},
{"s":"土地登記","t":"時效取得","art":"土地登記規則 第118條","q":"申請時效取得地上權登記，登記機關應如何辦理？","o":["逕為登記","應公告三十日，並同時通知土地所有權人","公告十五日","須法院判決"],"a":1,"e":"土地總登記後，因主張時效完成申請地上權登記時，登記機關應於登記完畢前公告三十日，並同時通知土地所有權人；土地所有權人在公告期間內提出異議者，依土地法第 59 條調處。"},
{"s":"土地登記","t":"繼承登記","art":"土地登記規則 第119條","q":"申請繼承登記，下列何者「不」是應提出的文件？","o":["載有被繼承人死亡記事之戶籍謄本","繼承人現在戶籍謄本","繼承系統表","被繼承人生前財力證明"],"a":3,"e":"應提出：載有被繼承人死亡記事之戶籍謄本、繼承人現在戶籍謄本、繼承系統表、遺產稅繳（免）納證明書或其他有關證明文件、繼承人如有拋棄繼承應附法院准予備查之證明文件等。"},
{"s":"土地登記","t":"繼承登記","art":"土地登記規則 第119條","q":"繼承系統表由何人訂定？","o":["戶政事務所","申請人依民法有關規定自行訂定，註明如有遺漏或錯誤致他人受損害者，申請人願負法律責任，並簽名","法院","地政事務所"],"a":1,"e":"繼承系統表由申請人依民法有關規定自行訂定，註明如有遺漏或錯誤致他人受損害者，申請人願負法律責任，並簽名。"},
{"s":"土地登記","t":"繼承登記","art":"土地登記規則 第122條","q":"繼承開始時繼承人有無不明，經法院選任遺產管理人者，土地應如何登記？","o":["登記為國有","由遺產管理人申請遺產管理人登記","不必登記","由法院登記為法院所有"],"a":1,"e":"遺產管理人就其所管理之土地申請遺產管理人登記時，除法律另有規定外，應提出親屬會議選定或經法院選任之證明文件。"},
{"s":"土地登記","t":"繼承登記","art":"土地登記規則 第123條","q":"受遺贈人申辦遺贈土地之所有權移轉登記，程序為何？","o":["受遺贈人單獨申請","應由繼承人先辦繼承登記後，由繼承人會同受遺贈人申請；有遺囑執行人時，由遺囑執行人辦畢遺囑執行人及繼承登記後會同受遺贈人申請","由法院囑託","由地政機關逕為登記"],"a":1,"e":"受遺贈人申辦遺贈之土地所有權移轉登記，應由繼承人先辦繼承登記後，由繼承人會同受遺贈人申請之；如遺囑另指定有遺囑執行人時，應於辦畢遺囑執行人及繼承登記後，由遺囑執行人會同受遺贈人申請之。"},
{"s":"土地登記","t":"未辦繼承登記","art":"土地法 第73條之1","q":"土地或建物自繼承開始之日起逾一年未辦理繼承登記，地政機關的處理程序為何？","o":["逕行標售","經查明後，應即公告繼承人於三個月內聲請登記；逾期仍未聲請者，得由地政機關予以列冊管理","直接登記為國有","處以罰鍰後代辦"],"a":1,"e":"繼承開始之日起逾一年未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於三個月內聲請登記，並以書面通知繼承人；逾期仍未聲請者，得由地政機關予以列冊管理（十五年）。"},
{"s":"土地登記","t":"信託登記","art":"土地登記規則 第126條","q":"遺囑信託的土地權利，應如何申請信託登記？","o":["受託人單獨申請","應於辦畢繼承登記後，由繼承人會同受託人申請；遺囑另指定遺囑執行人時，由遺囑執行人會同受託人申請","受益人單獨申請","法院囑託"],"a":1,"e":"土地權利因遺囑成立信託關係而移轉予受託人時，應由受託人會同繼承人或遺囑執行人申請信託登記（須先辦畢繼承或遺囑執行人登記）。"},
{"s":"土地登記","t":"信託登記","art":"土地登記規則 第127條","q":"信託關係消滅，受託人將信託財產移轉予委託人時，應辦理何種登記？","o":["信託歸屬登記","塗銷信託登記","買賣移轉登記","贈與移轉登記"],"a":1,"e":"受託人依信託法第 9 條第 2 項取得土地權利，或信託關係消滅而信託財產回復登記為委託人所有者，應由權利人會同義務人申請塗銷信託或信託取得登記。"},
{"s":"土地登記","t":"信託登記","art":"土地登記規則 第128條","q":"信託關係消滅，信託財產移轉予委託人以外之歸屬權利人時，應辦理何種登記？","o":["塗銷信託登記","信託歸屬登記","繼承登記","買賣登記"],"a":1,"e":"信託財產因信託關係消滅而移轉予委託人以外之歸屬權利人時，應由權利人會同義務人申請信託歸屬登記。"},
{"s":"土地登記","t":"信託登記","art":"土地登記規則 第130條","q":"信託登記於登記簿上如何表彰？","o":["不必記載","於所有權部或他項權利部登記次序欄註記「信託財產」，並於其他登記事項欄記明委託人姓名或名稱，信託內容詳信託專簿","另設信託登記簿","僅於書狀記載"],"a":1,"e":"信託登記，除應於登記簿所有權部或他項權利部登記外，並於其他登記事項欄記明信託財產、委託人姓名或名稱，信託內容詳信託專簿。"},
{"s":"土地登記","t":"信託登記","art":"土地登記規則 第132條","q":"信託登記之信託契約等文件如何處理？","o":["退還申請人","由登記機關將信託契約或信託遺囑複印裝訂成信託專簿，提供閱覽或申請複印","銷毀","送法院保存"],"a":1,"e":"土地權利經登記機關辦理信託登記後，應就其信託契約或遺囑複印裝訂成信託專簿，提供閱覽或申請複印，其提供資料內容及申請人資格、閱覽費或複印工本費之收取，準用第 24 條之 1 及土地法第 79 條之 2 規定。"},
{"s":"土地登記","t":"限制登記","art":"土地登記規則 第141條","q":"土地經法院囑託辦理查封登記後，未為塗銷前，下列何種登記仍可辦理？","o":["買賣移轉登記","贈與移轉登記","因徵收、區段徵收或照價收買之登記","抵押權設定登記"],"a":2,"e":"土地經法院囑託辦理查封、假扣押、假處分或破產登記後，未為塗銷前，登記機關應停止與其權利有關之新登記。但徵收、區段徵收或照價收買；依法院確定判決申請移轉、設定或塗銷登記之權利人為原假處分登記之債權人；公同共有繼承；其他無礙禁止處分之登記，不在此限。"},
{"s":"土地登記","t":"預告登記","art":"土地法 第79條之1第3項","q":"預告登記「不能」對抗下列何者？","o":["土地所有權人自行出售","因徵收、法院判決或強制執行而為新登記","設定地上權","贈與他人"],"a":1,"e":"預告登記，對於因徵收、法院判決或強制執行而為新登記，無排除之效力。"},
{"s":"土地登記","t":"預告登記","art":"土地登記規則 第146條","q":"預告登記之塗銷，應如何申請？","o":["登記名義人單獨申請","應提出原預告登記請求權人之同意書","由地政機關逕為塗銷","須法院判決"],"a":1,"e":"預告登記之塗銷，應提出原預告登記請求權人之同意書。前項請求權人除符合第 41 條免親自到場者外，應親自到場並依第 40 條規定程序辦理。"},
{"s":"土地登記","t":"塗銷登記","art":"土地登記規則 第145條","q":"他項權利塗銷登記，下列何人「不」得單獨申請？","o":["他項權利人","原設定人（提出他項權利人同意書或清償證明等文件）","其他利害關係人（提出規定文件）","與該權利無關之第三人"],"a":3,"e":"他項權利塗銷登記除權利終止外，得由他項權利人、原設定人或其他利害關係人提出規定文件，單獨申請之。"},
{"s":"土地登記","t":"塗銷登記","art":"土地登記規則 第144條","q":"登記證明文件經主管機關認定係屬偽造，登記機關可如何處理？","o":["只能等法院判決","於第三人取得該土地權利之新登記前，報經直轄市或縣（市）地政機關查明核准後塗銷","逕行塗銷不必報核","不予處理"],"a":1,"e":"有登記證明文件經該主管機關認定係屬偽造，或純屬登記機關之疏失而錯誤之登記之情形，於第三人取得該土地權利之新登記前，登記機關得於報經直轄市或縣（市）地政機關查明核准後塗銷之。"},
{"s":"土地登記","t":"更正登記","art":"土地登記規則 第13條","q":"土地法第 69 條所稱「登記錯誤」，指何種情形？","o":["登記事項與登記原因證明文件所載之內容不符","當事人事後反悔","登記後地價上漲","書狀遺失"],"a":0,"e":"所稱登記錯誤，係指登記事項與登記原因證明文件所載之內容不符者；所稱遺漏，係指應登記事項而漏未登記者。更正登記並以不妨害原登記之同一性為限。"},
{"s":"土地登記","t":"更正登記","art":"土地法 第69條但書","q":"登記錯誤純屬登記人員記載時之疏忽，並有原始登記原因證明文件可稽者，如何更正？","o":["須經上級機關核准","由登記機關逕行更正","須法院判決","由當事人會同申請"],"a":1,"e":"登記錯誤或遺漏，純屬登記人員記載時之疏忽，並有原始登記原因證明文件可稽者，由登記機關逕行更正之，不必報經上級機關核准。"},
{"s":"土地登記","t":"更名與住址","art":"土地登記規則 第149條","q":"土地權利登記後，權利人之姓名或名稱有變更者，應辦理何種登記？","o":["更正登記","更名登記","移轉登記","塗銷登記"],"a":1,"e":"土地權利登記後，權利人之姓名或名稱有變更者，應申請更名登記。更名登記依土地法第 78 條免納登記費。"},
{"s":"土地登記","t":"更名與住址","art":"土地登記規則 第153條","q":"登記名義人之住址變更，未申請住址變更登記者，登記機關可如何處理？","o":["處以罰鍰","於其申請其他權利變更登記時，得檢附戶籍證明文件一併辦理；或依戶政機關提供資料逕為辦理住址變更登記","不得辦理","撤銷原登記"],"a":1,"e":"登記名義人之住址變更，未申請登記者，登記機關得查明其現在住址，逕為住址變更登記。"},
{"s":"土地登記","t":"登記規費","art":"土地法 第65條、第76條","q":"抵押權設定登記之登記費如何計算？","o":["按申報地價千分之二","按權利價值千分之一","按擔保債權總額千分之五","固定新臺幣一千元"],"a":1,"e":"他項權利設定屬權利變更登記，依權利價值千分之一計收登記費。抵押權以擔保債權總金額為權利價值。"},
{"s":"土地登記","t":"登記規費","art":"土地法 第65條","q":"建物所有權第一次登記的登記費率為何？","o":["千分之一","千分之二","千分之五","免費"],"a":1,"e":"建物所有權第一次登記準用土地總登記規定，按建物價值千分之二計收登記費。"},
{"s":"土地登記","t":"登記規費","art":"土地法 第67條、土地登記規費及其罰鍰計收補充規定","q":"權利書狀費每張多少元？","o":["新臺幣二十元","新臺幣八十元","新臺幣二百元","新臺幣五百元"],"a":1,"e":"權利書狀費每張新臺幣八十元；登記謄本人工影印每張二十元。"},
{"s":"土地登記","t":"地籍測量","art":"土地法 第46條之1、第46條之2","q":"地籍圖重測時，土地所有權人未於通知期限內到場指界，如何處理？","o":["停止重測","得參照舊地籍圖及其他可靠資料，逕行施測","處以罰鍰","由鄰地所有權人指界"],"a":1,"e":"重新實施地籍測量時，土地所有權人應於地政機關通知之限期內，自行設立界標，並到場指界。逾期不設立界標或到場指界者，得依鄰地界址、現使用人之指界、參照舊地籍圖、地方習慣等方法逕行施測。"},
{"s":"土地登記","t":"地籍測量","art":"土地法 第46條之3","q":"地籍圖重測結果的公告期間為何？","o":["七日","十五日","三十日","六十日"],"a":2,"e":"重新實施地籍測量之結果，應予公告，其期間為三十日。土地所有權人認為有錯誤者，應於公告期間內申請複丈；未於公告期間內申請複丈者，重測結果即告確定。"},
{"s":"土地登記","t":"地籍測量","art":"土地法 第46條之3","q":"重測結果公告期間內，土地所有權人認為有錯誤者，應如何處理？","o":["向法院起訴","於公告期間內，以書面向地政機關繳納複丈費申請複丈","向行政院訴願","申請撤銷重測"],"a":1,"e":"土地所有權人認為重測結果有錯誤，除有民法第 796 條但書等情形外，應於公告期間內，以書面向該管地政機關繳納複丈費，聲請複丈。經複丈者，不得再聲請複丈。"},
{"s":"土地登記","t":"他項權利登記","art":"土地登記規則 第26條","q":"抵押權設定登記，權利人與義務人分別為何？","o":["權利人為債務人，義務人為債權人","權利人為抵押權人，義務人為抵押物所有人（設定人）","兩者均為債權人","權利人為地政機關"],"a":1,"e":"抵押權設定登記之權利人為抵押權人，義務人為設定抵押之所有權人（可能為債務人本人或第三人提供擔保）。"},
{"s":"土地登記","t":"他項權利登記","art":"土地登記規則 第115條之1","q":"申請最高限額抵押權設定登記，應記明的事項不包括下列何者？","o":["擔保債權之範圍（一定範圍內之不特定債權）","最高限額","擔保債權確定期日（如有約定）","債務人之年收入"],"a":3,"e":"最高限額抵押權應於申請書記明擔保債權之範圍、最高限額；有約定者並記明原債權確定期日、清償日期、利息、遲延利息、違約金等。"},
{"s":"土地登記","t":"他項權利登記","art":"土地登記規則 第108條","q":"申請地上權、農育權或不動產役權設定登記，如設定範圍為土地之一部分時，應如何辦理？","o":["不得設定","應檢附位置圖（經登記機關測繪之他項權利位置圖）","由當事人自行描述即可","須將土地分割"],"a":1,"e":"就土地之一部分申請設定地上權、農育權、不動產役權或典權者，應提出位置圖（他項權利位置圖），以特定其範圍。"},
{"s":"土地登記","t":"申請人","art":"土地登記規則 第27條","q":"下列何者屬於可單獨申請的登記？","o":["抵押權設定","因土地重劃之登記","買賣移轉","地上權設定"],"a":1,"e":"單獨申請的情形包括土地總登記、建物所有權第一次登記、繼承登記、法院判決確定或拍定之登記、標示變更、更名或住址變更、消滅登記、預告登記及其塗銷、法定地上權登記、共有物分割判決之登記、土地重劃之登記等。抵押權、地上權設定與買賣均屬雙方行為，須會同申請。"},
{"s":"土地登記","t":"申請人","art":"土地登記規則 第27條、民法 第923條","q":"典期屆滿後二年出典人不回贖，典權人取得典物所有權之登記，如何申請？","o":["須出典人會同","典權人得單獨申請","須法院判決","由地政機關逕為登記"],"a":1,"e":"依民法第 913 條第 2 項、第 923 條第 2 項或第 924 條但書規定典權人取得典物所有權之登記，得由權利人單獨申請。"},
{"s":"土地登記","t":"申請人","art":"土地登記規則 第27條、民法 第513條","q":"承攬人依民法第 513 條請求設定的法定抵押權登記，如何申請？","o":["須定作人會同","承攬人得單獨申請","由法院囑託","不能登記"],"a":1,"e":"依民法第 513 條規定抵押權之登記，得由承攬人單獨申請（可於開始工作前預為抵押權登記）。"},
{"s":"土地登記","t":"申請人","art":"土地登記規則 第26條","q":"買賣所有權移轉登記，應由何人申請？","o":["買方單獨申請","賣方單獨申請","買方（權利人）與賣方（義務人）會同申請","地政士單獨申請"],"a":2,"e":"買賣屬雙方法律行為，應由權利人（買受人）及義務人（出賣人）會同申請。實務上多委由地政士代理。"},
{"s":"土地登記","t":"申請期限","art":"土地登記規則 第33條、第50條","q":"繼承登記的申請期限自何時起算？","o":["繼承開始之日（被繼承人死亡之日）","遺產稅繳清之日","繼承人知悉繼承之日","遺產分割協議成立之日"],"a":0,"e":"繼承登記得自繼承開始之日起六個月內申請。計算逾期罰鍰時，不能歸責於申請人之期間（如遺產稅核課期間）應予扣除。"},
{"s":"土地登記","t":"登記總論","art":"土地法 第72條","q":"土地總登記後，土地權利有移轉、分割、合併、設定、增減或消滅時，應如何處理？","o":["不必登記","應為變更登記","只需通知稅捐機關","僅需更新書狀"],"a":1,"e":"土地總登記後，土地權利有移轉、分割、合併、設定、增減或消滅時，應為變更登記。"},
{"s":"土地登記","t":"登記總論","art":"土地登記規則 第9條","q":"同一土地有多數他項權利登記時，其權利次序如何決定？","o":["依權利金額大小","依登記之先後","依申請人年齡","由權利人協議"],"a":1,"e":"同一土地為他項權利登記時，其權利次序，除法律另有規定外，應依登記之先後。但於土地總登記期限內申請登記者，依其原設定之先後。"},
{"s":"土地登記","t":"書狀","art":"土地登記規則 第155條","q":"申請權利書狀補給，應由何人申請？","o":["任何利害關係人","登記名義人敘明滅失原因，檢附切結書或其他證明文件","地政士單獨申請","債權人"],"a":1,"e":"申請土地所有權狀或他項權利證明書補給時，應由登記名義人敘明其滅失之原因，檢附切結書或其他有關證明文件，經登記機關公告三十日，並通知登記名義人，公告期滿無人提出異議後，登記補給之。"},
{"s":"土地登記","t":"繼承登記","art":"土地登記規則 第120條","q":"繼承人為二人以上，部分繼承人申請公同共有登記時，其他繼承人應如何處理？","o":["喪失繼承權","登記機關於登記完畢後應通知他繼承人","須補繳罰鍰","須另行起訴"],"a":1,"e":"繼承人為二人以上，部分繼承人因故不能會同其他繼承人共同申請繼承登記時，得由其中一人或數人為全體繼承人之利益，就被繼承人之土地申請為公同共有之登記。登記機關於登記完畢後，應將登記結果通知他繼承人。"},
{"s":"土地登記","t":"登記總論","art":"土地登記規則 第4條","q":"民國 99 年 8 月 3 日以後，可否新設定永佃權？","o":["可以","不可，民法物權編修正刪除永佃權，僅該日前發生之永佃權仍得登記","僅限公有土地","經法院許可即可"],"a":1,"e":"民法物權編修正刪除永佃權，新增農育權；土地登記規則第 4 條僅保留「民國 99 年 8 月 3 日前發生之永佃權」為應登記之權利。"},
{"s":"土地登記","t":"總登記程序","art":"土地法 第54條","q":"和平繼續占有之土地，依民法第 769 條或第 770 條得請求登記為所有人者，在土地總登記時可如何處理？","o":["只能另行起訴","應於登記期限內，經土地四鄰證明，聲請為土地所有權之登記","由地政機關逕為登記","須先繳納地價"],"a":1,"e":"和平繼續占有之土地，依民法規定得請求登記為所有人者，應於登記期限內，經土地四鄰證明，聲請為土地所有權之登記。"},
{"s":"土地登記","t":"繼承登記","art":"土地登記規則 第119條","q":"繼承人中有人拋棄繼承，申請繼承登記時應附何種文件？","o":["拋棄者的切結書","法院准予備查之證明文件","戶政事務所證明","其他繼承人的同意書"],"a":1,"e":"繼承人如有拋棄繼承，應依民法第 1174 條以書面向法院為之，申請繼承登記時應檢附法院准予備查之證明文件。"},
{"s":"民法與信託法","t":"物權變動","art":"民法 第758條","q":"不動產物權依法律行為而取得、設定、喪失及變更者，其生效要件為何？","o":["當事人合意即生效力","訂立書面即生效力","應以書面為之，且非經登記不生效力","交付即生效力"],"a":2,"e":"第 758 條：非經登記不生效力（登記生效要件主義），且前項行為應以書面為之。"},
{"s":"民法與信託法","t":"物權變動","art":"民法 第759條","q":"因繼承取得不動產物權，下列敘述何者正確？","o":["非經登記不生效力","於繼承開始時即取得，但非經登記不得處分","須經法院認可才能取得","須繳清遺產稅後才能取得"],"a":1,"e":"因繼承、強制執行、徵收、法院判決或其他非因法律行為，於登記前已取得不動產物權者，應經登記，始得處分其物權。"},
{"s":"民法與信託法","t":"取得時效","art":"民法 第769條、第770條","q":"以所有之意思占有他人未登記之不動產，請求登記為所有人的時效期間為何？","o":["一般 10 年；占有之始善意無過失 5 年","一般 20 年；占有之始善意無過失 10 年","一般 15 年；占有之始善意無過失 10 年","一般 30 年；占有之始善意無過失 15 年"],"a":1,"e":"和平、公然、繼續占有他人未登記之不動產 20 年者，得請求登記為所有人（第 769 條）；占有之始為善意並無過失者為 10 年（第 770 條）。動產則為 10 年／5 年。"},
{"s":"民法與信託法","t":"共有","art":"民法 第820條","q":"共有物的管理，除契約另有約定外，依何種方式決定？","o":["共有人全體同意","共有人過半數及其應有部分合計過半數之同意；或應有部分合計逾三分之二者，人數不予計算","應有部分最多者決定","共有人過半數同意"],"a":1,"e":"與土地法第 34 條之 1 的處分門檻相同。管理決定顯失公平者，不同意之共有人得聲請法院變更；共有人依多數決致他共有人受損害者，應負連帶賠償責任。"},
{"s":"民法與信託法","t":"共有","art":"民法 第823條","q":"共有人約定不分割共有物之期限，上限為何？","o":["一律不得逾五年","原則不得逾五年；共有不動產訂有管理約定者，不得逾三十年","原則不得逾十年；不動產不得逾二十年","無期限限制"],"a":1,"e":"約定不分割期限不得逾五年，逾五年者縮短為五年；但共有之不動產，其契約訂有管理之約定時，不得逾三十年，逾者縮短為三十年。"},
{"s":"民法與信託法","t":"地上權","art":"民法 第836條","q":"地上權人積欠地租達多少時，土地所有權人得定期催告後終止地上權？","o":["六個月","一年","二年","三年"],"a":2,"e":"地上權人積欠地租達二年之總額，除另有習慣外，土地所有權人得定相當期限催告地上權人支付，逾期仍不支付時，得終止地上權。"},
{"s":"民法與信託法","t":"法定地上權","art":"民法 第838條之1","q":"土地及其上建築物原屬同一人，因強制執行拍賣致分屬不同人時，其法律效果為何？","o":["建築物應拆除","視為已有地上權之設定","成立租賃關係","土地所有人得優先承買建築物"],"a":1,"e":"視為已有地上權之設定，其地租、期間及範圍由當事人協議定之；不能協議者，得請求法院以判決定之。"},
{"s":"民法與信託法","t":"農育權","art":"民法 第850條之1","q":"農育權的期限上限為何？","o":["十年","二十年","三十年","無上限"],"a":1,"e":"農育權之期限不得逾二十年，逾二十年者縮短為二十年；但以造林、保育為目的或法令另有規定者，不在此限。"},
{"s":"民法與信託法","t":"抵押權","art":"民法 第873條之1","q":"約定債權已屆清償期而未清償時，抵押物所有權移屬抵押權人（流抵約定），其效力為何？","o":["絕對無效","有效，但非經登記不得對抗第三人","須經法院許可才生效","僅於最高限額抵押有效"],"a":1,"e":"流抵約定有效，但非經登記不得對抗第三人。抵押權人請求移轉所有權時，抵押物價值超過擔保債權部分應返還，不足部分仍得請求清償。"},
{"s":"民法與信託法","t":"抵押權","art":"民法 第880條","q":"以抵押權擔保之債權，其請求權已因時效消滅，抵押權人於何時以內不實行抵押權，其抵押權即消滅？","o":["時效完成後一年","時效完成後二年","時效完成後五年","時效完成後十五年"],"a":2,"e":"抵押權人於消滅時效完成後，五年間不實行其抵押權者，其抵押權消滅。"},
{"s":"民法與信託法","t":"典權","art":"民法 第912條、第913條","q":"關於典權期限，下列何者正確？","o":["不得逾二十年；不滿十年者不得附絕賣條款","不得逾三十年；不滿十五年者不得附到期不贖即作絕賣之條款","不得逾五十年；不滿二十年者不得附絕賣條款","無期限限制"],"a":1,"e":"典權約定期限不得逾三十年，逾三十年者縮短為三十年（第 912 條）。期限不滿十五年者，不得附有到期不贖即作絕賣之條款（第 913 條）。"},
{"s":"民法與信託法","t":"典權","art":"民法 第923條","q":"典權定有期限者，出典人於典期屆滿後多久內不以原典價回贖，典權人即取得典物所有權？","o":["六個月","一年","二年","五年"],"a":2,"e":"典期屆滿後，經過二年不以原典價回贖者，典權人即取得典物所有權。未定期限者，出典人得隨時回贖，但自出典後經過三十年不回贖者，典權人取得所有權（第 924 條）。"},
{"s":"民法與信託法","t":"租賃","art":"民法 第425條","q":"「買賣不破租賃」不適用於下列哪一種不動產租賃契約？","o":["已公證、期限三年","未經公證、期限逾五年或未定期限","已公證、未定期限","未經公證、期限二年"],"a":1,"e":"出租人於租賃物交付後、承租人占有中讓與所有權，租賃契約對受讓人繼續存在；但未經公證之不動產租賃契約，其期限逾五年或未定期限者，不適用之。"},
{"s":"民法與信託法","t":"租賃","art":"民法 第449條","q":"租賃契約之期限上限為何？","o":["十年","二十年","三十年","五十年"],"a":1,"e":"租賃契約之期限不得逾二十年，逾二十年者縮短為二十年；但租用基地建築房屋者不適用之。"},
{"s":"民法與信託法","t":"法定繼承","art":"民法 第1138條","q":"配偶以外的法定繼承人，其順序為何？","o":["父母、直系血親卑親屬、兄弟姊妹、祖父母","直系血親卑親屬、父母、兄弟姊妹、祖父母","直系血親卑親屬、兄弟姊妹、父母、祖父母","直系血親卑親屬、父母、祖父母、兄弟姊妹"],"a":1,"e":"順序：①直系血親卑親屬（以親等近者為先）②父母③兄弟姊妹④祖父母。配偶有相互繼承遺產之權，與各順序共同繼承。"},
{"s":"民法與信託法","t":"法定繼承","art":"民法 第1144條","q":"配偶與被繼承人的兄弟姊妹共同繼承時，配偶的應繼分為何？","o":["與兄弟姊妹平均","二分之一","三分之二","全部"],"a":1,"e":"與第一順序同為繼承時，與其他繼承人平均；與第二或第三順序同為繼承時為二分之一；與第四順序同為繼承時為三分之二；無各順序繼承人時為遺產全部。"},
{"s":"民法與信託法","t":"拋棄繼承","art":"民法 第1174條","q":"繼承人拋棄繼承，應於何時以何種方式為之？","o":["繼承開始時起二個月內，向戶政機關申報","知悉其得繼承之時起三個月內，以書面向法院為之","繼承開始時起六個月內，向國稅局申報","知悉其得繼承之時起一年內，以書面通知其他繼承人"],"a":1,"e":"應於知悉其得繼承之時起三個月內，以書面向法院為之；並以書面通知因其拋棄而應為繼承之人（不能通知者不在此限）。"},
{"s":"民法與信託法","t":"特留分","art":"民法 第1223條","q":"下列特留分比例，何者正確？","o":["配偶為應繼分三分之一","父母為應繼分三分之一","兄弟姊妹為應繼分三分之一","直系血親卑親屬為應繼分三分之一"],"a":2,"e":"直系血親卑親屬、父母、配偶：應繼分二分之一；兄弟姊妹、祖父母：應繼分三分之一。"},
{"s":"民法與信託法","t":"遺囑","art":"民法 第1186條、第1189條","q":"關於遺囑，下列何者正確？","o":["未滿十八歲不得為遺囑","遺囑方式有自書、公證、密封、代筆、口授五種","限制行為能力人為遺囑須經法定代理人允許","遺囑僅限公證遺囑有效"],"a":1,"e":"遺囑方式五種：自書、公證、密封、代筆、口授（第 1189 條）。無行為能力人不得為遺囑；限制行為能力人無須經法定代理人允許即得為遺囑，但未滿十六歲者不得為遺囑（第 1186 條）。"},
{"s":"民法與信託法","t":"信託效力","art":"信託法 第4條","q":"以應登記之財產權（如土地）為信託者，非經信託登記，效果為何？","o":["信託無效","不得對抗第三人","信託不成立","可由受益人撤銷"],"a":1,"e":"以應登記或註冊之財產權為信託者，非經信託登記，不得對抗第三人（登記對抗主義，非生效要件）。"},
{"s":"民法與信託法","t":"信託效力","art":"信託法 第5條","q":"下列何者「不」屬於信託行為無效的情形？","o":["其目的違反強制或禁止規定","以進行訴願或訴訟為主要目的","以依法不得受讓特定財產權之人為該財產權之受益人","委託人與受益人為同一人"],"a":3,"e":"無效情形：目的違反強制或禁止規定；違反公共秩序或善良風俗；以進行訴願或訴訟為主要目的；以依法不得受讓特定財產權之人為該財產權之受益人。委託人即受益人是合法的自益信託。"},
{"s":"民法與信託法","t":"信託效力","art":"信託法 第6條","q":"債權人撤銷詐害信託的撤銷權，何時消滅？","o":["知有撤銷原因時起六個月或信託成立後五年","知有撤銷原因時起一年或自行為時起十年","知有撤銷原因時起二年或信託成立後十五年","不因時間經過而消滅"],"a":1,"e":"信託行為有害於委託人之債權人權利者，債權人得聲請法院撤銷之。撤銷權自債權人知有撤銷原因時起一年間不行使，或自行為時起逾十年者消滅。"},
{"s":"民法與信託法","t":"信託財產","art":"信託法 第12條","q":"對信託財產原則上不得強制執行，下列何者「不」屬於例外？","o":["基於信託前存在於該財產之權利","因處理信託事務所生之權利","其他法律另有規定者","委託人的一般債權人基於信託後發生的債權"],"a":3,"e":"例外三種：信託前存在於該財產之權利、因處理信託事務所生之權利、其他法律另有規定。這是信託財產獨立性的核心考點。"},
{"s":"民法與信託法","t":"受託人","art":"信託法 第21條","q":"下列何者「可以」擔任受託人？","o":["未成年人","受監護宣告之人","破產人","受輔助宣告後經撤銷之成年人"],"a":3,"e":"未成年人、受監護或輔助宣告之人及破產人，不得為受託人。輔助宣告已撤銷者即無此限制。"},
{"s":"民法與信託法","t":"受託人","art":"信託法 第22條、第34條","q":"關於受託人的義務，下列何者正確？","o":["負與處理自己事務同一之注意義務","應以善良管理人之注意處理信託事務；除與他人為共同受益人外，不得以任何名義享有信託利益","可自由將信託財產轉為自有財產","可享有全部信託利益"],"a":1,"e":"受託人應依信託本旨，以善良管理人之注意處理信託事務（第 22 條）；不得以任何名義享有信託利益，但與他人為共同受益人時不在此限（第 34 條）。"},
{"s":"民法與信託法","t":"信託消滅","art":"信託法 第63條","q":"信託利益由委託人全部享有者（自益信託），可否終止信託？","o":["不得終止","委託人或其繼承人得隨時終止信託","須經受託人同意始得終止","須經法院許可始得終止"],"a":1,"e":"委託人或其繼承人得隨時終止信託；於不利於受託人之時期終止者，應負損害賠償責任，但有不得已之事由者不在此限。他益信託則依第 3 條，非經受益人同意不得變更受益人或終止信託。"},
{"s":"民法與信託法","t":"信託消滅","art":"信託法 第65條","q":"信託關係消滅時，信託行為未另有訂定者，信託財產歸屬順序為何？","o":["受託人 → 委託人","享有全部信託利益之受益人 → 委託人或其繼承人","國庫 → 委託人","委託人 → 受益人"],"a":1,"e":"除信託行為另有訂定外，依序歸屬：①享有全部信託利益之受益人；②委託人或其繼承人。"},
{"s":"民法與信託法","t":"公益信託","art":"信託法 第70條、第75條","q":"關於公益信託，下列何者正確？","o":["設立無須許可，信託監察人可設可不設","應經目的事業主管機關許可，並應設置信託監察人","僅須向法院登記","由受益人選任受託人"],"a":1,"e":"公益信託之設立及其受託人，應經目的事業主管機關許可（第 70 條）；公益信託應置信託監察人（第 75 條）。"},
{"s":"民法與信託法","t":"物權通則","art":"民法 第757條","q":"關於物權之創設，民法採何種原則？","o":["契約自由原則","物權法定主義：物權除依法律或習慣外，不得創設","當事人合意即可創設","經登記即可創設任何物權"],"a":1,"e":"物權除依法律或習慣外，不得創設。習慣須具備慣行事實及法的確信，且不違反公序良俗。"},
{"s":"民法與信託法","t":"所有權","art":"民法 第765條","q":"所有人於法令限制範圍內，對所有物有何權能？","o":["僅能使用","得自由使用、收益、處分其所有物，並排除他人之干涉","僅能處分","僅能收益"],"a":1,"e":"所有人，於法令限制之範圍內，得自由使用、收益、處分其所有物，並排除他人之干涉。"},
{"s":"民法與信託法","t":"所有權","art":"民法 第767條","q":"所有權人的物上請求權，不包括下列何者？","o":["所有物返還請求權","除去妨害請求權","防止妨害請求權","損害賠償請求權"],"a":3,"e":"所有人對於無權占有或侵奪其所有物者，得請求返還之；對於妨害其所有權者，得請求除去之；有妨害其所有權之虞者，得請求防止之。損害賠償屬侵權行為（債）的請求權。"},
{"s":"民法與信託法","t":"相鄰關係","art":"民法 第787條","q":"土地因與公路無適宜之聯絡，致不能為通常使用時，所有人有何權利？","o":["請求政府開路","得通行周圍地以至公路（袋地通行權），但應於通行必要範圍內擇其周圍地損害最少之處所及方法，並支付償金","強制購買鄰地","無任何權利"],"a":1,"e":"袋地所有人得通行周圍地以至公路；通行權人應於通行必要之範圍內，擇其周圍地損害最少之處所及方法為之，對於通行地因此所受之損害，並應支付償金。因土地所有人之任意行為所生者，不適用之。"},
