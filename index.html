{"s":"民法與信託法","t":"相鄰關係","art":"民法 第796條","q":"土地所有人建築房屋非因故意或重大過失逾越地界，鄰地所有人知其越界而不即提出異議，效果為何？","o":["仍得隨時請求移去","不得請求移去或變更其房屋，但得請求土地所有人以相當之價額購買越界部分之土地，並得請求損害賠償","房屋歸鄰地所有人所有","須經法院拍賣"],"a":1,"e":"鄰地所有人知其越界而不即提出異議者，不得請求移去或變更其房屋。但土地所有人對於鄰地因此所受之損害，應支付償金；鄰地所有人並得請求以相當之價額購買越界部分之土地及因此形成之畸零地。"},
{"s":"民法與信託法","t":"共有","art":"民法 第817條","q":"各共有人之應有部分不明時，如何認定？","o":["依出資比例","推定其為均等","由法院裁定","依年齡比例"],"a":1,"e":"數人按其應有部分，對於一物有所有權者，為共有人。各共有人之應有部分不明者，推定其為均等。"},
{"s":"民法與信託法","t":"共有","art":"民法 第818條","q":"分別共有人對共有物的使用收益權，範圍為何？","o":["僅限其應有部分對應之特定位置","除契約另有約定外，按其應有部分，對於共有物之全部有使用收益之權","須經全體同意才能使用","無使用權"],"a":1,"e":"各共有人，除契約另有約定外，按其應有部分，對於共有物之全部，有使用收益之權。"},
{"s":"民法與信託法","t":"共有","art":"民法 第819條","q":"關於共有人對其應有部分與共有物之處分，下列何者正確？","o":["應有部分處分須全體同意","各共有人得自由處分其應有部分；共有物之處分、變更及設定負擔，應得共有人全體之同意","共有物處分過半數同意即可","兩者均可自由處分"],"a":1,"e":"各共有人得自由處分其應有部分。共有物之處分、變更、及設定負擔，應得共有人全體之同意（但不動產另有土地法第 34 條之 1 多數決的特別規定）。"},
{"s":"民法與信託法","t":"共有","art":"民法 第821條","q":"共有人對於第三人，可否就共有物之全部為本於所有權之請求？","o":["不可，須全體共同起訴","各共有人得就共有物之全部為本於所有權之請求；但回復共有物之請求，僅得為共有人全體之利益為之","只能就自己應有部分請求","須經法院許可"],"a":1,"e":"各共有人對於第三人，得就共有物之全部為本於所有權之請求。但回復共有物之請求，僅得為共有人全體之利益為之。"},
{"s":"民法與信託法","t":"共有","art":"民法 第824條","q":"共有物分割之方法，不能協議決定時，法院得如何裁判分割？","o":["只能變賣","原則以原物分配於各共有人；原物分配顯有困難時，得變賣共有物，以價金分配於各共有人","全部歸應有部分最多者","由地政機關決定"],"a":1,"e":"分割之方法不能協議決定者，法院得因任何共有人之請求，命為原物分配（必要時得以金錢補償），原物分配顯有困難時，得變賣共有物，以價金分配於各共有人；亦得原物分配與價金分配併用。"},
{"s":"民法與信託法","t":"共有","art":"民法 第826條之1","q":"不動產共有人間關於共有物使用、管理、分割或禁止分割之約定，經登記後有何效力？","o":["僅對當事人有效","對於應有部分之受讓人或取得物權之人，具有效力","無效","僅對債權人有效"],"a":1,"e":"不動產共有人間關於共有物使用、管理、分割或禁止分割之約定或依法所為之決定，於登記後，對於應有部分之受讓人或取得物權之人，具有效力。"},
{"s":"民法與信託法","t":"公同共有","art":"民法 第827條、第828條","q":"關於公同共有，下列何者正確？","o":["可依當事人合意任意成立","依法律規定、習慣或法律行為成一公同關係之數人，基於其公同關係而共有一物；公同共有物之處分及其他權利之行使，除法律另有規定外，應得公同共有人全體之同意","各公同共有人可自由處分其潛在應有部分","過半數同意即可處分"],"a":1,"e":"公同共有如繼承、合夥。公同共有物之處分及其他權利之行使，除法律或契約另有規定外，應得公同共有人全體之同意（不動產另有土地法第 34 條之 1 第 5 項準用多數決）。"},
{"s":"民法與信託法","t":"地上權","art":"民法 第832條","q":"普通地上權的定義為何？","o":["在他人土地上耕作之權","以在他人土地之上下有建築物或其他工作物為目的而使用其土地之權","在他人土地上通行之權","在他人土地上採取土石之權"],"a":1,"e":"稱普通地上權者，謂以在他人土地之上下有建築物或其他工作物為目的而使用其土地之權。"},
{"s":"民法與信託法","t":"地上權","art":"民法 第833條之1","q":"地上權未定有期限，存續已逾二十年者，法院得如何處理？","o":["當然消滅","法院得因當事人之請求，斟酌地上權成立之目的、建築物或工作物之種類、性質及利用狀況等情形，定其存續期間或終止其地上權","自動延長二十年","轉為所有權"],"a":1,"e":"地上權未定有期限者，存續期間逾二十年或地上權成立之目的已不存在時，法院得因當事人之請求，定其存續期間或終止其地上權。"},
{"s":"民法與信託法","t":"地上權","art":"民法 第840條","q":"地上權人之工作物為建築物者，地上權因存續期間屆滿而消滅時，地上權人有何權利？","o":["無權利","得請求土地所有人按該建築物之時價為補償","得請求延長二十年","得取得土地所有權"],"a":1,"e":"地上權因存續期間屆滿而消滅者，除契約另有約定外，地上權人得請求土地所有人按該建築物之時價為補償。土地所有人拒絕補償或不能協議者，得請求延長地上權期間。"},
{"s":"民法與信託法","t":"區分地上權","art":"民法 第841條之1","q":"「區分地上權」的定義為何？","o":["共有人分別設定之地上權","以在他人土地上下之一定空間範圍內設定之地上權","以區分所有建物為標的之地上權","為公益目的設定之地上權"],"a":1,"e":"稱區分地上權者，謂以在他人土地上下之一定空間範圍內設定之地上權，例如捷運地下段、空中走廊。"},
{"s":"民法與信託法","t":"農育權","art":"民法 第850條之1","q":"農育權的定義為何？","o":["在他人土地為農作、森林、養殖、畜牧、種植竹木或保育之權","在他人土地建築農舍之權","承租他人耕地之權","購買農地之權"],"a":0,"e":"稱農育權者，謂在他人土地為農作、森林、養殖、畜牧、種植竹木或保育之權。"},
{"s":"民法與信託法","t":"不動產役權","art":"民法 第851條","q":"不動產役權的定義為何？","o":["以他人不動產供自己不動產通行、汲水、採光、眺望、電信或其他以特定便宜之用為目的之權","在他人土地上建築之權","承租他人不動產之權","擔保債權之權"],"a":0,"e":"稱不動產役權者，謂以他人不動產供自己不動產通行、汲水、採光、眺望、電信或其他以特定便宜之用為目的之權。"},
{"s":"民法與信託法","t":"不動產役權","art":"民法 第852條","q":"不動產役權得因時效而取得的條件為何？","o":["任何不動產役權均可","以繼續並表見者為限","以不繼續者為限","以不表見者為限"],"a":1,"e":"不動產役權因時效而取得者，以繼續並表見者為限。"},
{"s":"民法與信託法","t":"不動產役權","art":"民法 第853條","q":"不動產役權可否由需役不動產分離而為讓與？","o":["可以","不得由需役不動產分離而為讓與，或為其他權利之標的物（從屬性）","經供役地所有人同意即可","僅可單獨抵押"],"a":1,"e":"不動產役權不得由需役不動產分離而為讓與，或為其他權利之標的物。"},
{"s":"民法與信託法","t":"不動產役權","art":"民法 第859條之4","q":"不動產所有人可否在自己之不動產上設定不動產役權？","o":["不可","為使用不動產之便利，得就自己之數宗不動產設定不動產役權（自己不動產役權）","僅限公有土地","僅限都市土地"],"a":1,"e":"不動產役權，亦得就自己之不動產設定之。例如建商於大型社區開發時預先設定通行、景觀等役權。"},
{"s":"民法與信託法","t":"抵押權","art":"民法 第860條","q":"普通抵押權的定義為何？","o":["債權人占有債務人之動產","債權人對於債務人或第三人不移轉占有而供其債權擔保之不動產，得就該不動產賣得價金優先受償之權","債權人取得不動產所有權","債權人使用債務人不動產"],"a":1,"e":"稱普通抵押權者，謂債權人對於債務人或第三人不移轉占有而供其債權擔保之不動產，得就該不動產賣得價金優先受償之權。"},
{"s":"民法與信託法","t":"抵押權","art":"民法 第866條","q":"不動產所有人設定抵押權後，於同一不動產上設定地上權，致影響抵押權者，抵押權人可如何主張？","o":["該地上權當然無效","得聲請法院除去該權利或終止該租賃後拍賣","不得主張","須另行起訴撤銷"],"a":1,"e":"設定抵押權後於同一不動產上得設定地上權或其他以使用收益為目的之物權，或成立租賃關係；但其抵押權不因此而受影響。如有影響，抵押權人得聲請法院除去該權利或終止該租賃關係後拍賣之。"},
{"s":"民法與信託法","t":"抵押權","art":"民法 第867條","q":"不動產所有人設定抵押權後，將不動產讓與他人，抵押權受何影響？","o":["抵押權消滅","其抵押權不因此而受影響（追及效力）","須重新設定","抵押權轉為普通債權"],"a":1,"e":"不動產所有人設定抵押權後，得將不動產讓與他人。但其抵押權不因此而受影響。"},
{"s":"民法與信託法","t":"抵押權","art":"民法 第874條","q":"抵押物賣得之價金，如何分配？","o":["平均分配給所有債權人","除法律另有規定外，按各抵押權成立之次序分配之；其次序同者，依債權額比例分配","依債權成立先後","由法院自由裁量"],"a":1,"e":"抵押物賣得之價金，除法律另有規定外，按各抵押權成立之次序分配之。其次序同者，依債權額比例分配之。"},
{"s":"民法與信託法","t":"法定地上權","art":"民法 第876條","q":"設定抵押權時，土地及其上之建築物同屬一人，僅以土地設定抵押，拍賣後土地與建物分屬不同人，效果為何？","o":["建物應拆除","視為已有地上權之設定，其地租、期間及範圍由當事人協議定之","成立租賃關係","建物歸拍定人"],"a":1,"e":"設定抵押權時，土地及其土地上之建築物，同屬於一人所有，而僅以土地或僅以建築物為抵押者，於抵押物拍賣時，視為已有地上權之設定。土地及建物均為抵押物而拍定人各異時，亦同。"},
{"s":"民法與信託法","t":"抵押權","art":"民法 第877條","q":"土地所有人於設定抵押權後，在抵押之土地上營造建築物，抵押權人可如何主張？","o":["請求拆除建物","於必要時，得聲請法院將其建築物與土地併付拍賣，但對於建築物之價金無優先受償之權","建物當然屬抵押權人","不能主張"],"a":1,"e":"土地所有人於設定抵押權後，在抵押之土地上營造建築物者，抵押權人於必要時，得於強制執行程序中聲請法院將其建築物與土地併付拍賣。但對於建築物之價金，無優先受償之權。"},
{"s":"民法與信託法","t":"最高限額抵押","art":"民法 第881條之1","q":"最高限額抵押權的定義為何？","o":["擔保特定一筆債權","債務人或第三人提供其不動產為擔保，就債權人對債務人一定範圍內之不特定債權，在最高限額內設定之抵押權","擔保金額無上限","僅擔保利息"],"a":1,"e":"稱最高限額抵押權者，謂債務人或第三人提供其不動產為擔保，就債權人對債務人一定範圍內之不特定債權，在最高限額內設定之抵押權。"},
{"s":"民法與信託法","t":"最高限額抵押","art":"民法 第881條之4","q":"最高限額抵押權之原債權確定期日，不得逾幾年？","o":["十年","二十年","三十年","五十年"],"a":2,"e":"最高限額抵押權得約定其所擔保原債權應確定之期日，該確定之期日，自抵押權設定時起，不得逾三十年；逾三十年者，縮短為三十年。"},
{"s":"民法與信託法","t":"典權","art":"民法 第911條","q":"典權的定義為何？","o":["以不動產擔保債權","支付典價在他人之不動產為使用、收益，於他人不回贖時，取得該不動產所有權之權","承租他人不動產","在他人土地上建築"],"a":1,"e":"稱典權者，謂支付典價在他人之不動產為使用、收益，於他人不回贖時，取得該不動產所有權之權。"},
{"s":"民法與信託法","t":"典權","art":"民法 第915條","q":"典權存續中，典權人可否將典物轉典或出租？","o":["不可","除契約另有約定或另有習慣外，得將典物轉典或出租於他人；其期限不得逾原典權之期限，未定期限者不得定有期限","須經法院許可","僅可出租不可轉典"],"a":1,"e":"典權存續中，典權人得將典物轉典或出租於他人。但另有約定或另有習慣者，依其約定或習慣。典權定有期限者，其轉典或租賃之期限，不得逾原典權之期限；未定期限者，其轉典或租賃，不得定有期限。"},
{"s":"民法與信託法","t":"典權","art":"民法 第919條","q":"出典人將典物出賣於他人時，典權人有何權利？","o":["撤銷買賣","有以相同條件留買之權（優先購買權）","請求加倍返還典價","無任何權利"],"a":1,"e":"出典人將典物出賣於他人時，典權人有以相同條件留買之權。出典人應以書面通知典權人，典權人於收受出賣通知後十日內不以書面表示依相同條件留買者，其留買權視為拋棄。"},
{"s":"民法與信託法","t":"典權","art":"民法 第924條","q":"典權未定期限者，出典人回贖的期間限制為何？","o":["隨時可回贖，無限制","出典人得隨時以原典價回贖典物；但自出典後經過三十年不回贖者，典權人即取得典物所有權","須於十年內回贖","須於十五年內回贖"],"a":1,"e":"典權未定期限者，出典人得隨時以原典價回贖典物。但自出典後經過三十年不回贖者，典權人即取得典物所有權。"},
{"s":"民法與信託法","t":"租賃","art":"民法 第422條","q":"不動產之租賃契約，其期限逾一年者，未以字據訂立，效果為何？","o":["契約無效","視為不定期限之租賃","視為一年期租賃","須補辦公證"],"a":1,"e":"不動產之租賃契約，其期限逾一年者，應以字據訂立之，未以字據訂立者，視為不定期限之租賃。"},
{"s":"民法與信託法","t":"租賃","art":"民法 第425條之1","q":"土地及其土地上之房屋同屬一人所有，而僅將土地或房屋所有權讓與他人，致土地與房屋分屬不同人時，法律推定為何？","o":["推定地上權","推定在房屋得使用期限內，有租賃關係","推定使用借貸","房屋應拆除"],"a":1,"e":"土地及其土地上之房屋同屬一人所有，而僅將土地或僅將房屋所有權讓與他人，或將土地及房屋同時或先後讓與相異之人時，土地受讓人或房屋受讓人與讓與人間或房屋受讓人與土地受讓人間，推定在房屋得使用期限內，有租賃關係。其期限不受第 449 條第 1 項之限制。"},
{"s":"民法與信託法","t":"租賃","art":"民法 第426條之1","q":"租用基地建築房屋，承租人房屋所有權移轉時，基地租賃契約如何？","o":["當然終止","其基地租賃契約，對於房屋受讓人，仍繼續存在","須重新訂約","由出租人決定"],"a":1,"e":"租用基地建築房屋，承租人房屋所有權移轉時，其基地租賃契約，對於房屋受讓人，仍繼續存在。"},
{"s":"民法與信託法","t":"租賃","art":"民法 第426條之2","q":"租用基地建築房屋，出租人出賣基地時，承租人有何權利？","o":["無權利","有依同樣條件優先承買之權；承租人出賣房屋時，基地所有人亦有優先承買權","得撤銷買賣","得請求減租"],"a":1,"e":"租用基地建築房屋，出租人出賣基地時，承租人有依同樣條件優先承買之權。承租人出賣房屋時，基地所有人有依同樣條件優先承買之權。通知後十日內未以書面表示承買者，視為放棄。"},
{"s":"民法與信託法","t":"租賃","art":"民法 第440條","q":"租賃物為房屋者，承租人遲付租金總額達多少時，出租人才得定期催告後終止契約？","o":["一個月","二個月","三個月","六個月"],"a":1,"e":"承租人租金支付有遲延者，出租人得定相當期限催告其支付，承租人於期限內不為支付者，出租人得終止契約。租賃物為房屋者，遲付租金之總額，非達二個月之租額，不得依前項規定終止契約。"},
{"s":"民法與信託法","t":"租賃","art":"民法 第443條","q":"承租人可否將租賃物轉租於他人？","o":["一律可以","非經出租人承諾，不得轉租；但租賃物為房屋者，除有反對之約定外，承租人得將其一部分轉租於他人","一律不可","經法院許可即可"],"a":1,"e":"承租人非經出租人承諾，不得將租賃物轉租於他人。但租賃物為房屋者，除有反對之約定外，承租人得將其一部分轉租於他人。違反者，出租人得終止契約。"},
{"s":"民法與信託法","t":"總則","art":"民法 第12條","q":"依現行民法，滿幾歲為成年？","o":["十六歲","十八歲","二十歲","二十一歲"],"a":1,"e":"滿十八歲為成年（2023 年 1 月 1 日施行）。未滿七歲為無行為能力人；滿七歲以上之未成年人為限制行為能力人。"},
{"s":"民法與信託法","t":"夫妻財產制","art":"民法 第1030條之1","q":"剩餘財產差額分配請求權，下列何者「不」列入分配？","o":["婚後薪資所得","婚後購置之房屋","因繼承或其他無償取得之財產及慰撫金","婚後投資所得"],"a":2,"e":"法定財產制關係消滅時，夫或妻現存之婚後財產，扣除婚姻關係存續所負債務後，如有剩餘，其雙方剩餘財產之差額應平均分配。但因繼承或其他無償取得之財產、慰撫金，不在此限。"},
{"s":"民法與信託法","t":"夫妻財產制","art":"民法 第1030條之1第5項","q":"剩餘財產差額分配請求權的時效為何？","o":["自知有剩餘財產之差額時起一年；自法定財產制關係消滅時起三年","自知有剩餘財產之差額時起二年；自法定財產制關係消滅時起五年","十五年","無時效"],"a":1,"e":"剩餘財產差額之分配請求權，自請求權人知有剩餘財產之差額時起，二年間不行使而消滅；自法定財產制關係消滅時起，逾五年者，亦同。"},
{"s":"民法與信託法","t":"法定繼承","art":"民法 第1140條","q":"第一順序之繼承人，於繼承開始前死亡或喪失繼承權者，如何處理？","o":["由第二順序繼承","由其直系血親卑親屬代位繼承其應繼分","由配偶全部繼承","其應繼分歸國庫"],"a":1,"e":"第 1138 條所定第一順序之繼承人，有於繼承開始前死亡或喪失繼承權者，由其直系血親卑親屬代位繼承其應繼分。注意：拋棄繼承不發生代位繼承。"},
{"s":"民法與信託法","t":"法定繼承","art":"民法 第1145條","q":"下列何者為當然喪失繼承權之事由？","o":["與被繼承人長期不合","故意致被繼承人或應繼承人於死或雖未致死因而受刑之宣告者","未扶養被繼承人","拒絕繳納遺產稅"],"a":1,"e":"喪失繼承權事由：故意致被繼承人或應繼承人於死或雖未致死因而受刑之宣告；以詐欺或脅迫使被繼承人為關於繼承之遺囑或使其撤回或變更之；以詐欺或脅迫妨害被繼承人為關於繼承之遺囑；偽造、變造、隱匿或湮滅被繼承人關於繼承之遺囑；對於被繼承人有重大之虐待或侮辱情事，經被繼承人表示其不得繼承。"},
{"s":"民法與信託法","t":"法定繼承","art":"民法 第1146條","q":"繼承回復請求權的時效為何？","o":["自知悉被侵害之時起一年；自繼承開始時起五年","自知悉被侵害之時起二年；自繼承開始時起十年","十五年","無時效"],"a":1,"e":"繼承權被侵害者，被害人或其法定代理人得請求回復之。回復請求權，自知悉被侵害之時起，二年間不行使而消滅；自繼承開始時起逾十年者亦同。"},
{"s":"民法與信託法","t":"繼承效力","art":"民法 第1148條","q":"現行民法下，繼承人對被繼承人債務的清償責任為何？","o":["無限責任","以因繼承所得遺產為限，負清償責任（全面限定繼承）","不必清償","由配偶全部負擔"],"a":1,"e":"繼承人自繼承開始時，承受被繼承人財產上之一切權利、義務；但繼承人對於被繼承人之債務，以因繼承所得遺產為限，負清償責任（2009 年修正）。"},
{"s":"民法與信託法","t":"繼承效力","art":"民法 第1148條之1","q":"繼承人在繼承開始前幾年內，從被繼承人受有財產之贈與者，該財產視為其所得遺產？","o":["一年","二年","三年","五年"],"a":1,"e":"繼承人在繼承開始前二年內，從被繼承人受有財產之贈與者，該財產視為其所得遺產（計算有限責任範圍時納入）。"},
{"s":"民法與信託法","t":"繼承效力","art":"民法 第1151條","q":"繼承人有數人時，在分割遺產前，各繼承人對於遺產全部的關係為何？","o":["分別共有","公同共有","各自所有","由長子管理所有"],"a":1,"e":"繼承人有數人時，在分割遺產前，各繼承人對於遺產全部為公同共有。"},
{"s":"民法與信託法","t":"繼承效力","art":"民法 第1156條","q":"繼承人應於何時開具遺產清冊陳報法院？","o":["知悉其得繼承之時起一個月內","知悉其得繼承之時起三個月內","繼承開始時起六個月內","無期限"],"a":1,"e":"繼承人於知悉其得繼承之時起三個月內開具遺產清冊陳報法院。前項三個月期間，法院因繼承人之聲請，認為必要時，得延展之。"},
{"s":"民法與信託法","t":"遺產分割","art":"民法 第1164條","q":"繼承人得否隨時請求分割遺產？","o":["不可","除法律另有規定或契約另有訂定外，得隨時請求分割遺產","須五年後","須經法院許可"],"a":1,"e":"繼承人得隨時請求分割遺產。但法律另有規定或契約另有訂定者，不在此限。"},
{"s":"民法與信託法","t":"遺產分割","art":"民法 第1165條","q":"遺囑禁止遺產之分割者，其禁止效力以多久為限？","o":["五年","十年","二十年","三十年"],"a":1,"e":"被繼承人之遺囑，定有分割遺產之方法，或託他人代定者，從其所定。遺囑禁止遺產之分割者，其禁止之效力以十年為限。"},
{"s":"民法與信託法","t":"遺產分割","art":"民法 第1173條","q":"繼承人在繼承開始前，因下列何種事由從被繼承人受有財產之贈與，應加入遺產總額計算（歸扣）？","o":["生日禮物","結婚、分居或營業","醫療費用","學費"],"a":1,"e":"繼承人中有在繼承開始前因結婚、分居或營業，已從被繼承人受有財產之贈與者，應將該贈與價額加入繼承開始時被繼承人所有之財產中，為應繼遺產；但被繼承人於贈與時有反對之意思表示者，不在此限。"},
{"s":"民法與信託法","t":"拋棄繼承","art":"民法 第1175條","q":"拋棄繼承的效力，溯及何時？","o":["拋棄時","法院准予備查時","繼承開始時","遺產分割時"],"a":2,"e":"繼承之拋棄，溯及於繼承開始時發生效力。"},
{"s":"民法與信託法","t":"遺囑","art":"民法 第1190條","q":"自書遺囑的要件為何？","o":["可以電腦打字","應自書遺囑全文，記明年、月、日，並親自簽名；增減塗改應註明並另行簽名","須二人見證","須公證"],"a":1,"e":"自書遺囑者，應自書遺囑全文，記明年、月、日，並親自簽名；如有增減、塗改，應註明增減、塗改之處所及字數，另行簽名。"},
{"s":"民法與信託法","t":"遺囑","art":"民法 第1194條","q":"代筆遺囑應有幾位以上見證人？","o":["一人","二人","三人","五人"],"a":2,"e":"代筆遺囑，由遺囑人指定三人以上之見證人，由遺囑人口述遺囑意旨，使見證人中之一人筆記、宣讀、講解，經遺囑人認可後，記明年、月、日及代筆人之姓名，由見證人全體及遺囑人同行簽名。公證遺囑、密封遺囑、口授遺囑則為二人以上見證人。"},
{"s":"民法與信託法","t":"遺囑","art":"民法 第1196條","q":"口授遺囑的失效時點為何？","o":["遺囑人死亡時","自遺囑人能依其他方式為遺囑之時起，經過三個月而失其效力","作成後一年","作成後十年"],"a":1,"e":"口授遺囑，自遺囑人能依其他方式為遺囑之時起，經過三個月而失其效力。"},
{"s":"民法與信託法","t":"遺囑","art":"民法 第1198條","q":"下列何者「得」為遺囑見證人？","o":["未成年人","繼承人及其配偶或其直系血親","受遺贈人及其配偶或其直系血親","與遺囑人無親屬關係之成年友人"],"a":3,"e":"不得為遺囑見證人：未成年人；受監護或輔助宣告之人；繼承人及其配偶或其直系血親；受遺贈人及其配偶或其直系血親；為公證人或代行公證職務人之同居人、助理人或受僱人。"},
{"s":"民法與信託法","t":"遺囑","art":"民法 第1199條、第1220條","q":"關於遺囑之效力與撤回，下列何者正確？","o":["遺囑自作成時生效","遺囑自遺囑人死亡時發生效力；前後遺囑有相牴觸者，其牴觸之部分，前遺囑視為撤回","遺囑不得撤回","後遺囑一律無效"],"a":1,"e":"遺囑自遺囑人死亡時發生效力（第 1199 條）。遺囑人得隨時依遺囑之方式撤回遺囑之全部或一部（第 1219 條）；前後遺囑有相牴觸者，其牴觸之部分，前遺囑視為撤回（第 1220 條）。"},
{"s":"民法與信託法","t":"特留分","art":"民法 第1225條","q":"應得特留分之人，如因被繼承人所為之遺贈，致其應得之數不足者，可如何主張？","o":["撤銷全部遺囑","得按其不足之數由遺贈財產扣減之（扣減權）","請求國家補償","無權主張"],"a":1,"e":"應得特留分之人，如因被繼承人所為之遺贈，致其應得之數不足者，得按其不足之數由遺贈財產扣減之。受遺贈人有數人時，應按其所得遺贈價額比例扣減。"},
{"s":"民法與信託法","t":"信託總論","art":"信託法 第1條","q":"信託法所稱「信託」的定義為何？","o":["委託他人代為處理事務之契約","委託人將財產權移轉或為其他處分，使受託人依信託本旨，為受益人之利益或為特定之目的，管理或處分信託財產之關係","寄託財產","代理關係"],"a":1,"e":"稱信託者，謂委託人將財產權移轉或為其他處分，使受託人依信託本旨，為受益人之利益或為特定之目的，管理或處分信託財產之關係。"},
{"s":"民法與信託法","t":"信託總論","art":"信託法 第2條、第71條","q":"信託的成立方式，下列何者正確？","o":["只能以契約","除法律另有規定外，應以契約或遺囑為之；法人為增進公共利益，得經決議對外宣言自為委託人及受託人（宣言信託），限於公益信託","口頭即可","須經法院公證"],"a":1,"e":"信託，除法律另有規定外，應以契約或遺囑為之（第 2 條）。法人為增進公共利益，得經決議對外宣言自為委託人及受託人，並邀公眾加入為委託人，此宣言信託僅限公益信託（第 71 條）。"},
{"s":"民法與信託法","t":"信託財產","art":"信託法 第9條","q":"下列何者屬於信託財產？","o":["受託人之自有財產","受託人因信託財產之管理、處分、滅失、毀損或其他事由取得之財產權","委託人未移轉之財產","受益人之財產"],"a":1,"e":"受託人因信託行為取得之財產權為信託財產。受託人因信託財產之管理、處分、滅失、毀損或其他事由取得之財產權，仍屬信託財產（物上代位性）。"},
{"s":"民法與信託法","t":"信託財產","art":"信託法 第10條、第11條","q":"受託人死亡或破產時，信託財產如何處理？","o":["列入受託人遺產或破產財團","信託財產不屬於其遺產，亦不屬於其破產財團","由受託人繼承人取得","歸國庫"],"a":1,"e":"受託人死亡時，信託財產不屬於其遺產（第 10 條）；受託人破產時，信託財產不屬於其破產財團（第 11 條）。這是信託財產獨立性的展現。"},
{"s":"民法與信託法","t":"受託人","art":"信託法 第18條","q":"受託人違反信託本旨處分信託財產時，受益人可如何主張？","o":["只能請求損害賠償","得聲請法院撤銷其處分（相對人須為惡意等）；撤銷權自受益人知有撤銷原因時起一年間不行使，或自處分時起逾十年而消滅","處分當然無效","向主管機關檢舉"],"a":1,"e":"受託人違反信託本旨處分信託財產時，受益人得聲請法院撤銷其處分。受益人有數人者，得由其中一人為之。撤銷權自受益人知有撤銷原因時起，一年間不行使而消滅；自處分時起逾十年者，亦同。"},
{"s":"民法與信託法","t":"受託人","art":"信託法 第35條","q":"受託人可否將信託財產轉為自有財產？","o":["可以","原則不得；例外如經受益人書面同意並依市價取得、由集中市場競價取得、或有不得已事由經法院許可","經委託人口頭同意即可","信託滿五年後可以"],"a":1,"e":"受託人除有經受益人書面同意並依市價取得、由集中市場競價取得、或有不得已事由經法院許可等情形外，不得將信託財產轉為自有財產，或於該信託財產上設定或取得權利。"},
{"s":"民法與信託法","t":"受託人","art":"信託法 第36條","q":"受託人可否辭任？","o":["可隨時辭任","除信託行為另有訂定外，非經委託人及受益人之同意，不得辭任；但有不得已之事由時，得聲請法院許可其辭任","一律不得辭任","經主管機關同意即可"],"a":1,"e":"受託人除信託行為另有訂定外，非經委託人及受益人之同意，不得辭任。但有不得已之事由時，得聲請法院許可其辭任。"},
{"s":"民法與信託法","t":"信託監察人","art":"信託法 第52條","q":"何種情形下，法院得選任信託監察人？","o":["受託人要求時","受益人不特定、尚未存在或其他為保護受益人之利益認有必要時","委託人死亡時","任何時候"],"a":1,"e":"受益人不特定、尚未存在或其他為保護受益人之利益認有必要時，法院得因利害關係人或檢察官之聲請，選任一人或數人為信託監察人。但信託行為定有信託監察人或其選任方法者，從其所定。"},
{"s":"民法與信託法","t":"信託消滅","art":"信託法 第62條","q":"信託關係的消滅事由，下列何者正確？","o":["受託人死亡即消滅","因信託行為所定事由發生，或因信託目的已完成或不能完成而消滅","委託人死亡即消滅","受益人變更即消滅"],"a":1,"e":"信託關係，因信託行為所定事由發生，或因信託目的已完成或不能完成而消滅。委託人或受託人死亡，原則上不影響信託存續（第 8 條）。"},
{"s":"民法與信託法","t":"信託消滅","art":"信託法 第8條","q":"委託人死亡、破產或喪失行為能力時，信託關係如何？","o":["當然消滅","信託關係不因此而消滅；但信託行為另有訂定者，不在此限","由法院決定","轉為公益信託"],"a":1,"e":"信託關係不因委託人或受託人死亡、破產或喪失行為能力而消滅。但信託行為另有訂定者，不在此限。"},
{"s":"民法與信託法","t":"信託消滅","art":"信託法 第64條","q":"他益信託中，委託人與受益人可否終止信託？","o":["委託人單獨可隨時終止","委託人及受益人得隨時共同終止信託","受益人單獨可隨時終止","不得終止"],"a":1,"e":"信託利益非由委託人全部享有者，除信託行為另有訂定外，委託人及受益人得隨時共同終止信託。於不利於受託人之時期終止者，應負損害賠償責任。"},
{"s":"民法與信託法","t":"信託效力","art":"信託法 第3條","q":"委託人與受益人非同一人者，委託人可否變更受益人或終止信託？","o":["可隨時變更","除信託行為另有保留外，於信託成立後不得變更受益人或終止其信託，亦不得處分受益人之權利；但經受益人同意者，不在此限","須經法院許可","須經受託人同意"],"a":1,"e":"委託人與受益人非同一人者，委託人除信託行為另有保留外，於信託成立後不得變更受益人或終止其信託，亦不得處分受益人之權利。但經受益人同意者，不在此限。"},
{"s":"民法與信託法","t":"公益信託","art":"信託法 第69條","q":"公益信託的定義為何？","o":["以營利為目的之信託","以慈善、文化、學術、技藝、宗教、祭祀或其他以公共利益為目的之信託","受益人為政府之信託","由公務員擔任受託人之信託"],"a":1,"e":"稱公益信託者，謂以慈善、文化、學術、技藝、宗教、祭祀或其他以公共利益為目的之信託。"}
];

const $ = s => document.querySelector(s);
const KEY = "landexam-wrong-v3";
function loadWrong(){try{return new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){return new Set()}}
function saveWrong(){try{localStorage.setItem(KEY,JSON.stringify([...wrong]))}catch(e){}}
BANK.forEach((b,i)=>b.id=i);

let subj="all", topic="all", mode="quiz", deck=[], idx=0, answered=null, flipped=false;
let wrong = loadWrong();
let tally = {};

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function renderSubjects(){
  const list=[["all","全部",BANK.length],...SUBJECTS.map(s=>[s,s,BANK.filter(b=>b.s===s).length])];
  $("#subjects").innerHTML=`<span class="group-label">科目</span>`+list.map(([v,l,n])=>`<button class="chip" data-subj="${v}" aria-pressed="${v===subj}">${l}<span class="n">${n}</span></button>`).join("");
  document.querySelectorAll("[data-subj]").forEach(b=>b.onclick=()=>{subj=b.dataset.subj;topic="all";renderSubjects();renderTopics();build()});
}
function renderTopics(){
  const pool=BANK.filter(b=>subj==="all"||b.s===subj);
  const topics=[...new Set(pool.map(b=>b.t))];
  $("#topic").innerHTML=`<option value="all">全部考點（${pool.length}）</option>`+topics.map(t=>`<option value="${esc(t)}">${esc(t)}（${pool.filter(b=>b.t===t).length}）</option>`).join("");
  $("#topic").value=topic;
}
$("#topic").onchange=e=>{topic=e.target.value;build()};

function build(){
  let pool=BANK.filter(b=>(subj==="all"||b.s===subj)&&(topic==="all"||b.t===topic));
  if(mode==="wrong") pool=pool.filter(b=>wrong.has(b.id));
  // 選項順序每輪重新洗牌，避免記住「答案位置」
  deck=shuffle(pool).map(b=>{const ord=shuffle([0,1,2,3]);return {...b,o:ord.map(i=>b.o[i]),a:ord.indexOf(b.a)}});
  idx=0; answered=null; flipped=false; tally={};
  render(); renderStats();
}

function render(){
  const body=$("#body"), total=deck.length, tt=$("#topic-tag");
  $("#counter").textContent = total ? `${Math.min(idx+1,total)} / ${total}` : "0 / 0";
  $("#prog").style.width = total ? `${(Math.min(idx+(answered!==null||flipped?1:0),total)/total)*100}%` : "0";
  tt.hidden=true;

  if(!total){
    $("#law-tag").textContent = mode==="wrong" ? "錯題複習" : "";
    body.innerHTML = `<div class="done"><p class="q">${mode==="wrong"?"這個範圍目前沒有錯題。":"沒有符合的題目。"}</p><p class="hint">先到「測驗」模式作答，答錯的題目會自動收進錯題本。</p><button class="btn" id="go-quiz">開始測驗</button></div>`;
    $("#go-quiz").onclick=()=>setMode("quiz");
    return;
  }
  if(idx>=total){
    const vals=Object.values(tally), ok=vals.reduce((s,t)=>s+t.ok,0), n=vals.reduce((s,t)=>s+t.n,0);
    $("#law-tag").textContent="本輪結束";
    body.innerHTML = mode==="card"
      ? `<div class="done"><p class="q">${total} 張卡片都看完了。</p><button class="btn" id="again">再洗一輪</button></div>`
      : `<div class="done"><div class="big">${n?Math.round(ok/n*100):0}<small>%</small></div><p class="q">答對 ${ok} / ${n} 題</p><div class="actions"><button class="btn ghost" id="to-wrong">複習錯題</button><button class="btn" id="again">再洗一輪</button></div></div>`;
    $("#again").onclick=build;
    const tw=$("#to-wrong"); if(tw) tw.onclick=()=>setMode("wrong");
    return;
  }
  const c=deck[idx];
  $("#law-tag").textContent = c.s;
  tt.textContent=c.t; tt.hidden=false;

  if(mode==="card"){
    body.innerHTML = `<button class="card-flip" id="flip" aria-label="翻面">
        <div class="face-label">${flipped?"答案":"題目"}</div>
        <p class="q">${esc(c.q)}</p>
        ${flipped?`<p class="answer">${esc(c.o[c.a])}</p>`:`<p class="hint">點一下或按空白鍵看答案</p>`}
      </button>
      ${flipped?`<div class="explain"><span class="cite">${esc(c.art)}</span><p>${esc(c.e)}</p></div>`:""}
      <div class="actions"><button class="btn ghost" id="prev" ${idx===0?"disabled":""}>上一張</button><button class="btn" id="next">下一張</button></div>`;
    $("#flip").onclick=()=>{flipped=!flipped;render()};
    $("#prev").onclick=()=>{idx--;flipped=false;render()};
    $("#next").onclick=()=>{idx++;flipped=false;render()};
    return;
  }

  const keys="ABCD";
  body.innerHTML = `<p class="q">${esc(c.q)}</p>
    <div class="opts">${c.o.map((t,i)=>{
      let cls="opt";
      if(answered!==null){ if(i===c.a) cls+=" right"; else if(i===answered) cls+=" wrong"; else cls+=" dim"; }
      return `<button class="${cls}" data-i="${i}" ${answered!==null?"disabled":""}><span class="k">${keys[i]}</span><span>${esc(t)}</span></button>`;
    }).join("")}</div>
    ${answered!==null?`<div class="explain">
        <span class="verdict ${answered===c.a?"ok":"bad"}">${answered===c.a?"答對了。":`答錯了，正解是 ${keys[c.a]}。`}</span>
        <span class="cite">${esc(c.art)}</span>
        <p>${esc(c.e)}</p></div>
      <div class="actions"><button class="btn" id="next">${idx===total-1?"看結果":"下一題"}</button></div>`:""}`;
  body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  const nx=$("#next"); if(nx){nx.onclick=next; nx.focus({preventScroll:true});}
}

function choose(i){
  if(answered!==null) return;
  const c=deck[idx]; answered=i;
  const t=tally[c.s]||(tally[c.s]={n:0,ok:0}); t.n++;
  if(i===c.a){t.ok++; wrong.delete(c.id)} else wrong.add(c.id);
  saveWrong(); render(); renderStats();
}
function next(){idx++;answered=null;render()}

function renderStats(){
  const vals=Object.values(tally), n=vals.reduce((s,t)=>s+t.n,0), ok=vals.reduce((s,t)=>s+t.ok,0);
  $("#score").innerHTML = `${ok}<small>/ ${n} 題答對</small>`;
  $("#by-law").innerHTML = SUBJECTS.map(l=>{
    const t=tally[l]||{n:0,ok:0}, p=t.n?Math.round(t.ok/t.n*100):0;
    return `<div class="row"><div class="row-top"><span>${l}</span><span class="num">${t.ok}/${t.n}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`;
  }).join("");
  $("#wrong-count").innerHTML = `${wrong.size}<small>題待複習</small>`;
}

function setMode(m){
  mode=m;
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===m));
  build();
}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$("#restart").onclick=build;
$("#clear-wrong").onclick=()=>{wrong.clear();saveWrong();if(mode==="wrong")build();else renderStats()};

document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,select")) return;
  if(mode==="card"){ if(e.key===" "){e.preventDefault();const f=$("#flip");if(f)f.click()} else if(e.key==="ArrowRight"){const n=$("#next");if(n)n.click()} else if(e.key==="ArrowLeft"){const p=$("#prev");if(p&&!p.disabled)p.click()} return; }
  if(["1","2","3","4"].includes(e.key) && answered===null && deck[idx]){choose(+e.key-1)}
  else if(e.key==="Enter" && answered!==null && document.activeElement?.id!=="next"){e.preventDefault();next()}
});

renderSubjects(); renderTopics(); build();
</script>
</body>
</html>
